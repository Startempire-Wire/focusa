[package]
name = "focusa-license"
description = "Focusa LicenseGuard — tier evaluation, capability assertions, BSL boundary enforcement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

# Issue #598: keyring v3 compiles its in-process mock store unless a platform
# backend feature is enabled. Enable the real backend per target so persisted
# poll credentials actually reach the OS store and survive across processes.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Keyutils works headless (no keyring daemon / DBus required).
keyring = { workspace = true, features = ["linux-native"] }

[build-dependencies]
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }

[[bench]]
name = "entitlement_policy"
path = "benches/entitlement_policy.rs"
harness = false

[lints]
workspace = true
