[package]
name = "focusa-core"
description = "Focusa cognitive runtime core — all cognition primitives and deterministic prompt assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = []
context-vector-fastembed = ["dep:fastembed"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
oauth2 = { workspace = true }
keyring = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"
chrono-tz = "0.10"
petgraph = { workspace = true }
tree-sitter = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.7"
fastembed = { version = "=4.9.1", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
mdns-sd = "0.11"
if-addrs = "0.10"
async-trait = "0.1"
toml = "0.8"
focusa-license = { workspace = true }
parking_lot = "0.12"


[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
