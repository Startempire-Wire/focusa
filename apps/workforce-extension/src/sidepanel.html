<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Focusa Workforce</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <p class="eyebrow">FOCUSA</p>
      <h1>Workforce</h1>
      <p id="connection-status" class="status" role="status" aria-live="polite">Not connected</p>
    </header>
    <main>
      <section aria-labelledby="orientation-heading">
        <h2 id="orientation-heading">Orientation</h2>
        <p>Pair a daemon, then explicitly share the current tab and objective.</p>
      </section>
      <section aria-labelledby="creation-heading">
        <h2 id="creation-heading">Creation</h2>
        <p>No session has been preflighted.</p>
      </section>
      <section aria-labelledby="workforce-heading">
        <h2 id="workforce-heading">Workforce</h2>
        <p>Roster unavailable until a daemon is paired.</p>
      </section>
      <section aria-labelledby="audit-heading">
        <h2 id="audit-heading">Audit</h2>
        <p>Durable event stream is not connected.</p>
      </section>
    </main>
    <script type="module" src="sidepanel.mjs"></script>
  </body>
</html>
