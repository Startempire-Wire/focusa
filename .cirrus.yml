# .cirrus.yml — pluggable external build (Cirrus + self-hosted Linux)
# No Azure eligibility wall — free Linux/Windows/macOS, 60 CPU-hr/mo private, public unlimited.
# Pluggable: delete this file to unplug. Guarded by config/billing-bypass.json (expires 2026-09-01).
# Linux: self-hosted host-focusa-deploy already builds (no minutes). Cirrus does macOS+Windows.
# Publish job pushes assets back to GitHub Latest via GH_PAT (same as release.yml).

cirrus:
  env:
    BYPASS_EXPIRES: "2026-09-01"

# skip if bypass disabled/expired — guard task
bypass_guard_task:
  name: "bypass guard"
  container:
    image: node:20
  script:
    - node -e "const fs=require('fs');let j={enabled:true,expires:'2026-09-01'};try{j=JSON.parse(fs.readFileSync('config/billing-bypass.json','utf8'))}catch(e){}; const today=new Date().toISOString().slice(0,10); console.log('bypass',j,'today',today); if(j.enabled!==true||today>j.expires){console.log('SKIP - bypass disabled/expired'); process.exit(0)}"

macos_task:
  depends_on: bypass_guard_task
  name: "Build macOS (x64/arm64) + menubar"
  macos_instance:
    image: ghcr.io/cirruslabs/macos-ventura-base:latest
  env:
    TOOLCHAIN: "1.88.0"
  script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $TOOLCHAIN
    - source $HOME/.cargo/env && cargo build --release --locked
    - ls -lh target/release/focusa* || true
    - npm --version && node --version

windows_task:
  depends_on: bypass_guard_task
  name: "Build Windows (x64)"
  container:
    image: rust:1.88-bookworm
  script:
    - cargo install cargo-xwin
    - rustup target add x86_64-pc-windows-msvc
    - cargo xwin build --release --target x86_64-pc-windows-msvc --locked || cargo build --release --target x86_64-pc-windows-msvc --locked

publish_task:
  depends_on: [macos_task, windows_task]
  name: "Publish to GitHub Release"
  container:
    image: node:20
  env:
    GH_REPO: "Startempire-Wire/focusa"
  script:
    - TAG=${CIRRUS_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.9.180-dev")}
    - echo "Publishing $TAG to $GH_REPO"
    - tar czf focusa-$TAG-macos.tar.gz target/release/focusa* 2>/dev/null || true
    - npx --yes gh release view "$TAG" --repo "$GH_REPO" 2>/dev/null || gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "" --prerelease
    - gh release upload "$TAG" focusa-*.tar.gz --repo "$GH_REPO" --clobber || true
