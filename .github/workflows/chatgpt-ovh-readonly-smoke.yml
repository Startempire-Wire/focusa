name: ChatGPT to OVH reversible execution smoke
on:
  push:
    branches:
      - feat/chatgpt-ovh-runner-readonly-smoke-20261113
    paths:
      - .github/workflows/chatgpt-ovh-readonly-smoke.yml
permissions:
  contents: read
jobs:
  ovh-identity:
    name: Verify OVH identity and temporary file operation
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 2
    steps:
      - name: Identity and supported tools, read-only
        shell: bash
        run: |
          set -euo pipefail
          printf 'proof=chatgpt-ovh-write-readback-20261113\n'
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'hostname=%s\n' "$(hostname -s)"
          printf 'username=%s\n' "$(id -un)"
          printf 'uid=%s\n' "$(id -u)"
          printf 'os=%s\n' "$(uname -s)"
          for cmd in pi gh git ssh tailscale focusa wb; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf 'available_%s=true\n' "$cmd"
            else
              printf 'available_%s=false\n' "$cmd"
            fi
          done
      - name: Write verify and clean only runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?Runner temp not set}"
          probe_dir="$(mktemp -d "${RUNNER_TEMP}/chatgpt-ovh-probe.XXXXXXXX")"
          trap 'rm -rf -- "$probe_dir"' EXIT
          printf '%s\n' 'ovh-temporary-write-proof-20261113' > "$probe_dir/receipt"
          test "$(cat "$probe_dir/receipt")" = 'ovh-temporary-write-proof-20261113'
          printf 'temporary_write_readback=verified\n'
      - name: Inspect existing Wirebot CLI without contacting services
        shell: bash
        run: |
          set -euo pipefail
          printf 'wb_help_begin\n'
          timeout 5s wb --help 2>&1 | head -n 45 || true
          printf 'wb_help_end\n'
          if test -f "$HOME/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"; then
            printf 'pi_package_home_present=true\n'
          else
            printf 'pi_package_home_present=false\n'
          fi
          if test -x "$HOME/.local/bin/pi"; then
            printf 'pi_local_bin_present=true\n'
          else
            printf 'pi_local_bin_present=false\n'
          fi
          if test -x "$HOME/.cargo/bin/focusa"; then
            printf 'focusa_cargo_bin_present=true\n'
          else
            printf 'focusa_cargo_bin_present=false\n'
          fi
      - name: Inspect installed Pi version and canonical work CLI help
        shell: bash
        run: |
          set -euo pipefail
          printf 'pi_version_begin\n'
          timeout 8s "$HOME/.local/bin/pi" --version 2>&1 | head -n 8 || true
          printf 'pi_version_end\n'
          printf 'wb_queue_help_begin\n'
          timeout 5s wb queue --help 2>&1 | head -n 38 || true
          printf 'wb_queue_help_end\n'
          printf 'wb_focusa_help_begin\n'
          timeout 5s wb focusa --help 2>&1 | head -n 38 || true
          printf 'wb_focusa_help_end\n'
      - name: Inspect installed Pi flags and local daemon health
        shell: bash
        run: |
          set -euo pipefail
          printf 'pi_flags_begin\n'
          timeout 8s "$HOME/.local/bin/pi" --help 2>&1 | head -n 70 || true
          printf 'pi_flags_end\n'
          printf 'focusa_local_health_http='
          if command -v curl >/dev/null 2>&1; then
            curl --silent --output /dev/null --max-time 3 --write-out '%{http_code}\n'               http://127.0.0.1:8787/v1/health || printf 'unreachable\n'
          else
            printf 'curl_missing\n'
          fi
