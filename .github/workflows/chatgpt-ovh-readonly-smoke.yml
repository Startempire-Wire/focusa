name: ChatGPT to OVH reversible execution smoke
on:
  push:
    branches:
      - feat/chatgpt-ovh-runner-readonly-smoke-20261113
    paths:
      - .github/workflows/chatgpt-ovh-readonly-smoke.yml
permissions:
  contents: read
jobs:
  ovh-identity:
    name: Verify OVH identity and temporary file operation
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 2
    steps:
      - name: Identity and supported tools, read-only
        shell: bash
        run: |
          set -euo pipefail
          printf 'proof=chatgpt-ovh-write-readback-20261113\n'
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'hostname=%s\n' "$(hostname -s)"
          printf 'username=%s\n' "$(id -un)"
          printf 'uid=%s\n' "$(id -u)"
          printf 'os=%s\n' "$(uname -s)"
          for cmd in pi gh git ssh tailscale focusa wb; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf 'available_%s=true\n' "$cmd"
            else
              printf 'available_%s=false\n' "$cmd"
            fi
          done
      - name: Write verify and clean only runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?Runner temp not set}"
          probe_dir="$(mktemp -d "${RUNNER_TEMP}/chatgpt-ovh-probe.XXXXXXXX")"
          trap 'rm -rf -- "$probe_dir"' EXIT
          printf '%s\n' 'ovh-temporary-write-proof-20261113' > "$probe_dir/receipt"
          test "$(cat "$probe_dir/receipt")" = 'ovh-temporary-write-proof-20261113'
          printf 'temporary_write_readback=verified\n'
      - name: Inspect existing Wirebot CLI without contacting services
        shell: bash
        run: |
          set -euo pipefail
          printf 'wb_help_begin\n'
          timeout 5s wb --help 2>&1 | head -n 45 || true
          printf 'wb_help_end\n'
          if test -f "$HOME/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"; then
            printf 'pi_package_home_present=true\n'
          else
            printf 'pi_package_home_present=false\n'
          fi
          if test -x "$HOME/.local/bin/pi"; then
            printf 'pi_local_bin_present=true\n'
          else
            printf 'pi_local_bin_present=false\n'
          fi
          if test -x "$HOME/.cargo/bin/focusa"; then
            printf 'focusa_cargo_bin_present=true\n'
          else
            printf 'focusa_cargo_bin_present=false\n'
          fi
      - name: Inspect installed Pi version and canonical work CLI help
        shell: bash
        run: |
          set -euo pipefail
          printf 'pi_version_begin\n'
          timeout 8s "$HOME/.local/bin/pi" --version 2>&1 | head -n 8 || true
          printf 'pi_version_end\n'
          printf 'wb_queue_help_begin\n'
          timeout 5s wb queue --help 2>&1 | head -n 38 || true
          printf 'wb_queue_help_end\n'
          printf 'wb_focusa_help_begin\n'
          timeout 5s wb focusa --help 2>&1 | head -n 38 || true
          printf 'wb_focusa_help_end\n'
      - name: Inspect installed Pi flags and local daemon health
        shell: bash
        run: |
          set -euo pipefail
          printf 'pi_flags_begin\n'
          timeout 8s "$HOME/.local/bin/pi" --help 2>&1 | head -n 70 || true
          printf 'pi_flags_end\n'
          printf 'focusa_local_health_http='
          if command -v curl >/dev/null 2>&1; then
            curl --silent --output /dev/null --max-time 3 --write-out '%{http_code}\n'               http://127.0.0.1:8787/v1/health || printf 'unreachable\n'
          else
            printf 'curl_missing\n'
          fi
      - name: KnownHost private Tailscale reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          try:
              output = subprocess.run(["tailscale", "status", "--json"], capture_output=True, text=True, timeout=8, check=True)
              data = json.loads(output.stdout)
              peers = list((data.get("Peer") or {}).values())
              matches = []
              for peer in peers:
                  host = str(peer.get("HostName") or "").lower()
                  dns = str(peer.get("DNSName") or "").lower().rstrip(".")
                  if "knownhost" in host or "knownhost" in dns or host == "host" or dns.startswith("host.philoveracity.com"):
                      matches.append(peer)
              print("tailscale_status=available")
              print("knownhost_candidate_count=" + str(len(matches)))
              if len(matches) == 1:
                  peer = matches[0]
                  print("knownhost_online=" + str(bool(peer.get("Online", False))).lower())
                  target = str(peer.get("DNSName") or peer.get("HostName") or "").rstrip(".")
                  if target and peer.get("Online"):
                      try:
                          test = subprocess.run(["tailscale", "ping", "--c=1", "--timeout=6s", target], capture_output=True, text=True, timeout=9)
                          print("knownhost_tailscale_ping_success=" + str(test.returncode == 0).lower())
                      except Exception as error:
                          print("knownhost_tailscale_ping_error=" + type(error).__name__)
              else:
                  print("knownhost_reachability=not_verified_unambiguous_identity_missing")
          except Exception as error:
              print("tailscale_status_error=" + type(error).__name__)
          PY
      - name: KnownHost authenticated Tailscale SSH check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          try:
              state = subprocess.run(["tailscale", "status", "--json"], text=True, capture_output=True, timeout=6, check=True)
              peers = list((json.loads(state.stdout).get("Peer") or {}).values())
              matches = [p for p in peers if "knownhost" in str(p.get("HostName", "")).lower()
                         or "knownhost" in str(p.get("DNSName", "")).lower()
                         or str(p.get("DNSName", "")).lower().startswith("host.philoveracity.com")
                         or str(p.get("HostName", "")).lower() == "host"]
              if len(matches) != 1 or not matches[0].get("Online"):
                  print("knownhost_ssh=blocked_identity_or_offline")
              else:
                  target = str(matches[0].get("DNSName") or matches[0].get("HostName")).rstrip(".")
                  command = ["tailscale", "ssh", "root@" + target,
                             "printf 'remote_user='; id -un; printf 'remote_uid='; id -u; printf 'remote_host='; hostname -s"]
                  try:
                      result = subprocess.run(command, text=True, capture_output=True, timeout=12)
                      print("knownhost_ssh_exit=" + str(result.returncode))
                      for line in result.stdout.splitlines():
                          if line.startswith(("remote_user=", "remote_uid=", "remote_host=")):
                              print(line[:128])
                      if result.returncode != 0:
                          print("knownhost_ssh_failure=" + result.stderr[:240].replace("\\n"," "))
                  except subprocess.TimeoutExpired:
                      print("knownhost_ssh=timed_out")
          except Exception as error:
              print("knownhost_ssh_probe_error=" + type(error).__name__)
          PY
      - name: Check private Wirebot source availability through existing GH CLI
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            if GH_PROMPT_DISABLED=1 timeout 5s gh api -X GET repos/Startempire-Wire/wirebot-core --jq .full_name >/dev/null 2>&1; then
              echo 'private_wirebot_api_access=true'
            else
              echo 'private_wirebot_api_access=false'
            fi
          else
            echo 'private_wirebot_api_access=false'
          fi
      - name: Check durable service placement on OVH without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo 'durable-check-begin'
          if systemctl --user show-environment >/dev/null 2>&1; then echo 'user_systemd_usable=true'; else echo 'user_systemd_usable=false'; fi
          if command -v loginctl >/dev/null 2>&1; then loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null | sed 's/^/user_linger=/'; fi
          if sudo -n true >/dev/null 2>&1; then echo 'noninteractive_sudo=true'; else echo 'noninteractive_sudo=false'; fi
          if GH_PROMPT_DISABLED=1 timeout 5s gh api -X GET repos/Startempire-Wire/wirebot-core/issues?state=open\&per_page=1 >/dev/null 2>&1; then echo 'private_issue_read=true'; else echo 'private_issue_read=false'; fi
          echo 'durable-check-end'
      - name: Verify non-runner GitHub credentials for durable receiver
        shell: bash
        run: |
          set -euo pipefail
          if env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_API_URL -u GH_HOST GH_PROMPT_DISABLED=1 timeout 6s gh api repos/Startempire-Wire/wirebot-core --jq .full_name >/dev/null 2>&1; then
            echo 'persistent_github_auth=true'
          else
            echo 'persistent_github_auth=false'
          fi
          if sudo -n -u wirebot -H sh -c 'env -u GH_TOKEN -u GITHUB_TOKEN GH_PROMPT_DISABLED=1 timeout 6s gh api repos/Startempire-Wire/wirebot-core --jq .full_name >/dev/null 2>&1'; then
            echo 'service_identity_repo_access=true'
          else
            echo 'service_identity_repo_access=false'
          fi

      - name: Inspect live wirebot.chat homepage configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          d=json.loads(subprocess.run(["tailscale","status","--json"],capture_output=True,text=True,check=True,timeout=8).stdout)
          ps=[p for p in (d.get("Peer") or {}).values() if str(p.get("HostName","")).lower()=="host" or str(p.get("DNSName","")).lower().startswith("host.philoveracity.com") or "knownhost" in str(p.get("HostName","")).lower()]
          if len(ps)!=1 or not ps[0].get("Online"): raise SystemExit("knownhost_not_online_unambiguous")
          target=str(ps[0].get("DNSName") or ps[0].get("HostName")).rstrip(".")
          script="set -euo pipefail\np=/home/wirebot/public_html\nprintf 'ssh_user=%s\\n' \"$(id -un)\"\nprintf 'site_dir=%s\\n' \"$p\"\nstat -c 'site_owner=%U site_group=%G site_mode=%a' \"$p\"\nrunwp() { sudo -n -u wirebot -H wp --path=\"$p\" \"$@\"; }\nprintf 'wp_is_installed='\nrunwp core is-installed && echo true\nprintf 'show_on_front='\nrunwp option get show_on_front\nprintf 'page_on_front='\nrunwp option get page_on_front\nprintf 'page_for_posts='\nrunwp option get page_for_posts\nprintf 'active_theme='\nrunwp option get stylesheet\nprintf 'siteurl='\nrunwp option get siteurl\nprintf 'template_files_begin\\n'\nfor q in \"$p\"/wp-content/themes/*/front-page.php \"$p\"/wp-content/themes/*/home.php \"$p\"/wp-content/themes/*/templates/front-page.html; do\n  if test -f \"$q\"; then stat -c '%n owner=%U group=%G mode=%a' \"$q\"; fi\ndone\nprintf 'template_files_end\\n'\npageid=$(runwp option get page_on_front)\nif [[ \"$pageid\" =~ ^[1-9][0-9]*$ ]]; then\n printf 'homepage_post_status='\n runwp post get \"$pageid\" --field=post_status\n printf 'homepage_post_title='\n runwp post get \"$pageid\" --field=post_title\n printf 'homepage_content_length='\n runwp post get \"$pageid\" --field=post_content | wc -c\nfi"
          r=subprocess.run(["tailscale","ssh","root@"+target,"bash -s"],input=script,capture_output=True,text=True,timeout=50)
          print(r.stdout[-6000:])
          print("inspection_exit="+str(r.returncode))
          if r.returncode: print("inspect_error="+r.stderr[-1200:]); sys.exit(r.returncode)
          PY
