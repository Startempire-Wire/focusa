name: v0.9.135 locked-scope E2E reverification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v135-locked-scope-e2e.yml'
      - 'crates/focusa-cli/src/commands/install.rs'
      - 'crates/focusa-cli/src/commands/update.rs'
      - 'apps/pi-extension/src/ota-activation.ts'
      - 'apps/pi-extension/tests/ota-activation.test.mjs'

permissions:
  contents: read

jobs:
  macos-intel-ota-e2e:
    name: macOS Intel OTA and stale-runtime E2E
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@nightly
      - name: Prove updater integration and rollback on native Intel macOS
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cargo test -p focusa-cli commands::install::tests::npm_resolution_accepts_absolute_nonstandard_install -- --exact
          cargo test -p focusa-cli commands::install::tests::pi_extension_archive_install_is_checksum_stage_and_activation_safe -- --exact
          cargo test -p focusa-cli commands::update::tests::failed_update_restores_exact_pre_transaction_daemon_state -- --exact
          cargo test -p focusa-cli commands::update::tests::atomic_rollback_restores_previous_binary_and_removes_failed_candidate -- --exact
      - name: Exercise official signed extension through a ServBay-like npm path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current" "$RUNNER_TEMP/servbay/bin" "$RUNNER_TEMP/staged package"
          gh release download v0.9.135-dev --repo Startempire-Wire/focusa --dir "$RUNNER_TEMP/current" \
            --pattern focusa-pi-extension-v0.9.135-dev.tar.gz \
            --pattern SHA256SUMS.txt
          expected="$(awk '$2=="focusa-pi-extension-v0.9.135-dev.tar.gz"{print $1}' "$RUNNER_TEMP/current/SHA256SUMS.txt")"
          actual="$(shasum -a 256 "$RUNNER_TEMP/current/focusa-pi-extension-v0.9.135-dev.tar.gz" | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/current/focusa-pi-extension-v0.9.135-dev.tar.gz" -C "$RUNNER_TEMP/staged package"
          ln -s "$(command -v node)" "$RUNNER_TEMP/servbay/bin/node"
          ln -s "$(command -v npm)" "$RUNNER_TEMP/servbay/bin/npm"
          (
            cd "$RUNNER_TEMP/staged package/pi-extension"
            FOCUSA_NPM_BIN="$RUNNER_TEMP/servbay/bin/npm" "$RUNNER_TEMP/servbay/bin/npm" ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm run test:ota-activation
          )
      - name: Exercise v0.9.134 updater against v0.9.135 with nonstandard npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/old-home/.pi/agent/extensions" "$RUNNER_TEMP/old-data" "$RUNNER_TEMP/servbay-old/bin"
          gh release download v0.9.134-dev --repo Startempire-Wire/focusa --dir "$RUNNER_TEMP/previous" \
            --pattern focusa-v0.9.134-dev-x86_64-apple-darwin \
            --pattern focusa-daemon-v0.9.134-dev-x86_64-apple-darwin \
            --pattern focusa-tui-v0.9.134-dev-x86_64-apple-darwin \
            --pattern focusa-pi-extension-v0.9.134-dev.tar.gz
          chmod +x "$RUNNER_TEMP/previous"/*-x86_64-apple-darwin
          tar -xzf "$RUNNER_TEMP/previous/focusa-pi-extension-v0.9.134-dev.tar.gz" -C "$RUNNER_TEMP/old-home/.pi/agent/extensions"
          mv "$RUNNER_TEMP/old-home/.pi/agent/extensions/pi-extension" "$RUNNER_TEMP/old-home/.pi/agent/extensions/focusa"
          ln -s "$(command -v node)" "$RUNNER_TEMP/servbay-old/bin/node"
          ln -s "$(command -v npm)" "$RUNNER_TEMP/servbay-old/bin/npm"
          FOCUSA_BIND=127.0.0.1:8787 FOCUSA_DATA_DIR="$RUNNER_TEMP/old-data" \
            "$RUNNER_TEMP/previous/focusa-daemon-v0.9.134-dev-x86_64-apple-darwin" \
            >"$RUNNER_TEMP/old-daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8787/v1/health >/dev/null && break; sleep 0.1; done
          set +e
          HOME="$RUNNER_TEMP/old-home" FOCUSA_DEV_MODE=1 \
            FOCUSA_PI_EXTENSION_PACKAGE_JSON="$RUNNER_TEMP/old-home/.pi/agent/extensions/focusa/package.json" \
            FOCUSA_NPM_BIN="$RUNNER_TEMP/servbay-old/bin/npm" \
            PATH=/usr/bin:/bin:/usr/sbin \
            "$RUNNER_TEMP/previous/focusa-v0.9.134-dev-x86_64-apple-darwin" update apply \
              --channel dev --latest-version v0.9.135-dev --dry-run false --yes --allow-apply --json \
              >"$RUNNER_TEMP/previous-updater.json" 2>&1
          updater_rc=$?
          set -e
          if curl -fsS http://127.0.0.1:8787/v1/health >"$RUNNER_TEMP/post-rollback-health.json"; then
            daemon_state=running
            daemon_version="$(jq -r '.version // .data.version // "unknown"' "$RUNNER_TEMP/post-rollback-health.json")"
          else
            daemon_state=stopped
            daemon_version=unavailable
          fi
          extension_version="$(jq -r '.version' "$RUNNER_TEMP/old-home/.pi/agent/extensions/focusa/package.json")"
          printf 'previous_updater_rc=%s\npost_rollback_daemon=%s\npost_rollback_version=%s\npost_rollback_extension=%s\n' \
            "$updater_rc" "$daemon_state" "$daemon_version" "$extension_version" \
            | tee "$RUNNER_TEMP/previous-updater-verdict.txt"
          cat "$RUNNER_TEMP/previous-updater.json"
          kill "$daemon_pid" 2>/dev/null || true
          wait "$daemon_pid" 2>/dev/null || true
          trap - EXIT
      - name: Reproduce immediate-previous stale runtime through actual Pi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/ota-home/.local/state/focusa/update" "$RUNNER_TEMP/ota-sessions" "$RUNNER_TEMP/pi-project"
          if ! test -d "$RUNNER_TEMP/previous/pi-extension"; then
            gh release download v0.9.134-dev --repo Startempire-Wire/focusa --dir "$RUNNER_TEMP/previous" \
              --pattern focusa-pi-extension-v0.9.134-dev.tar.gz --clobber
            tar -xzf "$RUNNER_TEMP/previous/focusa-pi-extension-v0.9.134-dev.tar.gz" -C "$RUNNER_TEMP/previous"
          fi
          npm --prefix "$RUNNER_TEMP/previous/pi-extension" ci --ignore-scripts --no-audit --no-fund
          npm install --global @earendil-works/pi-coding-agent@0.82.1
          git -C "$RUNNER_TEMP/pi-project" init -q
          cat > "$RUNNER_TEMP/pi-project/.focusa-project.json" <<JSON
          {"schema":"focusa.project.v1","project_id":"mac-intel-ota-e2e","canonical_name":"Mac Intel OTA E2E","project_root":"$RUNNER_TEMP/pi-project"}
          JSON
          cat > "$RUNNER_TEMP/ota-home/.local/state/focusa/update/pi-extension-restart-required.json" <<JSON
          {"schema":"focusa.pi_extension_restart_required.v1","version":"0.9.135-dev","installed_at":"2026-07-28T00:00:00Z"}
          JSON
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          tmux kill-session -t focusa-ota-e2e 2>/dev/null || true
          tmux new-session -d -s focusa-ota-e2e -x 140 -y 45 -c "$RUNNER_TEMP/pi-project" \
            "env HOME=$RUNNER_TEMP/ota-home XDG_STATE_HOME=$RUNNER_TEMP/ota-home/.local/state PI_CODING_AGENT_SESSION_DIR=$RUNNER_TEMP/ota-sessions OPENAI_API_KEY=dummy pi --provider openai --model gpt-4o-mini --no-extensions -e $RUNNER_TEMP/previous/pi-extension/src/index.ts"
          sleep 12
          tmux send-keys -t focusa-ota-e2e Escape
          sleep 10
          tmux capture-pane -epJt focusa-ota-e2e -S -100 >"$RUNNER_TEMP/stale-runtime-pi.log"
          tmux kill-session -t focusa-ota-e2e 2>/dev/null || true
          marker="$RUNNER_TEMP/ota-home/.local/state/focusa/update/pi-extension-restart-required.json"
          receipt="$RUNNER_TEMP/ota-home/.local/state/focusa/update/pi-extension-activation-receipt.json"
          if grep -q 'focusa-activate-updated-extension' "$RUNNER_TEMP/stale-runtime-pi.log"; then
            verdict=DETECTED
          elif test -f "$marker" && ! test -f "$receipt"; then
            verdict=INVALID_NOT_PROCESSED
          else
            verdict=ABSENT
          fi
          printf 'stale_runtime_synthetic_message=%s\nmarker_remaining=%s\nreceipt_present=%s\n' \
            "$verdict" "$(test -f "$marker" && echo true || echo false)" "$(test -f "$receipt" && echo true || echo false)" \
            | tee "$RUNNER_TEMP/stale-runtime-verdict.txt"
      - name: Upload native macOS E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v135-macos-intel-ota-e2e
          path: |
            ${{ runner.temp }}/previous-updater.json
            ${{ runner.temp }}/previous-updater-verdict.txt
            ${{ runner.temp }}/post-rollback-health.json
            ${{ runner.temp }}/old-daemon.log
            ${{ runner.temp }}/stale-runtime-pi.log
            ${{ runner.temp }}/stale-runtime-verdict.txt
          if-no-files-found: warn
