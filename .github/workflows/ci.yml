name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-messages:
    name: Meaningful commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject Beads-only and generic commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="HEAD^"
          fi
          scripts/validate-commit-messages.sh --range "${BASE_SHA}..HEAD"

  work-loop-conformance:
    name: Work Loop Conformance Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trace normative MUSTs and prove release fails closed while coverage is incomplete
        run: python3 tests/work_loop_conformance_manifest_test.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          components: clippy
      - name: Process-health check + unit/integration tests
        env:
          FOCUSA_TEST_MODE: "1"
        run: python3 scripts/process-health-check.py --label "CI unit/integration tests" --command "cargo build -p focusa-api --bin focusa-daemon && cargo test --workspace"
      - name: Spec133 Phase 4 supervision and recovery gate
        run: bash tests/spec133_phase4_runtime_gate.sh
      - name: Spec133 Phase 5 writer and isolation gate
        run: bash tests/spec133_phase5_isolation_gate.sh
      - name: Process-health check + Clippy
        run: python3 scripts/process-health-check.py --label "CI clippy" --command "cargo clippy --workspace -- -D warnings"

  menubar:
    name: Menubar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/menubar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/menubar
        run: npm ci
      - name: Typecheck
        working-directory: apps/menubar
        run: npm run check
      - name: Web build
        working-directory: apps/menubar
        run: npm run build
      - name: Tauri package proof (non-release; updater signing proven separately)
        working-directory: apps/menubar
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/menubar/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'

  release-automation-static:
    name: Release Automation (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Auto-heal audit trail
        run: python3 scripts/auto-heal-audit.py

      - name: Static proof
        run: |
          chmod +x tests/release_deploy_automation_static_test.sh
          ./tests/release_deploy_automation_static_test.sh

  spec-gates:
    name: Spec Gates (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
      - name: Install Pi extension runtime dependencies
        working-directory: apps/pi-extension
        run: npm ci --ignore-scripts
      - name: Install CI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3 ripgrep
      - name: Pi 0.81 compaction and session-recovery release gate
        working-directory: apps/pi-extension
        run: |
          npm run check
          npm run lint
          node --test tests/*.test.mjs
      - name: Spec130A provider-overflow and persistence runtime gates
        run: |
          bash tests/spec130a_proactive_compaction_runtime_test.sh
          bash tests/spec130a_persistence_actor_static_test.sh
          python3 tests/spec130a_release_stress_static_test.py
          npx --yes tsx tests/spec130a_release_stress_runtime_test.mts
      - name: Spec104 static surface audit (no daemon needed)
        run: python3 tests/spec104_deep_focusa_surface_sweep.py --static-only
      - name: Spec104 Pi runtime scope integrity
        run: tests/spec104_pi_runtime_scope_integrity_test.sh
      - name: API contract probe
        timeout-minutes: 20
        env:
          FOCUSA_BIND: 127.0.0.1:18787
          DAEMON_STARTUP_TIMEOUT_SECS: 300
        run: |
          set -euo pipefail
          cargo build -p focusa-api --release --bin focusa-daemon
          ./target/release/focusa-daemon >/tmp/focusa-daemon-probe.log 2>&1 &
          DAEMON_PID=$!
          cleanup() {
            kill "$DAEMON_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          deadline=$((SECONDS + DAEMON_STARTUP_TIMEOUT_SECS))
          while (( SECONDS < deadline )); do
            if curl --max-time 2 -fsS http://127.0.0.1:18787/v1/health >/dev/null; then
              ready=true>>>>>>> 98e8154e (ci(spec130): bound API probe startup wait)
              break
            fi
            if ! kill -0 "$DAEMON_PID" >/dev/null 2>&1; then
              echo "focusa-daemon exited before API contract probe readiness" >&2
              tail -100 /tmp/focusa-daemon-probe.log >&2 || true
              exit 1
            fi>>>>>>> 98e8154e (ci(spec130): bound API probe startup wait)
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "focusa-daemon did not become ready within ${DAEMON_STARTUP_TIMEOUT_SECS}s" >&2
            ps -p "$DAEMON_PID" -o pid=,etime=,state=,command= >&2 || true
            tail -100 /tmp/focusa-daemon-probe.log >&2 || true
            exit 1
          fi>>>>>>> 98e8154e (ci(spec130): bound API probe startup wait)
          python3 scripts/api_contract_probe.py --base-url http://127.0.0.1:18787 --out /tmp/focusa_api_spec_audit.json
      - name: Strict spec compliance gates
        env:
          FOCUSA_BASE_URL: http://127.0.0.1:18787
          FOCUSA_BIND: 127.0.0.1:18787
        run: ./scripts/ci/run-spec-gates.sh
