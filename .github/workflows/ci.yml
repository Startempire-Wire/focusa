name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          components: clippy
      - name: Run unit/integration tests
        env:
          FOCUSA_TEST_MODE: "1"
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  menubar:
    name: Menubar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/menubar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/menubar
        run: npm ci
      - name: Typecheck
        working-directory: apps/menubar
        run: npm run check
      - name: Web build
        working-directory: apps/menubar
        run: npm run build
      - name: Tauri package proof
        working-directory: apps/menubar
        run: npm run tauri build -- --bundles app
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/menubar/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"

  spec-gates:
    name: Spec Gates (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
      - name: Install CI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3 ripgrep
      - name: API contract probe
        env:
          FOCUSA_BIND: 127.0.0.1:18787
        run: |
          set -euo pipefail
          cargo build -p focusa-api --release --bin focusa-daemon
          ./target/release/focusa-daemon >/tmp/focusa-daemon-probe.log 2>&1 &
          DAEMON_PID=$!
          cleanup() {
            kill "$DAEMON_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18787/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18787/v1/health >/dev/null
          python3 scripts/api_contract_probe.py --base-url http://127.0.0.1:18787 --out /tmp/focusa_api_spec_audit.json
      - name: Strict spec compliance gates
        env:
          FOCUSA_BASE_URL: http://127.0.0.1:18787
          FOCUSA_BIND: 127.0.0.1:18787
        run: ./scripts/ci/run-spec-gates.sh
