name: CI

on:
  # Spec 177 §3: docs/markdown-only changes never burn CI minutes.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner constraint: heavy cargo jobs are pinned to the OVH builder (8 cores,
# 22GB, dedicated) — the old CARGO_BUILD_JOBS=2 cap existed because the runner
# shared the production host (#328); it is raised to match the OVH box.
env:
  CARGO_BUILD_JOBS: '8'
  CARGO_INCREMENTAL: '0'
  # Container physpages ceiling (~14GB shared with production) kills rustc
  # during thin-LTO codegen (#328 root cause). Validation builds skip LTO;
  # release artifacts come from the separate release pipeline.
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  commit-messages:
    name: Meaningful commit messages
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject Beads-only and generic commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="HEAD^"
          fi
          scripts/validate-commit-messages.sh --range "${BASE_SHA}..HEAD"

  rust:
    name: Rust
    concurrency:
      group: focusa-cargo
      cancel-in-progress: false
    # TEMPORARY-OVH-LANE (until GitHub-hosted minutes restore ~2026-09-01):
    # heavy cargo build/test runs on the OVH builder runner.
    runs-on: [self-hosted, Linux, X64, ovh-build]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Process-health check + unit/integration tests
        env:
          FOCUSA_TEST_MODE: "1"
        run: python3 scripts/process-health-check.py --label "CI unit/integration tests" --command "cargo build -p focusa-api --bin focusa-daemon && cargo test --workspace -- --test-threads=1"
      - name: Process-health check + Clippy
        run: python3 scripts/process-health-check.py --label "CI clippy" --command "cargo clippy --workspace -- -D warnings"
      - name: Focused Pi package transaction + update gates
        env:
          FOCUSA_TEST_MODE: "1"
        run: |
          cargo test -p focusa-cli pi_package
          cargo test -p focusa-cli update
          cargo clippy -p focusa-cli --all-targets -- -D warnings

  # TEMPORARY: GitHub hosted macOS is billing-locked. This job remains the
  # restoration target; Codemagic supplies the required macOS proof meanwhile.
  # See docs/178-focusa-temporary-ci-provider-parity-and-github-restoration-spec.md.
  menubar:
    name: Menubar
    # Spec 178: visible restoration target, but non-authoritative while GitHub
    # hosted macOS is billing-locked. Codemagic release receipts fail closed.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/menubar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/menubar
        run: npm ci
      - name: Typecheck
        working-directory: apps/menubar
        run: npm run check
      - name: Web build
        working-directory: apps/menubar
        run: npm run build
      - name: Tauri package proof (non-release; updater signing proven separately)
        working-directory: apps/menubar
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/menubar/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'

  release-automation-static:
    name: Release Automation (static)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        timeout-minutes: 10
        run: |
          if command -v rg >/dev/null 2>&1; then echo "ripgrep already present"; exit 0; fi
          # Fix azure mirror hangs by clearing mirrorlist and using archive directly
          sudo rm -f /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          # Try apt with timeout, fallback to binary download to avoid mirror outage
          (timeout 45 sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y ripgrep) || true
          if command -v rg >/dev/null 2>&1; then echo "ripgrep installed via apt"; exit 0; fi
          echo "apt failed, installing ripgrep via static binary"
          curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/rg.tar.gz && tar -xzf /tmp/rg.tar.gz -C /tmp && sudo mv /tmp/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg && rg --version
      - name: Auto-heal audit trail
        run: python3 scripts/auto-heal-audit.py

      - name: Static proof
        run: |
          chmod +x tests/release_deploy_automation_static_test.sh
          ./tests/release_deploy_automation_static_test.sh

      - name: Installer/update policy + Pi discovery static gate
        run: bash tests/installer_update_policy_static_test.sh

      - name: Distribution parity report (#260, informational)
        run: |
          node scripts/audit-distribution-parity.mjs --json > /tmp/distribution-manifest.json || true
          python3 -c "import json; d=json.load(open('/tmp/distribution-manifest.json')); print('parity_ok=%s drift=%d' % (d['parity_ok'], len(d['drift']))); [print('  drift', r['surface'], r['source_value'], '->', r['observed_value']) for r in d['drift']]"

      - name: Release readiness evaluation (#265, informational)
        run: node scripts/release-readiness-evaluation.mjs || true


  spec-gates:
    name: Spec Gates (strict)
    concurrency:
      group: focusa-cargo
      cancel-in-progress: false
    # TEMPORARY-OVH-LANE (until GitHub-hosted minutes restore ~2026-09-01):
    # release daemon build/probe runs on the OVH builder runner.
    runs-on: [self-hosted, Linux, X64, ovh-build]
    env:
      CARGO_TARGET_DIR: /tmp/focusa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FOCUSA_CARGO_TARGET_DIR: /tmp/focusa-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          components: clippy
      - name: Install Pi extension runtime dependencies
        working-directory: apps/pi-extension
        run: |
          npm ci --ignore-scripts
          node ../../scripts/patch-pi-shrinkwrap-dependencies.mjs
          node scripts/patch-pi-shrinkwrap-dependencies.mjs
      - name: Install CI deps
        timeout-minutes: 10
        run: |
          need=0; command -v jq >/dev/null 2>&1 || need=1; command -v curl >/dev/null 2>&1 || need=1; command -v python3 >/dev/null 2>&1 || need=1; command -v rg >/dev/null 2>&1 || need=1
          if [ "$need" = 0 ]; then echo "CI deps already present"; exit 0; fi
          # jq/curl/python3 are preinstalled, only rg is typically missing
          if ! command -v rg >/dev/null 2>&1; then
            sudo rm -f /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
            (timeout 45 sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y ripgrep) || true
            if ! command -v rg >/dev/null 2>&1; then
              echo "apt failed, installing ripgrep via static binary"
              curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/rg.tar.gz && tar -xzf /tmp/rg.tar.gz -C /tmp && sudo mv /tmp/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg && rg --version
            fi
          fi
          command -v jq >/dev/null 2>&1 || (timeout 45 sudo apt-get update && sudo apt-get install -y jq || true)
          command -v curl >/dev/null 2>&1 || (timeout 45 sudo apt-get update && sudo apt-get install -y curl || true)
      - name: Pi 0.81 compaction and session-recovery release gate
        working-directory: apps/pi-extension
        run: |
          npm run check
          npm run lint
          node --test tests/*.test.mjs
      - name: Final release gap gate (OTA, authority/worktree, compaction, cache)
        run: tests/final_release_gap_gate.sh
      - name: Spec104 static surface audit (no daemon needed)
        run: python3 tests/spec104_deep_focusa_surface_sweep.py --static-only
      - name: Spec104 Pi runtime scope integrity
        run: tests/spec104_pi_runtime_scope_integrity_test.sh
      - name: API contract probe
        env:
          FOCUSA_BIND: 127.0.0.1:18787
          CARGO_PROFILE_RELEASE_LTO: off
        run: |
          set -euo pipefail
          cargo build -p focusa-api --release --bin focusa-daemon
          "$CARGO_TARGET_DIR/release/focusa-daemon" >/tmp/focusa-daemon-probe.log 2>&1 &
          DAEMON_PID=$!
          cleanup() {
            kill "$DAEMON_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          STARTUP_BUDGET_SECONDS=300
          for i in $(seq 1 "$STARTUP_BUDGET_SECONDS"); do
            if curl -fsS http://127.0.0.1:18787/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$DAEMON_PID" >/dev/null 2>&1; then
              echo "release daemon exited before health became ready" >&2
              tail -200 /tmp/focusa-daemon-probe.log >&2
              exit 1
            fi
            if (( i % 30 == 0 )); then
              echo "waiting for release daemon health: ${i}s/${STARTUP_BUDGET_SECONDS}s" >&2
              tail -40 /tmp/focusa-daemon-probe.log >&2 || true
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18787/v1/health >/dev/null; then
            echo "release daemon health exceeded ${STARTUP_BUDGET_SECONDS}s startup budget" >&2
            tail -200 /tmp/focusa-daemon-probe.log >&2
            exit 1
          fi
          python3 scripts/api_contract_probe.py --base-url http://127.0.0.1:18787 --out /tmp/focusa_api_spec_audit.json
      - name: Strict spec compliance gates
        env:
          FOCUSA_BASE_URL: http://127.0.0.1:18787
          FOCUSA_BIND: 127.0.0.1:18787
        run: ./scripts/ci/run-spec-gates.sh
      - name: Immediate ephemeral build cleanup
        if: ${{ always() }}
        run: ./scripts/ci/cleanup-ephemeral-build-target.sh "$CARGO_TARGET_DIR"
