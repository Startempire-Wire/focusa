name: NotebookLM vault alias discovery
on:
  push:
    branches: [test/notebooklm-video-20261116]
    paths: [.github/workflows/notebooklm-video-test.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 3
    steps:
      - name: Locate agent knowledge base and vault unlock alias without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "rbw_binary=$(command -v rbw >/dev/null && echo present || echo missing)"
          for f in "$HOME/.bashrc" "$HOME/.bash_aliases" "$HOME/.profile" "$HOME/.zshrc"; do
            if test -f "$f"; then
              echo "shell_config=$(basename "$f")"
              grep -Ein 'alias [A-Za-z0-9_-]*(vault|rbw|unlock)|function [A-Za-z0-9_-]*(vault|rbw|unlock)' "$f" | sed -E 's/=.*/=[definition withheld]/' | head -n 15 || true
            fi
          done
          for d in "$HOME/agent-knowledge-base" "$HOME/.agent-knowledge" "$HOME/knowledge" "$HOME/.config/wirebot"; do
            if test -d "$d"; then
              echo "knowledge_candidate=$d"
              find "$d" -maxdepth 2 -type f \( -iname '*rbw*' -o -iname '*vault*' -o -iname '*auth*' \) -printf '%P\n' | head -n 30
            fi
          done
          echo "probe_complete=true"
