name: Verify documented RBW access
on:
  push:
    branches: [test/notebooklm-video-20261116]
    paths: [.github/workflows/notebooklm-video-test.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 3
    steps:
      - name: Check documented root RBW installation and vault status without disclosing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          for userhome in /root /home/wirebot; do
            echo "home=$userhome"
            test -x "$userhome/.cargo/bin/rbw" && echo 'rbw_binary=present' || echo 'rbw_binary=absent'
            test -f "$userhome/.config/rbw/config.json" && echo 'rbw_config=present' || echo 'rbw_config=absent'
            test -f "$userhome/.config/rbw/pinentry-rbw" && echo 'rbw_pinentry=present' || echo 'rbw_pinentry=absent'
            test -f "$userhome/.config/rbw/.master" && echo 'rbw_master_file=present' || echo 'rbw_master_file=absent'
          done
          if sudo -n test -x /root/.cargo/bin/rbw; then
            echo 'root_rbw_executable=yes'
            sudo -n /root/.cargo/bin/rbw unlocked >/dev/null 2>&1 && echo 'root_vault=unlocked' || echo 'root_vault=locked_or_unavailable'
            sudo -n /root/.cargo/bin/rbw ls --fields name 2>/dev/null | grep -Ei 'google|notebooklm|gemini' | head -n 12 || true
          else
            echo 'root_rbw_executable=no'
          fi
