name: Read RBW procedure from Agent KB
on:
  push:
    branches: [test/notebooklm-video-20261116]
    paths: [.github/workflows/notebooklm-video-test.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 3
    steps:
      - name: Read RBW instructions, redact any credential-like values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/agent-kb/markdown/BITWARDEN_RBW.md')
          lines=p.read_text().splitlines()
          print('document_lines',len(lines))
          for i,line in enumerate(lines[:180],1):
            if any(s in line.lower() for s in ('password','token','secret','credential','key=','cookie','session','email','username')):
              print(f'{i}: [sensitive or auth-related line withheld]')
            else:
              print(f'{i}: {line[:180]}')
          PY
