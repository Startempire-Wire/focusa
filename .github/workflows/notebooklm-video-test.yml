name: Query Agent KB for RBW unlock guidance
on:
  push:
    branches: [test/notebooklm-video-20261116]
    paths: [.github/workflows/notebooklm-video-test.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 3
    steps:
      - name: Inspect Agent KB help and RBW documentation references without secrets
        shell: bash
        run: |
          set -euo pipefail
          echo 'agent_kb_cli_help'
          timeout 8s agent-kb --help 2>&1 | head -n 70 || true
          echo 'rbw_document_paths'
          find /home/agent-kb/markdown -maxdepth 5 -type f \( -iname '*rbw*' -o -iname '*vault*' -o -iname '*bitwarden*' \) -printf '%P\n' 2>/dev/null | head -n 60 || true
          echo 'rbw_reference_files'
          grep -RilE 'rbw|vault.unlock|bitwarden' /home/agent-kb/markdown --include='*.md' 2>/dev/null | head -n 35 || true
          echo 'probe_complete'
