name: Locate Agent KB on KnownHost then OVH
on:
  push:
    branches: [test/notebooklm-video-20261116]
    paths: [.github/workflows/notebooklm-video-test.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 5
    steps:
      - name: Search KnownHost first for Agent KB and RBW documentation
        shell: bash
        run: |
          set -euo pipefail
          echo "knownhost_search_begin"
          python3 - <<'PY'
          import subprocess,json
          try:
            j=json.loads(subprocess.check_output(['tailscale','status','--json'],timeout=8))
            peers=list((j.get('Peer') or {}).values())
            p=[x for x in peers if 'knownhost' in (str(x.get('HostName',''))+' '+str(x.get('DNSName',''))).lower() or str(x.get('DNSName','')).lower().startswith('host.philoveracity.com')]
            print('knownhost_candidates',len(p))
            if len(p)!=1: raise RuntimeError('knownhost identity ambiguous')
            target=(p[0].get('DNSName') or p[0].get('HostName')).rstrip('.')
            script="""set -eu; echo remote_host=$(hostname -s); for root in /root /home /opt /srv; do if test -d "$root"; then find "$root" -maxdepth 5 \( -iname '*agent*kb*' -o -iname '*agent*knowledge*' \) -print 2>/dev/null | head -n 25; fi; done; command -v rbw >/dev/null && echo rbw_present=yes || echo rbw_present=no"""
            result=subprocess.run(['ssh','-o','BatchMode=yes','-o','ConnectTimeout=8',target,'sh','-c',script],capture_output=True,text=True,timeout=35)
            print('knownhost_ssh_exit',result.returncode)
            print(result.stdout[:4000])
            print('knownhost_ssh_error_type', 'none' if result.returncode==0 else 'ssh_failed')
          except Exception as e: print('knownhost_probe_error',type(e).__name__,str(e)[:140])
          PY
          echo "ovh_search_begin"
          for root in /home /opt /srv; do
            test -d "$root" || continue
            find "$root" -maxdepth 5 \( -iname '*agent*kb*' -o -iname '*agent*knowledge*' \) -print 2>/dev/null | head -n 35 || true
          done
          for cmd in rbw agent-kb agentkb akb; do command -v "$cmd" >/dev/null && echo "command_present=$cmd" || true; done
