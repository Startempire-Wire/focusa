name: Structural Guards
on: [push, pull_request]
jobs:
  guards:
    # The guard is already wired into pre-commit/pre-push and is read-only.
    # Trusted source checks use the existing OVH build lane, never the KH
    # production/deploy runner or a paid hosted runner.
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    steps:
      - uses: actions/checkout@v6
      - name: Run structural guards (release failure-mode catalog)
        run: bash scripts/structural-guards.sh
