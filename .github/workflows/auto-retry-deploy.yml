name: Auto Heal Release Pipeline (quarantined compatibility)

# Spec147: automatic workflow_run authority moved to the governed Release
# Pipeline Watchdog. This compatibility surface is intentionally manual and
# mutation-free so two independent actors cannot retry the same failed run.

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed run to inspect; no retry is performed here
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  quarantine-notice:
    name: Route recovery through the governed watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Explain compatibility boundary
        env:
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "run=$FAILED_RUN_ID" \
            "status=quarantined" \
            "mutation=false" \
            "next=Release Pipeline Watchdog + self_heal_governor.py"
