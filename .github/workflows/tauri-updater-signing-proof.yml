name: Tauri Updater Signing Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/menubar/src-tauri/tauri.conf.json'
      - 'apps/menubar/package.json'
      - 'apps/menubar/package-lock.json'
      - '.github/workflows/tauri-updater-signing-proof.yml'

permissions:
  contents: read

jobs:
  signing-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/menubar/package-lock.json
      - name: Install locked Tauri CLI
        working-directory: apps/menubar
        run: npm ci --ignore-scripts
      - name: Install minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Sign and verify updater proof artifact
        working-directory: apps/menubar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          proof_dir="${RUNNER_TEMP}/focusa-updater-signing-proof"
          mkdir -m 0700 "$proof_dir"
          printf 'focusa-tauri-updater-signing-proof-v1\n' > "$proof_dir/artifact"
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > "$proof_dir/public.key"
          node_modules/.bin/tauri signer sign "$proof_dir/artifact" >/dev/null
          base64 -d "$proof_dir/artifact.sig" > "$proof_dir/artifact.minisig"
          public_key="$(tail -n 1 "$proof_dir/public.key")"
          test -n "$public_key"
          minisign -Vm "$proof_dir/artifact" -x "$proof_dir/artifact.minisig" -P "$public_key"
          echo "Tauri updater private key matches committed public key."
