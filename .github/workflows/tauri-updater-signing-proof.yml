name: Tauri Updater Signing Proof

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        default: v0.9.185
      sha:
        description: Immutable release commit SHA
        required: true
        default: f46a111155654ce7ba8840f4f253916db9b8c603

permissions:
  contents: write

concurrency:
  group: tauri-updater-signing-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  signing-proof:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v0.9.185"
          test "$RELEASE_SHA" = "f46a111155654ce7ba8840f4f253916db9b8c603"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          actual="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$actual" = "$RELEASE_SHA"
          echo "tauri_signing_identity=passed tag=$RELEASE_TAG sha=$actual"

      - name: Install locked Tauri CLI
        working-directory: apps/menubar
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          locked_version="$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          test "$(node_modules/.bin/tauri --version)" = "tauri-cli $locked_version"

      - name: Sign and verify immutable macOS updater archives
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?missing Tauri updater signing key}"
          : "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:?missing Tauri updater signing password}"
          work="${RUNNER_TEMP}/focusa-tauri-signing-${GITHUB_RUN_ID}"
          install -d -m 0700 "$work"
          cleanup() {
            python3 - "$work" <<'PY'
          import shutil
          import sys
          shutil.rmtree(sys.argv[1], ignore_errors=False)
          PY
          }
          trap cleanup EXIT

          git show "$RELEASE_SHA:apps/menubar/src-tauri/tauri.conf.json" > "$work/tauri.conf.json"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Focusa_*.app.tar.gz' \
            --dir "$work"
          mapfile -t archives < <(find "$work" -maxdepth 1 -type f -name 'Focusa_*.app.tar.gz' -print | sort)
          test "${#archives[@]}" -eq 2

          for archive in "${archives[@]}"; do
            apps/menubar/node_modules/.bin/tauri signer sign "$archive" >/dev/null
            test -s "$archive.sig"
            python3 - "$work/tauri.conf.json" "$archive" "$archive.sig" <<'PY'
          import base64
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          config = json.loads(Path(sys.argv[1]).read_text())
          public_box = base64.b64decode(config["plugins"]["updater"]["pubkey"], validate=True)
          public_raw = base64.b64decode(public_box.splitlines()[1], validate=True)
          signature_box = base64.b64decode(Path(sys.argv[3]).read_bytes(), validate=True)
          signature_raw = base64.b64decode(signature_box.splitlines()[1], validate=True)
          if len(public_raw) != 42 or len(signature_raw) != 74:
              raise SystemExit("invalid Minisign public key or signature length")
          if public_raw[:2] != b"Ed" or signature_raw[:2] not in (b"Ed", b"ED"):
              raise SystemExit("invalid Minisign algorithm identifier")
          if public_raw[2:10] != signature_raw[2:10]:
              raise SystemExit("updater signature key ID mismatch")
          message = Path(sys.argv[2]).read_bytes()
          if signature_raw[:2] == b"ED":
              message = hashlib.blake2b(message, digest_size=64).digest()
          Ed25519PublicKey.from_public_bytes(public_raw[10:]).verify(signature_raw[10:], message)
          print(f"verified={Path(sys.argv[2]).name} sha256={hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest()}")
          PY
          done

          mapfile -t signatures < <(find "$work" -maxdepth 1 -type f -name 'Focusa_*.app.tar.gz.sig' -print | sort)
          test "${#signatures[@]}" -eq 2
          gh release upload "$RELEASE_TAG" "${signatures[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          for signature in "${signatures[@]}"; do
            printf 'uploaded=%s sha256=%s\n' \
              "$(basename "$signature")" \
              "$(sha256sum "$signature" | awk '{print $1}')"
          done
