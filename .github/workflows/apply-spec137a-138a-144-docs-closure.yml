name: Apply Spec 137A 138A 144 documentation closure

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_spec137a_138a_144_docs_closure.py
      - scripts/harden_spec137a_138a_144_docs_closure.py
      - scripts/finalize_spec137a_138a_144_docs_closure.py
      - .github/workflows/apply-spec137a-138a-144-docs-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spec137a-138a-144-docs-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile exhaustive source and primitive-owner hardening
        id: harden
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/harden_spec137a_138a_144_docs_closure.py > /tmp/spec-closure-hardening.log 2>&1
          status=$?
          cat /tmp/spec-closure-hardening.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Restore evidence-bound runtime activation
        if: steps.harden.outputs.status == '0'
        shell: bash
        run: |
          python3 scripts/activate-spec144-150-runtime-ledgers.py --apply
          python3 scripts/activate-spec138-tool-grounding.py --apply
      - name: Finalize generated validation gate
        if: steps.harden.outputs.status == '0'
        run: python3 scripts/finalize_spec137a_138a_144_docs_closure.py
      - name: Validate generated closure contracts
        id: validate
        if: steps.harden.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tests/spec137a_138a_144_documentation_closure_gate.py > /tmp/spec-closure-validation.log 2>&1
          status=$?
          cat /tmp/spec-closure-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Persist hardening and validation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p docs/evidence
          {
            echo "# Spec 137A/138A/144 maintained closure workflow"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Hardening exit status: ${{ steps.harden.outputs.status }}"
            echo "Validation exit status: ${{ steps.validate.outputs.status }}"
            echo
            echo "## Hardening"
            echo '```text'
            cat /tmp/spec-closure-hardening.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Independent validation gate"
            echo '```text'
            cat /tmp/spec-closure-validation.log 2>/dev/null || true
            echo '```'
          } > docs/evidence/spec137a-138a-144-independent-closure-validation.md
          cp docs/evidence/spec137a-138a-144-independent-closure-validation.md docs/evidence/spec137a-138a-144-hardening-workflow-diagnostic.md
      - name: Commit generated documentation and evidence
        if: always()
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "focusa-docs-closure[bot]"
          git config user.email "focusa-docs-closure[bot]@users.noreply.github.com"
          git add docs scripts/ci/run-spec-gates.sh tests/spec137a_138a_144_documentation_closure_gate.py CHANGELOG.md
          git commit -m "docs: persist authoritative Spec closure validation"
          git push origin HEAD:main
      - name: Enforce closure workflow success
        if: steps.harden.outputs.status != '0' || steps.validate.outputs.status != '0'
        run: exit 1
