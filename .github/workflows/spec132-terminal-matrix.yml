name: Unrestricted demo all-platform artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-artifacts:
    name: Demo Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: .exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: demo-${{ matrix.target }}
      - name: Install cross for musl target
        if: ${{ matrix.musl == true }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build unrestricted demo binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.musl || false }}" = "true" ]; then
            cat > Cross.toml <<'EOF'
          [build.env]
          passthrough = ["CFLAGS_x86_64_unknown_linux_musl"]
          EOF
            export CFLAGS_x86_64_unknown_linux_musl="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"
            cross build --release --target "${{ matrix.target }}" --bins
          else
            cargo build --release --target "${{ matrix.target }}" --bins
          fi
          mkdir -p dist
          for bin in focusa focusa-daemon focusa-tui focusa-session-runner; do
            src="target/${{ matrix.target }}/release/${bin}${{ matrix.exe || '' }}"
            test -s "$src"
            cp "$src" "dist/${bin}-v0.9.144-demo.1-${{ matrix.target }}${{ matrix.exe || '' }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-rust-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-artifacts:
    name: Demo desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            family: macos
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            family: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            family: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            family: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: demo-desktop-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/menubar/package-lock.json
      - name: Install desktop dependencies
        working-directory: apps/menubar
        run: npm ci
      - name: Build unsigned macOS demo bundles
        if: ${{ matrix.family == 'macos' }}
        working-directory: apps/menubar
        shell: bash
        run: >-
          npm run tauri -- build --target "${{ matrix.target }}" --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Build unsigned Windows demo bundles
        if: ${{ matrix.family == 'windows' }}
        working-directory: apps/menubar
        shell: bash
        run: >-
          npm run tauri -- build --target "${{ matrix.target }}" --bundles nsis,msi
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: demo-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.app
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 7
