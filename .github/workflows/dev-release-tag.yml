name: Create Dev Release Tag

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Major/minor release lane, e.g. 0.9'
        required: true
        default: '0.9'
      tag:
        description: 'Exact approved release tag; empty selects the next stable patch'
        required: false
        type: string
      push:
        description: 'Push the approved tag and main'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  create-tag:
    name: Gate immutable candidate and start canonical release
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Set up hash-locked Python test environment
        run: scripts/ci/setup-python-test-env.sh
      - name: Install Pi extension runtime dependencies
        working-directory: apps/pi-extension
        run: npm ci --ignore-scripts

      - name: Configure git auth
        run: git config user.name "$GIT_AUTHOR_NAME" && git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Create approved immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_BASE: ${{ inputs.base }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          args=(--base "$APPROVED_BASE")
          if [ -n "$APPROVED_TAG" ]; then args+=(--tag "$APPROVED_TAG"); fi
          if [ "$PUSH" = true ]; then
            # Exact candidate CI must already be complete: this serial OVH lane
            # cannot wait for CI jobs queued behind itself.
            candidate=$(git rev-parse HEAD)
            gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$candidate" \
              --limit 10 --json status,conclusion,headSha | \
              jq -e --arg sha "$candidate" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")'
            scripts/create-dev-release-tag.sh "${args[@]}" --push --no-wait-ci --no-wait-deploy
            tag="v$(tr -d '[:space:]' < docs/current/.release-version-stamp)"
            sha=$(git rev-parse "$tag^{commit}")
            # GITHUB_TOKEN pushes do not trigger workflows. Dispatch the same
            # canonical release workflow from its tag so signing has tag OIDC.
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" \
              -f release_tag="$tag" -f release_sha="$sha"
          else
            scripts/create-dev-release-tag.sh "${args[@]}" --dry-run
          fi
