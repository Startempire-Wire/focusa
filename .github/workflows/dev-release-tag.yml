name: Create Dev Release Tag

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Major/minor release lane, e.g. 0.9'
        required: true
        default: '0.9'
      tag:
        description: 'Exact approved release tag; empty selects the next stable patch'
        required: false
        type: string
      release_reason:
        description: 'Approved editorial history override reason; trust, version and strict gates remain required'
        required: false
        type: string
      push:
        description: 'Push the approved tag and main'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  create-tag:
    name: Gate immutable candidate and start canonical release
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 45
    env:
      # Existing approved OVH -> KH alias; KH authority remains loopback-only.
      FOCUSA_KH_RESOURCE_HEALTH_SSH_HOST: kh
      FOCUSA_API_SSH_HOST: kh
      AGENT_KB_API_URL: http://127.0.0.1:8791
      # Journal traffic goes to the existing private master; the KH health
      # check keeps its independently verified loopback-over-SSH route.
      AGENT_KB_RELEASE_API_URL: http://[fd7a:115c:a1e0::e539:8453]:8791
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure git auth
        run: git config user.name "$GIT_AUTHOR_NAME" && git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Create approved immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_BASE: ${{ inputs.base }}
          PUSH: ${{ inputs.push }}
          RELEASE_REASON: ${{ inputs.release_reason }}
        run: |
          set -euo pipefail
          args=(--base "$APPROVED_BASE")
          if [ -n "$APPROVED_TAG" ]; then args+=(--tag "$APPROVED_TAG"); fi
          if [ "$PUSH" = true ]; then
            if [ -n "$RELEASE_REASON" ]; then
              args+=(--force-release --release-reason "$RELEASE_REASON")
            fi
            # The helper gates on the final stamped SHA, not the input commit.
            # Yield this serial runner when CI is pending; do not dispatch Release.
            rc=0
            scripts/create-dev-release-tag.sh "${args[@]}" --push --no-wait-ci --no-wait-deploy || rc=$?
            if [ "$rc" -eq 78 ]; then
              printf 'Source CI pending. Resume the same candidate after exact-commit CI passes; nothing deployed.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
            tag="v$(tr -d '[:space:]' < docs/current/.release-version-stamp)"
            sha=$(git rev-parse "$tag^{commit}")
            # GITHUB_TOKEN pushes do not trigger workflows. Dispatch the same
            # canonical release workflow from its tag so signing has tag OIDC.
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" \
              -f release_tag="$tag" -f release_sha="$sha"
          else
            scripts/create-dev-release-tag.sh "${args[@]}" --dry-run
          fi
