name: deslop duplication gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deslop:
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DESLOP_CONFIG: config/deslop-tool.env
    steps:
      - uses: actions/checkout@v4

      - name: Verify local Deslop entrypoint contract
        shell: bash
        run: python3 tests/deslop_workflow_static_test.py

      # scripts/deslop is the single producer/download/container authority.
      # The published binary requires glibc >=2.34, so it remains inside the
      # immutable modern-glibc container rather than being installed on-host.
      - name: Run fail-closed Deslop scan
        shell: bash
        run: |
          set -euo pipefail
          # The local entry point owns download verification, immutable
          # container execution, resource bounds, and report projection.
          source "${DESLOP_CONFIG}"
          reports="${RUNNER_TEMP}/deslop-reports"
          runtime_dir="${RUNNER_TEMP}/podman-runtime"
          install -d -m 700 "${runtime_dir}"
          export XDG_RUNTIME_DIR="${runtime_dir}"
          mkdir -p "${reports}"
          find "${reports}" -mindepth 1 -maxdepth 1 -delete
          set +e
          DESLOP_REPORT_DIR="${reports}" scripts/deslop .
          scan_status=$?
          set -e
          printf '%s\n' "${scan_status}" > "${reports}/deslop-exit-code.txt"
          test -s "${reports}/deslop-report.json"
          test -s "${reports}/deslop-report.txt"
          test -s "${reports}/deslop-report.html"
          exit "${scan_status}"

      - name: Upload Deslop failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deslop-reports
          path: |
            ${{ runner.temp }}/deslop-reports/deslop-report.json
            ${{ runner.temp }}/deslop-reports/deslop-report.txt
            ${{ runner.temp }}/deslop-reports/deslop-report.html
            ${{ runner.temp }}/deslop-reports/deslop-exit-code.txt
          if-no-files-found: error
