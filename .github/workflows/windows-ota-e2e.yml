name: Windows OTA E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  windows-release-build-smoke:
    name: Windows release build (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            msvc_arch: amd64
          - target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Build canonical Rust release binaries
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"
          @("focusa", "focusa-daemon", "focusa-tui") | ForEach-Object {
            $path = "target/${{ matrix.target }}/release/$_.exe"
            if (-not (Test-Path $path -PathType Leaf)) { throw "missing $path" }
          }
      - name: Compile Windows desktop application
        working-directory: apps/menubar
        shell: pwsh
        run: |
          bun install
          bunx tauri build --no-bundle --target "${{ matrix.target }}"

  windows-dependency-preflight:
    name: Windows native dependency preflight (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-dependency-preflight-${{ matrix.architecture }}
      - name: Prove PATH, PATHEXT, semver, and UIAI health detection natively
        shell: pwsh
        run: |
          $runtimeArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($runtimeArch -ne '${{ matrix.architecture }}') {
            throw "native runner architecture mismatch: expected=${{ matrix.architecture }} actual=$runtimeArch"
          }
          cargo test -p focusa-cli windows_dependency_preflight_native_resolves_path_semver_and_health -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows native dependency preflight failed' }

  windows-ota:
    name: Windows native OTA (${{ matrix.architecture }})
    needs: [windows-dependency-preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            install_target: windows-x64
          - architecture: arm64
            runner: windows-11-arm
            install_target: windows-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ota-e2e-${{ matrix.architecture }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the real pinned Pi dependency
        shell: pwsh
        run: |
          npm install --global '@earendil-works/pi-coding-agent@0.81.1'
          if ($LASTEXITCODE -ne 0) { throw 'pinned Pi dependency install failed' }
          $pi = Get-Command pi -ErrorAction Stop
          $version = & $pi.Source --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '\d+\.\d+') {
            throw "installed Pi dependency is not executable/versioned: $($pi.Source) $version"
          }
      - name: Clean install v0.9.116 fixture, apply v0.9.117, rollback, reapply
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($runtimeArch -ne '${{ matrix.architecture }}') {
            throw "native runner architecture mismatch: expected=${{ matrix.architecture }} actual=$runtimeArch"
          }
          # Build before isolating HOME so rustup retains its provisioned toolchain.
          cargo build -p focusa-cli --bin focusa
          if ($LASTEXITCODE -ne 0) { throw 'candidate Windows build failed' }
          $candidate = Join-Path $PWD 'target\debug\focusa.exe'

          $root = Join-Path $env:RUNNER_TEMP 'focusa-windows-ota'
          $testHome = Join-Path $root 'home'
          $data = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $testHome, $data | Out-Null
          $sentinel = Join-Path $data 'user-state-sentinel.txt'
          'preserve-across-install-update-rollback-reapply' | Set-Content -Path $sentinel -Encoding utf8
          $sentinelHash = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          $env:HOME = $testHome
          $env:USERPROFILE = $testHome
          $env:LOCALAPPDATA = Join-Path $testHome 'AppData\Local'
          $env:PI_CODING_AGENT_DIR = Join-Path $testHome '.pi\agent'
          $env:FOCUSA_HOME = $data
          $env:FOCUSA_BIND = '127.0.0.1:18791'
          $env:FOCUSA_DAEMON_HEALTH_URL = 'http://127.0.0.1:18791/v1/health'

          # UIAI availability means a responsive Engine, not merely a file on
          # PATH. Keep the OTA fixture native and deterministic with a bounded
          # local health endpoint.
          $uiaiFixture = Join-Path $root 'uiai-health.py'
          @'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200 if self.path == "/health" else 404)
                  self.end_headers()
                  self.wfile.write(b"OK")
              def log_message(self, *_):
                  pass
          HTTPServer(("127.0.0.1", 17456), Handler).serve_forever()
          '@ | Set-Content -Path $uiaiFixture -Encoding utf8
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $uiaiFixtureProcess = Start-Process -FilePath $python -ArgumentList @('-u', $uiaiFixture) -PassThru -WindowStyle Hidden
          $env:UIAI_ENGINE_URL = 'http://127.0.0.1:17456'
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              Invoke-WebRequest "$env:UIAI_ENGINE_URL/health" -UseBasicParsing | Out-Null
              break
            } catch {
              if ($attempt -eq 20) { throw 'UIAI health fixture did not become ready' }
              Start-Sleep -Milliseconds 250
            }
          }

          function Invoke-FocusaJson {
            param(
              [string]$FilePath,
              [string[]]$Arguments,
              [string]$Name,
              [int]$TimeoutSeconds = 180
            )
            $stdout = Join-Path $root "$Name.stdout.json"
            $stderr = Join-Path $root "$Name.stderr.log"
            Write-Host "phase=$Name status=started"
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments `
              -WorkingDirectory $root -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$Name timed out after $TimeoutSeconds seconds"
            }
            if (Test-Path $stderr) {
              $stderrText = Get-Content $stderr -Raw
              if ($stderrText) { Write-Host $stderrText }
            }
            if ($process.ExitCode -ne 0) {
              throw "$Name exited $($process.ExitCode): $(Get-Content $stdout -Raw)"
            }
            Write-Host "phase=$Name status=completed"
            return (Get-Content $stdout -Raw | ConvertFrom-Json)
          }

          # Parse and route the historical preview bootstrap without mutation.
          # v0.9.116-dev/v0.9.117-dev are non-authoritative migration fixtures;
          # --eval here never projects production entitlement authority.
          & ./scripts/install-focusa.ps1 `
            -DryRun -Eval -Channel preview `
            -Target '${{ matrix.install_target }}' `
            -ReleaseTag v0.9.116-dev `
            -ReleaseBaseUrl 'https://github.com/Startempire-Wire/focusa/releases/download/v0.9.116-dev'

          # The real pinned Pi package must resolve and execute. UIAI availability
          # is its actual HTTP health contract, exercised by the bounded local
          # non-production endpoint rather than a renamed executable shim.
          $piResolved = (Get-Command pi -ErrorAction Stop).Source
          $piVersion = & $piResolved --version
          if ($LASTEXITCODE -ne 0 -or $piVersion -notmatch '\d+\.\d+') {
            throw "Pi dependency is not executable/versioned: $piResolved $piVersion"
          }
          if ((Invoke-WebRequest "$env:UIAI_ENGINE_URL/health" -UseBasicParsing).StatusCode -ne 200) {
            throw 'UIAI dependency health contract is not responsive'
          }
          $preflight = Invoke-FocusaJson -FilePath $candidate -Arguments @('--json', 'install', '--preflight', '--target=${{ matrix.install_target }}', '--channel=preview', '--eval', '--no-service') -Name 'preflight'
          if ($preflight.missing_dependencies.Count -ne 0) {
            throw "native dependency preflight reported missing dependencies: $($preflight.missing_dependencies -join ',')"
          }

          # Use the exact candidate to exercise transactional installation and
          # update against prior signed, non-authoritative preview fixtures.
          $env:FOCUSA_RELEASE_TAG = 'v0.9.116-dev'
          $env:FOCUSA_RELEASE_BASE_URL = 'https://github.com/Startempire-Wire/focusa/releases/download/v0.9.116-dev'
          & $candidate install --target='${{ matrix.install_target }}' --channel=preview --eval --no-service
          if ($LASTEXITCODE -ne 0) { throw 'candidate clean install failed' }

          $bin = Join-Path $env:HOME '.focusa\bin'
          $cli = Join-Path $bin 'focusa.exe'
          $daemon = Join-Path $bin 'focusa-daemon.exe'
          $tui = Join-Path $bin 'focusa-tui.exe'
          @($cli, $daemon, $tui) | ForEach-Object { if (-not (Test-Path $_)) { throw "missing installed binary: $_" } }
          if ((& $cli --version) -notmatch '0.9.116-dev') { throw 'clean install CLI mismatch' }

          $daemonProcess = Start-Process -FilePath $daemon -WorkingDirectory $root -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod 'http://127.0.0.1:18791/v1/health'
              if ($health.version -eq '0.9.116-dev') { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if ($health.version -ne '0.9.116-dev') { throw 'initial daemon health mismatch' }

          $scratch = $candidate
          $env:FOCUSA_RELEASE_TAG = 'v0.9.117-dev'
          $env:FOCUSA_RELEASE_BASE_URL = 'https://github.com/Startempire-Wire/focusa/releases/download/v0.9.117-dev'
          $env:FOCUSA_CLI_PATH = $cli
          $env:FOCUSA_DAEMON_PATH = $daemon
          $env:FOCUSA_TUI_PATH = $tui

          $plan = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $plan = Invoke-FocusaJson -FilePath $scratch -Arguments @('--json', 'update', 'plan', '--latest-version', 'v0.9.117-dev', '--daemon-health-url', 'http://127.0.0.1:18791/v1/health') -Name "plan-$attempt"
            $plan | ConvertTo-Json -Depth 8
            if ($plan.apply_blocked_until.Count -eq 0 -and $plan.latest.trust.deploy_proof_verified) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if ($plan.apply_blocked_until.Count -ne 0 -or -not $plan.latest.trust.deploy_proof_verified) {
            throw "trusted plan blocked after 3 attempts: $($plan.apply_blocked_until -join ',')"
          }
          $apply = Invoke-FocusaJson -FilePath $scratch -Arguments @('--json', 'update', 'apply', '--latest-version', 'v0.9.117-dev', '--daemon-health-url', 'http://127.0.0.1:18791/v1/health', '--dry-run=false', '--yes', '--allow-apply') -Name 'apply'
          $apply | ConvertTo-Json -Depth 8
          if (-not $apply.apply_executed) { throw "OTA apply not executed: $($apply.blocked_reason -join ',')" }
          $cliVersion = & $cli --version
          "applied_cli_version=$cliVersion"
          if ($cliVersion -notmatch '0.9.117-dev') { throw 'OTA apply CLI mismatch' }
          if ((& $daemon --version) -notmatch '0.9.117-dev') { throw 'OTA apply daemon mismatch' }
          if ((& $tui --version) -notmatch '0.9.117-dev') { throw 'OTA apply TUI mismatch' }
          $health = Invoke-RestMethod 'http://127.0.0.1:18791/v1/health'
          if ($health.version -ne '0.9.117-dev') { throw 'OTA apply health mismatch' }

          $rollback = Invoke-FocusaJson -FilePath $scratch -Arguments @('--json', 'update', 'rollback', '--part', 'all', '--dry-run=false', '--yes') -Name 'rollback'
          $rollback | ConvertTo-Json -Depth 8
          if (-not $rollback.rollback_executed) { throw 'rollback not executed' }
          Start-Sleep -Seconds 3
          if ((& $cli --version) -notmatch '0.9.116-dev') { throw 'rollback CLI mismatch' }
          if ((& $daemon --version) -notmatch '0.9.116-dev') { throw 'rollback daemon mismatch' }
          if ((& $tui --version) -notmatch '0.9.116-dev') { throw 'rollback TUI mismatch' }
          if ((Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $sentinelHash) { throw 'rollback mutated preserved user data' }
          $health = Invoke-RestMethod 'http://127.0.0.1:18791/v1/health'
          if ($health.version -ne '0.9.116-dev') { throw 'rollback health mismatch' }

          $reapply = Invoke-FocusaJson -FilePath $scratch -Arguments @('--json', 'update', 'apply', '--latest-version', 'v0.9.117-dev', '--daemon-health-url', 'http://127.0.0.1:18791/v1/health', '--dry-run=false', '--yes', '--allow-apply') -Name 'reapply'
          $reapply | ConvertTo-Json -Depth 8
          if (-not $reapply.apply_executed) { throw 'reapply not executed' }
          if ((& $cli --version) -notmatch '0.9.117-dev') { throw 'reapply CLI mismatch' }
          if ((& $daemon --version) -notmatch '0.9.117-dev') { throw 'reapply daemon mismatch' }
          if ((& $tui --version) -notmatch '0.9.117-dev') { throw 'reapply TUI mismatch' }
          $health = Invoke-RestMethod 'http://127.0.0.1:18791/v1/health'
          if ($health.version -ne '0.9.117-dev') { throw 'reapply health mismatch' }
          if ((Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $sentinelHash) { throw 'reapply mutated preserved user data' }

          $proof = [ordered]@{
            schema = 'focusa.windows_native_ota_proof.v1'
            architecture = '${{ matrix.architecture }}'
            install_target = '${{ matrix.install_target }}'
            runtime_architecture = $runtimeArch
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            historical_fixture_authority = 'non_authoritative_migration_fixture'
            production_entitlement_claimed = $false
            dependency_preflight = 'passed_without_dependency_install_or_executable_shim'
            release_trust = 'signed_v0.9.116-dev_to_v0.9.117-dev'
            phases = [ordered]@{
              clean_install = 'v0.9.116-dev'
              apply = 'v0.9.117-dev'
              rollback = 'v0.9.116-dev'
              reapply = 'v0.9.117-dev'
            }
            daemon_health = 'v0.9.117-dev'
            user_data_preserved = $true
            result = 'pass'
          }
          $proofPath = Join-Path $env:RUNNER_TEMP "windows-native-ota-${{ matrix.architecture }}.json"
          $proof | ConvertTo-Json -Depth 8 | Set-Content -Path $proofPath -Encoding utf8
          Stop-Process -Id $daemonProcess.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $uiaiFixtureProcess.Id -Force -ErrorAction SilentlyContinue
          "WINDOWS_OTA_E2E=PASS architecture=${{ matrix.architecture }} target=${{ matrix.install_target }}"
      - name: Upload native Windows OTA proof
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-ota-${{ matrix.architecture }}
          path: ${{ runner.temp }}/windows-native-ota-${{ matrix.architecture }}.json
          if-no-files-found: error

  locked-release-candidate-artifacts:
    name: REL.4 non-publishing candidate artifacts
    uses: ./.github/workflows/locked-release-candidate-artifacts.yml
    secrets: inherit
