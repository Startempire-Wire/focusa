name: Audit Recorder (self-heal trigger)

on:
  workflow_run:
    workflows: ["CI", "Release", "Deploy Live Daemon"]
    types: [completed]
  schedule:
    # Hourly drift check; auto-heal will keep the trail synchronized even
    # if a workflow did not run.
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-recorder
  cancel-in-progress: false

jobs:
  record-and-heal:
    name: Record failure + self-heal
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record CI failure (self-triggered)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          EVENT="${{ github.event.workflow_run.event }}"
          ATTEMPT="${{ github.event.workflow_run.run_attempt }}"
          URL="${{ github.event.workflow_run.html_url }}"
          LOG_URL="$URL"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<PY
import json, os
from pathlib import Path
p = Path("release-proof/audit/audit.jsonl")
entry = {
    "id": f"fail-{TS.replace(':','').replace('-','')}-{os.environ['RUN_ID']}",
    "ts": "$TS",
    "event": "failure",
    "subsystem": "ci",
    "scope": os.environ["WORKFLOW"],
    "category": "ci_workflow_failure",
    "symptom": f"{os.environ['WORKFLOW']} run {os.environ['RUN_ID']} concluded failure",
    "root_cause": "see workflow logs",
    "fix": "see auto-heal synthesis",
    "guard": "auto-heal-audit.py",
    "test": "scripts/auto-heal-audit.py",
    "linked_run": os.environ["RUN_ID"],
    "head_sha": os.environ["HEAD_SHA"],
    "branch": os.environ["BRANCH"],
    "github_event": os.environ["EVENT"],
    "run_attempt": os.environ["ATTEMPT"],
    "log_url": os.environ["LOG_URL"],
}
with p.open("a", encoding="utf-8") as fh:
    fh.write(json.dumps(entry, separators=(",", ":")) + "\n")
print("recorded", entry["id"])
PY

      - name: Self-heal audit trail
        run: python3 scripts/auto-heal-audit.py

      - name: Commit audit updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release-proof/audit/audit.jsonl; then
            echo "[audit-recorder] no audit changes"
            exit 0
          fi
          git config user.name 'focusa-bot'
          git config user.email 'bot@focusa.local'
          git add release-proof/audit/audit.jsonl
          git commit -m "audit: self-heal append from ${{ github.event_name }} @ ${{ github.run_id }}"
          git push