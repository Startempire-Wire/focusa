name: Audit Recorder (self-heal trigger)

on:
  workflow_run:
    workflows: ["CI", "Release", "Deploy Live Daemon", "Auto Heal Release Pipeline", "Release Pipeline Watchdog"]
    types: [completed]
  schedule:
    # Daily drift check; proactive self-heal only acts on recurring class thresholds.
    - cron: "17 0 * * *"

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: audit-recorder
  cancel-in-progress: false

jobs:
  record-and-heal:
    name: Record failure + self-heal
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record CI failure (self-triggered)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          LOG_URL: ${{ github.event.workflow_run.html_url }}
          TS: ${{ github.event.workflow_run.updated_at }}
          AUDIT_PATH: release-proof/audit/audit.jsonl
          FAILED_LOG_PATH: failed-workflow.log
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FAILED_LOG_PATH" 2>/dev/null || true
          python3 scripts/record-workflow-failure.py

      - name: Spec104 static surface audit
        run: python3 scripts/audit-schema.py spec104 release-proof/audit/audit.jsonl || echo "(audit result recorded; non-fatal warning)"

      - name: Propose system-level self-heal
        run: python3 scripts/propose-system-fix.py

      - name: Validate audit schema
        run: python3 scripts/audit-schema.py validate release-proof/audit/audit.jsonl

      - name: Open actionable self-heal PR only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f release-proof/audit/self-heal-result.json ]]; then
            echo "[audit-recorder] no self-heal result file"
            exit 0
          fi
          should_commit="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('release-proof/audit/self-heal-result.json')
          print('true' if json.loads(p.read_text()).get('should_commit') else 'false')
          PY
          )"
          if [[ "$should_commit" != "true" ]]; then
            echo "[audit-recorder] no actionable deliverable; suppressing passive audit commit"
            exit 0
          fi
          if git diff --quiet -- release-proof/audit/audit.jsonl release-proof/audit/self-heal-result.json; then
            echo "[audit-recorder] deliverable requested but no audit changes"
            exit 0
          fi
          branch="self-heal/${{ github.run_id }}"
          git config user.name 'focusa-bot'
          git config user.email 'bot@focusa.local'
          git checkout -B "$branch"
          git add release-proof/audit/audit.jsonl release-proof/audit/self-heal-result.json
          git commit -m "audit: actionable self-heal from ${{ github.event_name }} @ ${{ github.run_id }}"
          git push --set-upstream origin "$branch" --force-with-lease
          gh pr create \
            --title "[spec-122] Actionable self-heal from ${{ github.event_name }} @ ${{ github.run_id }}" \
            --body-file release-proof/audit/self-heal-result.json \
            --base main \
            --head "$branch" \
          || echo "[audit-recorder] PR may already exist for $branch"
