name: Audit Recorder (self-heal trigger)

on:
  workflow_dispatch:
  # DISABLED 2026-08-21 billing $623 burn - workflow_run + schedule removed, was workflow_run + cron 17 0 * * *

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: audit-recorder
  cancel-in-progress: false

jobs:
  record-and-heal:
    name: Record failure + self-heal
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}  # schedule disabled 2026-08-21
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record CI failure (self-triggered)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          LOG_URL: ${{ github.event.workflow_run.html_url }}
          TS: ${{ github.event.workflow_run.updated_at }}
          AUDIT_PATH: release-proof/audit/audit.jsonl
          FAILED_LOG_PATH: failed-workflow.log
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FAILED_LOG_PATH" 2>/dev/null || true
          python3 scripts/record-workflow-failure.py

      - name: Spec104 static surface audit
        run: python3 scripts/audit-schema.py spec104 release-proof/audit/audit.jsonl || echo "(audit result recorded; non-fatal warning)"

      - name: Propose system-level self-heal
        run: python3 scripts/propose-system-fix.py

      - name: Validate audit schema
        run: python3 scripts/audit-schema.py validate release-proof/audit/audit.jsonl

      - name: Open actionable self-heal PR only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f release-proof/audit/self-heal-result.json ]]; then
            echo "[audit-recorder] no self-heal result file"
            exit 0
          fi
          should_commit="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('release-proof/audit/self-heal-result.json')
          print('true' if json.loads(p.read_text()).get('should_commit') else 'false')
          PY
          )"
          if [[ "$should_commit" != "true" ]]; then
            echo "[audit-recorder] no actionable deliverable; suppressing passive audit commit"
            exit 0
          fi
          if git diff --quiet -- release-proof/audit/audit.jsonl release-proof/audit/self-heal-result.json; then
            echo "[audit-recorder] deliverable requested but no audit changes"
            exit 0
          fi
          readarray -t proposal < <(python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('release-proof/audit/self-heal-result.json').read_text())
          print(result.get('proposal_fingerprint') or '')
          print(result.get('branch_ref') or '')
          PY
          )
          fingerprint="${proposal[0]}"
          branch="${proposal[1]}"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ || ! "$branch" =~ ^self-heal/fp-[0-9a-f]{20}$ ]]; then
            echo "[audit-recorder] invalid or missing durable proposal fingerprint"
            exit 1
          fi

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "[audit-recorder] fingerprint already owns PR #$existing; suppressing duplicate"
            exit 0
          fi
          open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("self-heal/fp-"))] | length')"
          if (( open_count >= 3 )); then
            echo "[audit-recorder] self-heal proposal budget exhausted: open=$open_count"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "[audit-recorder] recovering fingerprint branch without a PR"
            gh pr create \
              --title "[spec-147] Governed self-heal ${fingerprint:0:12}" \
              --body-file release-proof/audit/self-heal-result.json \
              --base main \
              --head "$branch"
            exit 0
          fi

          git config user.name 'focusa-bot'
          git config user.email 'bot@focusa.local'
          git checkout -b "$branch"
          git add release-proof/audit/audit.jsonl release-proof/audit/self-heal-result.json
          git commit -m "audit: governed self-heal $fingerprint"
          # An unforced first-writer-wins branch push is the durable claim. A
          # concurrent loser cannot create another branch for this fingerprint.
          if ! git push --set-upstream origin "$branch"; then
            echo "[audit-recorder] fingerprint branch won by another writer; reusing it"
          fi
          gh pr create \
            --title "[spec-147] Governed self-heal ${fingerprint:0:12}" \
            --body-file release-proof/audit/self-heal-result.json \
            --base main \
            --head "$branch"
