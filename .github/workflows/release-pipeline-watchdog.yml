name: Release Pipeline Watchdog

# Spec147 governed recovery: one scheduled actor, one mutation per invocation,
# one attempt per failed run, and typed claim/settlement evidence.

on:
  workflow_dispatch:  # schedule DISABLED 2026-08-21 - was */10 * * * * (144/day) billing burn
    inputs:
      scan_limit:
        description: Recent runs to inspect
        required: false
        default: "12"
      max_heals:
        description: Maximum governed mutations in this invocation
        required: false
        default: "1"

permissions:
  actions: write
  contents: read

concurrency:
  group: release-pipeline-watchdog
  cancel-in-progress: false

jobs:
  scan-and-heal:
    name: Scan failures through the self-heal governor
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SCAN_LIMIT: ${{ inputs.scan_limit || '12' }}
      MAX_HEALS: ${{ inputs.max_heals || '1' }}
    steps:
      - uses: actions/checkout@v6

      - name: Classify, claim, heal, and settle
        shell: bash
        run: |
          set -euo pipefail
          healed=0
          ledger="$RUNNER_TEMP/self-heal-ledger.jsonl"
          : > "$ledger"
          gh run list --repo "$REPO" --limit "$SCAN_LIMIT" \
            --json databaseId,workflowName,status,conclusion,event,displayTitle,headSha,url \
            > runs.json

          while read -r run; do
            (( healed < MAX_HEALS )) || break
            id="$(jq -r '.databaseId' <<<"$run")"
            wf="$(jq -r '.workflowName' <<<"$run")"
            title="$(jq -r '.displayTitle // ""' <<<"$run")"
            sha="$(jq -r '.headSha // ""' <<<"$run")"
            url="$(jq -r '.url' <<<"$run")"
            [[ "$wf" =~ ^(CI|Release|Deploy\ Live\ Daemon)$ ]] || continue

            attempt="$(gh run view "$id" --repo "$REPO" --json attempt --jq '.attempt // 1' 2>/dev/null || echo 1)"
            if (( attempt >= 2 )); then
              echo "skip run=$id: attempt budget already used"
              continue
            fi

            gh run view "$id" --repo "$REPO" --log-failed > failed.log 2>/dev/null || true
            classification="$(python3 scripts/classify-ci-failure.py failed.log --format json 2>/dev/null || true)"
            cls="$(jq -r '.failure_class // "unclassified"' <<<"${classification:-{}}")"
            retry_policy="$(jq -r '.retry_policy // "operator_review"' <<<"${classification:-{}}")"
            deterministic="$(jq -r '.deterministic // false' <<<"${classification:-{}}")"
            safe_to_rerun_unchanged="$(jq -r '.safe_to_rerun_unchanged // false' <<<"${classification:-{}}")"
            plain_language_error="$(jq -r '.plain_language_error // "classified workflow failure"' <<<"${classification:-{}}")"
            likely_root_cause="$(jq -r '.likely_root_cause // "see failed workflow evidence"' <<<"${classification:-{}}")"
            remediation_template="$(jq -r '.remediation_template // "governed recovery or operator patch"' <<<"${classification:-{}}")"
            source_refs="$(jq -r '(.source_refs // []) | join(",")' <<<"${classification:-{}}")"
            signals="$(jq -r '(.signals // []) | join(",")' <<<"${classification:-{}}")"
            SELF_HEAL_SURFACE="release-pipeline-watchdog" \
              SELF_HEAL_WORKFLOW="$wf" SELF_HEAL_RUN_ID="$id" SELF_HEAL_HEAD_SHA="$sha" \
              failure_class="$cls" retry_policy="$retry_policy" deterministic="$deterministic" \
              safe_to_rerun_unchanged="$safe_to_rerun_unchanged" \
              plain_language_error="$plain_language_error" likely_root_cause="$likely_root_cause" \
              remediation_template="$remediation_template" source_refs="$source_refs" signals="$signals" \
              bash scripts/render-self-heal-decision-summary.sh
            artifact=""
            scope="run:$id"
            if [[ "$wf" == "Deploy Live Daemon" ]]; then
              tag="$(printf '%s' "$title" | sed -n 's/.*-\s*v\([0-9][0-9A-Za-z._+-]*\).*/v\1/p' | head -1 || true)"
              [[ -n "$tag" ]] || { echo "skip deploy run=$id: release tag unavailable"; continue; }
              scope="deploy:$tag"
              artifact="github-release:$tag"
              if [[ "$cls" == "unclassified" ]]; then
                cls="artifact_unavailable"
                retry_policy="rerun_once"
                deterministic="false"
              fi
              # A later run with the same immutable tag means redispatch was
              # already attempted; never create an unbounded deploy loop.
              same_tag_runs="$(jq --arg tag "$tag" '[.[] | select(.workflowName == "Deploy Live Daemon" and (.displayTitle | contains($tag)))] | length' runs.json)"
              if (( same_tag_runs > 1 )); then
                echo "skip deploy tag=$tag: a redispatch already exists"
                continue
              fi
            fi

            jq -n \
              --arg repository "$REPO" --arg workflow "$wf" --arg cls "$cls" \
              --arg sha "$sha" --arg scope "$scope" --arg artifact "$artifact" \
              --arg retry_policy "$retry_policy" --argjson deterministic "$deterministic" \
              '{schema:"focusa.self_heal.failure.v1",repository:$repository,workflow:$workflow,failure_class:$cls,exact_sha:$sha,action_scope:$scope,deterministic:$deterministic,retry_policy:$retry_policy} + (if $artifact == "" then {} else {artifact_set_id:$artifact} end)' \
              > failure.json

            claim="$(python3 scripts/self_heal_governor.py claim \
              --failure failure.json --ledger "$ledger" \
              --approval-ref policy:release-pipeline-watchdog \
              --max-attempts 1 --mutation-budget "$MAX_HEALS")"
            allowed="$(jq -r '.decision.allowed' <<<"$claim")"
            [[ "$allowed" == "true" ]] || { echo "skip run=$id: $(jq -r '.decision.reason' <<<"$claim")"; continue; }
            action="$(jq -r '.decision.action' <<<"$claim")"
            fingerprint="$(jq -r '.decision.fingerprint' <<<"$claim")"
            claim_id="$(jq -r '.claim.claim_id' <<<"$claim")"

            success=false
            if [[ "$action" == "rerun_failed_jobs" ]]; then
              gh run rerun "$id" --failed --repo "$REPO" && success=true
            elif [[ "$action" == "redispatch_deploy" ]]; then
              gh workflow run 'Deploy Live Daemon' --repo "$REPO" --ref main \
                -f release_tag="$tag" -f asset_suffix="x86_64-unknown-linux-musl" && success=true
            else
              echo "governor action=$action requires a patch or operator review"
            fi

            if [[ "$success" == "true" ]]; then
              python3 scripts/self_heal_governor.py settle --ledger "$ledger" \
                --fingerprint "$fingerprint" --claim-id "$claim_id" --status healed \
                --evidence-ref "$url" >/dev/null
              healed=$((healed + 1))
            else
              python3 scripts/self_heal_governor.py settle --ledger "$ledger" \
                --fingerprint "$fingerprint" --claim-id "$claim_id" --status operator_review \
                --evidence-ref "$url" >/dev/null
            fi
          done < <(jq -c '.[] | select(.status == "completed" and .conclusion == "failure")' runs.json)

          {
            echo "## Governed release watchdog"
            echo "healed=$healed"
            echo "mutation_budget=$MAX_HEALS"
            echo "ledger_rows=$(wc -l < "$ledger")"
          } >> "$GITHUB_STEP_SUMMARY"
