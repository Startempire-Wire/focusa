name: Validate corrected Spec 137A 138A 144 documentation closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-spec137a-138a-144-docs-closure-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected independent closure gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tests/spec137a_138a_144_documentation_closure_gate.py > /tmp/spec-closure-validation-v2.log 2>&1
          status=$?
          cat /tmp/spec-closure-validation-v2.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Persist corrected validation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "# Corrected independent Specs 137A/138A/144 documentation-closure validation"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Exit status: ${{ steps.gate.outputs.status }}"
            echo
            echo '```text'
            cat /tmp/spec-closure-validation-v2.log 2>/dev/null || true
            echo '```'
          } > docs/evidence/spec137a-138a-144-independent-closure-validation.md
          git config user.name "focusa-docs-closure[bot]"
          git config user.email "focusa-docs-closure[bot]@users.noreply.github.com"
          git add docs/evidence/spec137a-138a-144-independent-closure-validation.md
          git commit -m "docs: record corrected independent Spec closure validation"
          git push origin HEAD:main
      - name: Enforce validation success
        if: steps.gate.outputs.status != '0'
        run: exit 1
