name: Windows OVH candidate build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      desktop_nsis:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable candidate tag
        required: true
        type: string
      release_sha:
        description: Exact immutable candidate commit
        required: true
        type: string
      desktop_nsis:
        description: Build and verify signed local Windows NSIS installers instead of existing executables
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-ovh-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  cross-compile:
    name: Windows artifacts — OVH local toolchain
    runs-on: [self-hosted, Linux, X64, ovh-build-2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Verify controller adapter contract
        run: python3 tests/windows_xwin_release_adapter_test.py
      - name: Preserve controller adapter outside candidate checkout
        run: cp scripts/ci/build-windows-xwin-release.py "$RUNNER_TEMP/build-windows-xwin-release.py"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require existing compiler and owner-readable SDK
        run: |
          set -euo pipefail
          command -v cargo-xwin
          test -x /usr/lib/llvm-18/bin/clang-cl
          test -x /opt/xwin-shim/clang
          test -r /home/wirebot/build/focusa/windows-sdk-cache
          python3 -c 'import yaml'
      - name: Prepare job-owned local NSIS and verification tools
        if: ${{ inputs.desktop_nsis }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/focusa-nsis-tools-${GITHUB_RUN_ID}"
          mkdir -p "$tools/packages" "$tools/root"
          cd "$tools/packages"
          apt-get download nsis=3.09-4ubuntu1 nsis-common=3.09-4ubuntu1 minisign=0.11-1
          for package in *.deb; do dpkg-deb -x "$package" "$tools/root"; done
          echo "$tools/root/usr/bin" >> "$GITHUB_PATH"
          echo "NSISDIR=$tools/root/usr/share/nsis" >> "$GITHUB_ENV"
      - name: Reclaim idle rebuildable release targets when disk is above the build threshold
        if: ${{ inputs.desktop_nsis }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          used = int(subprocess.check_output(['df', '-P', '/'], text=True).splitlines()[1].split()[4].rstrip('%'))
          if used < 90:
              print('release cache reclamation unnecessary')
              raise SystemExit(0)
          for proc in Path('/proc').glob('[0-9]*/comm'):
              try:
                  name = proc.read_text().strip()
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
              if name in {'cargo', 'cargo-xwin', 'rustc', 'clang-cl', 'lld-link'}:
                  raise SystemExit('active compiler present; shared targets preserved')
          archive = Path('/home/wirebot/build/focusa') / ('preserved-release-cache-' + os.environ['GITHUB_RUN_ID'])
          archive.mkdir(parents=True, exist_ok=True)
          records = []
          for triple in ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-unknown-linux-musl']:
              target = Path('/home/wirebot/.cache/focusa-release-target') / triple
              if not target.is_dir() or target.is_symlink():
                  continue
              destination = archive / triple
              destination.mkdir(exist_ok=True)
              for name in ['focusa', 'focusa-daemon', 'focusa-tui', 'focusa-session-runner']:
                  binary = target / triple / 'release' / name
                  if binary.is_file():
                      saved = destination / name
                      shutil.copy2(binary, saved)
                      records.append({'path': str(saved), 'sha256': hashlib.sha256(saved.read_bytes()).hexdigest()})
              (archive / 'preserved-binaries.json').write_text(json.dumps(records, indent=2) + '\n')
              subprocess.run(['cargo', 'clean', '--target-dir', str(target)], check=True)
          print(json.dumps({'preserved': str(archive), 'binaries': len(records), 'cleanup': 'cargo clean, exact idle release targets only'}))
          PY
      - name: Enforce OVH build-host disk headroom
        run: |
          set -euo pipefail
          used=$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
          free_gb=$(df -P / | awk 'NR==2 {print int($4/1024/1024)}')
          echo "OVH disk used=${used}% free=${free_gb}GiB"
          [ "$used" -lt 90 ] || { echo "::error::OVH disk above 90% (${used}%)"; exit 1; }
          [ "$free_gb" -ge 15 ] || { echo "::error::OVH free disk below 15GiB (${free_gb}GiB)"; exit 1; }
      - name: Compile exact candidate and prove embedded production roots
        env:
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.release_sha }}
          DESKTOP_NSIS: ${{ inputs.desktop_nsis }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$DESKTOP_NSIS" = true ]; then extra+=(--desktop-nsis); fi
          python3 "$RUNNER_TEMP/build-windows-xwin-release.py" "${extra[@]}" \
            --source "$GITHUB_WORKSPACE" --tag "$CANDIDATE_TAG" --sha "$CANDIDATE_SHA" \
            --sdk-cache /home/wirebot/build/focusa/windows-sdk-cache \
            --target-dir "$RUNNER_TEMP/focusa-windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/focusa-windows-artifacts-${GITHUB_RUN_ID}"
      - name: Upload verified Windows artifacts to the exact existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts_dir="$RUNNER_TEMP/focusa-windows-artifacts-${GITHUB_RUN_ID}"
          if [ ! -d "$artifacts_dir" ]; then
            echo "::error::Artifacts directory not found: $artifacts_dir"
            exit 1
          fi
          echo "Uploading Windows executables to release ${{ inputs.release_tag }}"
          files=()
          for artifact in "$artifacts_dir"/*; do
            case "$artifact" in *.minisig) continue ;; esac
            files+=("$artifact")
          done
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber
      - name: Clean exact-owned rebuildable compiler target
        if: always()
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/focusa-windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$target" ]; then cargo clean --target-dir "$target"; fi

# The local NSIS mode emits verified updater signatures and honest generation
# evidence; MSI, native execution, installed acceptance and full signing remain
# separate gates. It never claims full release acceptance.
