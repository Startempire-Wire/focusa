name: Release

on: [push]

permissions:
  contents: write
  id-token: write
  actions: write
  issues: read
  pull-requests: read

jobs:
  # Durable release boundary: any open issue with a release-gate:* label blocks a tag.
  open-issue-release-gate:
    name: Open release-gate issue check
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-gating issue closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          open="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/issues?state=open&per_page=100" \
            | jq -s '[.[][]
                | select(has("pull_request") | not)
                | select(any(.labels[]?; .name | startswith("release-gate:")))
                | {number, title, labels: [.labels[].name]}]')"
          if [ "$(jq 'length' <<<"$open")" -ne 0 ]; then
            echo "::error::Release blocked by open release-gate issues: $open"
            exit 1
          fi
          echo "open_issue_release_gate=passed"

  pull-request-release-gate:
    name: Pull request inclusion gate
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require clean PR queue and tag inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          open_prs=$(gh pr list --repo "$REPOSITORY" --state open --limit 500 --json number,title,url)
          if [ "$(jq 'length' <<<"$open_prs")" -ne 0 ]; then
            echo "::error::Release blocked by open pull requests: $open_prs"
            exit 1
          fi
          previous=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          since=$(if [ -n "$previous" ]; then git log -1 --format=%cI "$previous"; else echo '1970-01-01T00:00:00Z'; fi)
          gh pr list --repo "$REPOSITORY" --state merged --limit 500 \
            --search "merged:>=${since%%T*}" --json number,mergeCommit,mergedAt \
            | jq -r --arg since "$since" '.[] | select(.mergedAt > $since) | [.number,.mergeCommit.oid] | @tsv' \
            | while IFS=$'\t' read -r number commit; do
                [ -n "$commit" ] || { echo "::error::PR #$number has no merge commit"; exit 1; }
                git merge-base --is-ancestor "$commit" "$TAG" || {
                  echo "::error::PR #$number merge $commit is absent from tag $TAG"
                  exit 1
                }
              done
          echo "pull_request_release_gate=passed"

  # Gate: tests + clippy must pass
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Release workflow validation
        run: |
          echo "release_branch_validation=ok"
          echo "Release build steps run only for v* tags; branch pushes run this lightweight job so GitHub never reports 'No jobs were run'."

      - uses: actions/checkout@v6
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          toolchain: nightly-2026-01-08
          components: clippy
      - name: Build standalone daemon required by cross-phase smoke test
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: cargo build -p focusa-api --bin focusa-daemon
      - name: Process-health check + cargo test
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/process-health-check.py --label "Release cargo test" --command "cargo test --workspace"
      - name: Process-health check + clippy
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/process-health-check.py --label "Release clippy" --command "cargo clippy --workspace -- -D warnings"
      - name: Spec104 static audit
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/audit-schema.py spec104 release-proof/audit/audit.jsonl

  # Final customer-lifecycle closure: all-surface OTA activation, worktree and
  # authority isolation, compaction/recovery, and cache-safe prompt behavior.
  final-release-gap-gate:
    name: Final release gap gate
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install release gate dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install Pi extension runtime dependencies
        working-directory: apps/pi-extension
        run: |
          npm ci --ignore-scripts
          node scripts/patch-pi-shrinkwrap-dependencies.mjs
      - name: Prove OTA, authority/worktree, compaction, and cache closure
        run: tests/final_release_gap_gate.sh

  # Create the GitHub Release with notes (runs once, before uploads)
  create-release:
    name: Create Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [rust-check, final-release-gap-gate, open-issue-release-gate, pull-request-release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Build a complete, durable changelog from the exact tag delta.
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            PREV_PUBLISHED=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt' 2>/dev/null || echo "1970-01-01T00:00:00Z")
          else
            RANGE="${TAG}"
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${TAG}"
            PREV_PUBLISHED="1970-01-01T00:00:00Z"
          fi

          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""
          COMMITS=""
          while IFS=$'\t' read -r SHA SUBJECT; do
            [ -n "$SHA" ] || continue
            LINE="- [\`${SHA:0:8}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}) ${SUBJECT}"
            COMMITS+="${LINE}"$'\n'
            case "$SUBJECT" in *!:*) BREAKING+="${LINE}"$'\n' ;; esac
            case "$SUBJECT" in
              feat:*|feat\(*\):*|feat!:*|feat\(*\)!:*) FEATURES+="${LINE}"$'\n' ;;
              fix:*|fix\(*\):*|fix!:*|fix\(*\)!:*|perf:*|perf\(*\):*|security:*|security\(*\):*) FIXES+="${LINE}"$'\n' ;;
              *) OTHER+="${LINE}"$'\n' ;;
            esac
          done < <(git log "$RANGE" --no-merges --format=$'%H\t%s')

          BREAKING=${BREAKING:-"- None recorded in this tag delta."}
          FEATURES=${FEATURES:-"- None recorded in this tag delta."}
          FIXES=${FIXES:-"- None recorded in this tag delta."}
          OTHER=${OTHER:-"- None recorded in this tag delta."}
          COMMITS=${COMMITS:-"- No commits recorded."}

          PREV_DAY="${PREV_PUBLISHED%%T*}"
          RESOLVED_ISSUES=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state closed \
            --limit 500 \
            --search "closed:>=${PREV_DAY}" \
            --json number,title,url,closedAt \
            | jq -r --arg previous "$PREV_PUBLISHED" '
                [.[] | select(.closedAt > $previous)]
                | sort_by(.number)
                | .[]
                | "- [" + .title + "](" + .url + ") (#" + (.number|tostring) + ")"
              ')
          RESOLVED_ISSUES=${RESOLVED_ISSUES:-"- None recorded since the previous published release."}
          MERGED_PRS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" --state merged --limit 500 \
            --search "merged:>=${PREV_DAY}" \
            --json number,title,url,mergedAt,author \
            | jq -r --arg previous "$PREV_PUBLISHED" '
                [.[] | select(.mergedAt > $previous)] | sort_by(.number) | .[]
                | "- [" + .title + "](" + .url + ") (#" + (.number|tostring) + ") — @" + .author.login
              ')
          MERGED_PRS=${MERGED_PRS:-"- None recorded since the previous published release."}
          CONTRIBUTORS=$(git log "$RANGE" --format='%aN' | sort -fu | sed 's/^/- /')
          CONTRIBUTORS=${CONTRIBUTORS:-"- None recorded."}
          KNOWN_ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
            --label "release-note:known-issue" --json number,title,url \
            | jq -r '.[] | "- [" + .title + "](" + .url + ") (#" + (.number|tostring) + ")"')
          KNOWN_ISSUES=${KNOWN_ISSUES:-"- None declared."}

          # Write current, non-stale notes to file (heredoc avoids escaping issues).
          # Keep this release page functional and evidence-oriented; avoid fixed route/test counts.
          cat > /tmp/release-notes.md << NOTES_EOF
          ## Focusa ${TAG} — Functional Dogfood Release

          Focusa is a local-first cognitive runtime for agent continuity, scope authority, evidence, recovery, trajectory, and tool governance.

          **Release delta:** ${PREV_TAG:-repository start} → ${TAG}

          ### What this release proves
          - **Functional snapshot** — this tag passed the Release workflow gate: workspace tests and clippy before artifacts.
          - **Dogfood-driven quality** — release notes are generated from the actual tag delta, not stale static claims.
          - **Cross-platform artifacts** — CLI, daemon, and TUI assets cover macOS, Linux glibc/musl, and Windows x64/ARM64; the Tauri menubar app covers macOS.
          - **Public traceability** — features, fixes, resolved issues, and every commit since the prior tag are recorded below.

          ### Breaking changes
          ${BREAKING}

          ### Features added
          ${FEATURES}

          ### Fixes shipped
          ${FIXES}

          ### Merged pull requests
          ${MERGED_PRS}

          ### Issues resolved
          ${RESOLVED_ISSUES}

          ### Contributors
          ${CONTRIBUTORS}

          ### Known issues
          ${KNOWN_ISSUES}

          ### Other changes
          ${OTHER}

          ### Full changelog
          [Compare ${PREV_TAG:-repository start}…${TAG}](${COMPARE_URL})

          ### Upgrade, rollback, and integrity
          - Upgrade with the signed release assets or the documented `focusa update` flow.
          - Review `SHA256SUMS`, signature/provenance assets, and the release manifest before installation.
          - Roll back with `focusa update rollback --dry-run=false --yes` after reviewing the rollback plan.
          - User data, environment configuration, license state, and recovery journals are preserved by update policy.

          ### Downloads
          | Platform | Asset | Description |
          |----------|-------|-------------|
          | macOS Apple Silicon | \`focusa-${TAG}-aarch64-apple-darwin\` | CLI |
          | macOS Intel | \`focusa-${TAG}-x86_64-apple-darwin\` | CLI |
          | macOS Apple Silicon | \`focusa-daemon-${TAG}-aarch64-apple-darwin\` | API daemon |
          | macOS Intel | \`focusa-daemon-${TAG}-x86_64-apple-darwin\` | API daemon |
          | macOS Apple Silicon | \`focusa-tui-${TAG}-aarch64-apple-darwin\` | TUI dashboard |
          | macOS Intel | \`focusa-tui-${TAG}-x86_64-apple-darwin\` | TUI dashboard |
          | macOS Apple Silicon / Intel | \`Focusa_*\` DMG / app archives | Menubar app |
          | Linux x64 glibc | \`focusa-${TAG}-x86_64-unknown-linux-gnu\` | CLI |
          | Linux x64 glibc | \`focusa-daemon-${TAG}-x86_64-unknown-linux-gnu\` | API daemon |
          | Linux x64 glibc | \`focusa-tui-${TAG}-x86_64-unknown-linux-gnu\` | TUI dashboard |
          | Linux x64 musl/static | \`focusa-${TAG}-x86_64-unknown-linux-musl\` | CLI |
          | Linux x64 musl/static | \`focusa-daemon-${TAG}-x86_64-unknown-linux-musl\` | API daemon |
          | Linux x64 musl/static | \`focusa-tui-${TAG}-x86_64-unknown-linux-musl\` | TUI dashboard |
          | Windows x64 | \`focusa-${TAG}-x86_64-pc-windows-msvc.exe\` | CLI |
          | Windows x64 | \`focusa-daemon-${TAG}-x86_64-pc-windows-msvc.exe\` | API daemon |
          | Windows x64 | \`focusa-tui-${TAG}-x86_64-pc-windows-msvc.exe\` | TUI dashboard |
          | Windows ARM64 | \`focusa-${TAG}-aarch64-pc-windows-msvc.exe\` | CLI |
          | Windows ARM64 | \`focusa-daemon-${TAG}-aarch64-pc-windows-msvc.exe\` | API daemon |
          | Windows ARM64 | \`focusa-tui-${TAG}-aarch64-pc-windows-msvc.exe\` | TUI dashboard |

          ### Quick Start (macOS/Linux)
          \`\`\`bash
          # Download and extract matching CLI/daemon assets from this release.
          chmod +x ./focusa-${TAG}-<your-platform> ./focusa-daemon-${TAG}-<your-platform>

          # Start the daemon.
          ./focusa-daemon-${TAG}-<your-platform>

          # In another terminal, check status.
          ./focusa-${TAG}-<your-platform> status
          \`\`\`

          ### Complete commit audit
          ${COMMITS}

          ---
          Local-first. Source-available. Functional proof is the GitHub Release workflow plus attached assets for this tag.
          NOTES_EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Focusa ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Tauri desktop app for macOS only (testing)
  tauri-build:
    name: Build Menubar (${{ matrix.platform }})
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    # Menubar is mandatory. beta_ad_hoc works before revenue; production_notarized
    # becomes mandatory only when the repository variable explicitly selects it.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          targets: ${{ matrix.rust_target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Stamp menubar version from release tag
        run: python3 scripts/stamp-menubar-version.py "${{ github.ref_name }}"

      - name: Verify stamped version surfaces
        run: python3 scripts/verify-version-surfaces.py "${{ github.ref_name }}"

      - name: Auto-heal audit trail
        run: python3 scripts/auto-heal-audit.py

      - name: Validate audit schema
        run: python3 scripts/audit-schema.py validate release-proof/audit/audit.jsonl

      - name: Regenerate CHANGELOG
        run: python3 scripts/changelog-gen.py --tag "${{ github.ref_name }}"

      - name: Install frontend deps
        working-directory: apps/menubar
        run: bun install

      - name: Generate macOS icons
        if: ${{ contains(matrix.platform, 'macos') }}
        working-directory: apps/menubar/src-tauri
        run: |
          # Generate .icns from PNG source using iconutil (macOS only)
          mkdir -p /tmp/focusa.iconset
          sips -z 16 16     icons/icon.png --out /tmp/focusa.iconset/icon_16x16.png
          sips -z 32 32     icons/icon.png --out /tmp/focusa.iconset/icon_16x16@2x.png
          sips -z 32 32     icons/icon.png --out /tmp/focusa.iconset/icon_32x32.png
          sips -z 64 64     icons/icon.png --out /tmp/focusa.iconset/icon_32x32@2x.png
          sips -z 128 128   icons/icon.png --out /tmp/focusa.iconset/icon_128x128.png
          sips -z 256 256   icons/icon.png --out /tmp/focusa.iconset/icon_128x128@2x.png
          sips -z 256 256   icons/icon.png --out /tmp/focusa.iconset/icon_256x256.png
          sips -z 512 512   icons/icon.png --out /tmp/focusa.iconset/icon_256x256@2x.png
          sips -z 512 512   icons/icon.png --out /tmp/focusa.iconset/icon_512x512.png
          iconutil -c icns /tmp/focusa.iconset -o icons/icon.icns
          ls -la icons/

      # Durable pre-sales rule: paid Apple membership gates production only.
      # beta_ad_hoc remains Tauri-signed and usable with explicit user consent.
      - name: Select macOS beta or production signing mode
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          FOCUSA_MACOS_RELEASE_MODE: ${{ vars.FOCUSA_MACOS_RELEASE_MODE || 'beta_ad_hoc' }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "${FOCUSA_MACOS_RELEASE_MODE}" in
            beta_ad_hoc)
              echo "::warning::Building explicit pre-license, unnotarized beta. Tauri updater signatures remain mandatory."
              echo "FOCUSA_MACOS_RELEASE_MODE=beta_ad_hoc" >> "$GITHUB_ENV"
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              exit 0
              ;;
            production_notarized)
              echo "FOCUSA_MACOS_RELEASE_MODE=production_notarized" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported FOCUSA_MACOS_RELEASE_MODE=${FOCUSA_MACOS_RELEASE_MODE}"
              exit 1
              ;;
          esac
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Apple signing/notarization secret ${required} is required for release artifacts."
              exit 1
            fi
          done
          KEYCHAIN_PATH="${RUNNER_TEMP}/focusa-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          APPLE_CERTIFICATE_BASE64="$APPLE_CERTIFICATE_BASE64" CERT_PATH="$CERT_PATH" python3 - <<'PY'
          import base64, os
          with open(os.environ["CERT_PATH"], "wb") as handle:
              handle.write(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            chmod 0600 "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi

      - name: Require Tauri updater signing authority
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FOCUSA_MACOS_RELEASE_MODE: ${{ vars.FOCUSA_MACOS_RELEASE_MODE || 'beta_ad_hoc' }}
        with:
          projectPath: apps/menubar
          tagName: ${{ github.ref_name }}
          releaseName: 'Focusa ${{ github.ref_name }}'
          releaseBody: ${{ vars.FOCUSA_MACOS_RELEASE_MODE == 'production_notarized' && 'Apple Developer ID signed and notarized production release.' || '⚠️ Pre-license, unnotarized beta. Install with the bundled consent bootstrap. OTA authenticity is enforced by the pinned Tauri updater key.' }}
          releaseDraft: false
          prerelease: false
          tauriScript: bunx tauri
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify beta integrity or notarize production (.app + .dmg)
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          TARGET: ${{ matrix.rust_target }}
          # Durable two-mode boundary: beta needs no paid Apple membership;
          # production remains fail-closed on Developer ID + notarization.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY_NAME: ${{ secrets.APPLE_IDENTITY_NAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        working-directory: apps/menubar
        run: |
          set -euo pipefail
          for app in src-tauri/target/${TARGET}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "${app}"
            case "${FOCUSA_MACOS_RELEASE_MODE}" in
              beta_ad_hoc)
                # Tauri creates the updater archive before this step. Verify the
                # archived app is already ad-hoc signed; mutating it here would
                # invalidate the mandatory Tauri updater signature.
                codesign -d --verbose=4 "${app}" 2>&1 | grep -q 'Signature=adhoc'
                updater_archive="$(find "src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
                [ -n "${updater_archive}" ]
                archive_dir="$(mktemp -d)"
                tar -xzf "${updater_archive}" -C "${archive_dir}"
                archived_app="$(find "${archive_dir}" -maxdepth 3 -type d -name '*.app' -print -quit)"
                [ -n "${archived_app}" ]
                codesign --verify --deep --strict --verbose=2 "${archived_app}"
                codesign -d --verbose=4 "${archived_app}" 2>&1 | grep -q 'Signature=adhoc'
                rm -rf "${archive_dir}"
                echo "Verified explicit pre-license beta: ad-hoc bundle integrity + Tauri updater signature."
                ;;
              production_notarized)
                ditto -c -k --keepParent "${app}" "${app}.zip"
                xcrun notarytool submit "${app}.zip" \
                  --key "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8" \
                  --key-id "${APPLE_API_KEY_ID}" \
                  --issuer "${APPLE_API_ISSUER_ID}" \
                  --team-id "${APPLE_TEAM_ID}" \
                  --wait
                xcrun stapler staple "${app}"
                xcrun stapler validate "${app}"
                for dmg in src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg; do
                  xcrun notarytool submit "${dmg}" \
                    --key "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8" \
                    --key-id "${APPLE_API_KEY_ID}" \
                    --issuer "${APPLE_API_ISSUER_ID}" \
                    --team-id "${APPLE_TEAM_ID}" \
                    --wait
                  xcrun stapler staple "${dmg}"
                  xcrun stapler validate "${dmg}"
                done
                echo "Verified Developer ID signing and Apple notarization."
                ;;
            esac
          done

      - name: Package verified macOS app bundles
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          TARGET: ${{ matrix.rust_target }}
          TAG: ${{ github.ref_name }}
        working-directory: apps/menubar
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ../../dist/menubar
          packaged=0
          for app in src-tauri/target/${TARGET}/release/bundle/macos/*.app; do
            base="$(basename "${app}" .app)"
            out="../../dist/menubar/${base}-${TAG}-${TARGET}.app.zip"
            ditto -c -k --keepParent "${app}" "${out}"
            packaged=$((packaged + 1))
          done
          for dmg in src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg; do
            base="$(basename "${dmg}" .dmg)"
            cp "${dmg}" "../../dist/menubar/${base}-${TAG}-${TARGET}.dmg"
            packaged=$((packaged + 1))
          done
          if [ "${packaged}" -eq 0 ]; then
            echo "No Tauri .app or .dmg bundles found for ${TARGET}" >&2
            find src-tauri/target/${TARGET}/release/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi
          ls -la ../../dist/menubar

      - name: Upload verified menubar artifacts to workflow
        if: ${{ contains(matrix.platform, 'macos') }}
        uses: actions/upload-artifact@v4
        with:
          name: focusa-menubar-${{ github.ref_name }}-${{ matrix.rust_target }}
          path: dist/menubar/*
          if-no-files-found: error

      - name: Upload verified menubar artifacts to release
        if: ${{ contains(matrix.platform, 'macos') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/menubar/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pre-license beta consent bootstrap
        if: ${{ matrix.rust_target == 'aarch64-apple-darwin' }}
        uses: softprops/action-gh-release@v2
        with:
          files: scripts/install-focusa-menubar-beta.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish Rust binaries for tester platforms.
  rust-release:
    name: Rust Binaries (${{ matrix.target }})
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            exe: .exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-08
          targets: ${{ matrix.target }}

      - name: Install cross for musl target
        if: ${{ matrix.musl == true }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.musl || false }}" = "true" ]; then
            # sqlite-vec <=0.1.9 uses BSD u_int aliases despite including stdint.h.
            export CFLAGS_x86_64_unknown_linux_musl='-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t'
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binaries
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          EXE="${{ matrix.exe || '' }}"
          for bin in focusa-daemon focusa focusa-tui; do
            src="target/${{ matrix.target }}/release/${bin}${EXE}"
            dst="dist/${bin}-${TAG}-${{ matrix.target }}${EXE}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            fi
          done
          ls -la dist/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pi-extension-release:
    name: Package Pi Extension
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stamp and verify Pi extension release version
        run: |
          set -euo pipefail
          python3 scripts/stamp-menubar-version.py "${{ github.ref_name }}"
          python3 scripts/verify-version-surfaces.py "${{ github.ref_name }}"
      - name: Package bundled Pi extension, installer, and agent context
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          tar -C apps -czf "focusa-pi-extension-${TAG}.tar.gz" pi-extension
          cp scripts/install-focusa.sh "focusa-installer-${TAG}.sh"
          sed -i "s/FOCUSA_INSTALLER_VERSION=\"dev-source\"/FOCUSA_INSTALLER_VERSION=\"${TAG#v}\"/" "focusa-installer-${TAG}.sh"
          chmod 0755 "focusa-installer-${TAG}.sh"
          "./focusa-installer-${TAG}.sh" --version | grep -F "${TAG#v}"
          mkdir -p bundle/focusa-agent-context/skills
          cp AGENTS.md bundle/focusa-agent-context/AGENTS.md
          cp -R .pi/skills/. bundle/focusa-agent-context/skills/
          test -f bundle/focusa-agent-context/AGENTS.md
          find bundle/focusa-agent-context/skills -name SKILL.md -type f | grep -q .
          tar -C bundle -czf "focusa-agent-context-${TAG}.tar.gz" focusa-agent-context
      - name: Upload Pi extension, installer, and agent context archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            focusa-pi-extension-*.tar.gz
            focusa-installer-*.sh
            focusa-agent-context-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA256SUMS
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [tauri-build, rust-release, pi-extension-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tooling
        run: |
          set -euo pipefail
          gh --version
          openssl version
          python3 --version
          python3 -m pip install --disable-pip-version-check --user 'cryptography==46.0.4'
          python3 -c 'import cryptography; print(cryptography.__version__)'
          test -s config/focusa-trusted-release-keys.json

      - name: Download completed release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist --clobber

      - name: Generate detached signatures, manifest, provenance, and trust metadata
        env:
          FOCUSA_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.FOCUSA_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${FOCUSA_RELEASE_ED25519_PRIVATE_KEY:-}"
          umask 077
          KEY_FILE="${RUNNER_TEMP}/focusa-release-ed25519.pem"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$FOCUSA_RELEASE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          python3 scripts/release-trust-metadata.py \
            --dist dist \
            --tag "${{ github.ref_name }}" \
            --commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --private-key "$KEY_FILE" \
            --trusted-keys config/focusa-trusted-release-keys.json

      - name: Upload trusted OTA metadata and detached signatures
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.sig
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/release-provenance.json
            dist/focusa-trusted-release-keys.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  dispatch-deploy-live-daemon:
    name: Dispatch Deploy Live Daemon
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "deploy_dispatch: tag=${TAG} asset_suffix=x86_64-unknown-linux-gnu repo=${REPO}"
          gh workflow run 'Deploy Live Daemon' \
            --repo "$REPO" \
            --ref main \
            -f release_tag="$TAG" \
            -f asset_suffix="x86_64-unknown-linux-gnu" \
            -f dry_run=false
