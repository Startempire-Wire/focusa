name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable existing release tag to resume
        required: true
        type: string
      release_sha:
        description: Exact commit SHA the release tag must resolve to
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write
  issues: read
  pull-requests: read

env:
  NODE_OPTIONS: --use-system-ca
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

# Functional Dogfood Release — What this release proves: script-owned detailed notes
# Release workflow plus attached assets: macOS artifacts verified via Tauri updater signatures
# Complete commit audit: full tag-delta history without truncation
# Notes include: ### Features added, ### Fixes shipped, ### Issues resolved, ### Other changes, ### Full changelog, ### Complete commit audit
# Markers: gh issue list — closedAt > $previous (durable changelog via merged PR audit)
# Release tag template contract: PREV_TAG=
# RANGE="${PREV_TAG}..${TAG}"
# ### Breaking changes
# ### Merged pull requests
# ### Contributors
# ### Known issues
# ### Downloads
# SHA256SUMS signature/provenance focusa update rollback --dry-run=false --yes

jobs:
  # Durable release boundary: any open issue with a release-gate:* label blocks a tag.
  open-issue-release-gate:
    name: Open release-gate issue check
    if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !contains(inputs.release_tag || github.ref_name, '-dev') }}
    runs-on: self-hosted
    steps:
      - name: Require every release-gating issue closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          open="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/issues?state=open&per_page=100" \
            | jq -s '[.[][]
                | select(has("pull_request") | not)
                | select(any(.labels[]?; .name | startswith("release-gate:")))
                | {number, title, labels: [.labels[].name]}]')"
          if [ "$(jq 'length' <<<"$open")" -ne 0 ]; then
            echo "::error::Release blocked by open release-gate issues: $open"
            exit 1
          fi
          echo "open_issue_release_gate=passed"

  pull-request-release-gate:
    name: Pull request inclusion gate
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require release-scoped PR queue and tag inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          blocking_prs=$(gh pr list --repo "$REPOSITORY" --state open --limit 500 --json number,title,url,labels \
            | jq '[.[] | select(any(.labels[]?; (.name | startswith("release-gate:")) or .name == "release-candidate")) | {number,title,url,labels:[.labels[].name]}]')
          if [ "$(jq 'length' <<<"$blocking_prs")" -ne 0 ]; then
            echo "::error::Release blocked by release-scoped pull requests: $blocking_prs"
            exit 1
          fi
          echo "unrelated open pull requests remain queued outside the locked candidate"
          previous=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          since=$(if [ -n "$previous" ]; then git log -1 --format=%cI "$previous"; else echo '1970-01-01T00:00:00Z'; fi)
          until=$(git log -1 --format=%cI "$TAG")
          gh pr list --repo "$REPOSITORY" --state merged --limit 500 \
            --search "merged:${since%%T*}..${until%%T*}" --json number,mergeCommit,mergedAt,baseRefName \
            | jq -r --arg since "$since" --arg until "$until" '.[] | select(.baseRefName == "main" and .mergedAt > $since and .mergedAt <= $until) | [.number,.mergeCommit.oid] | @tsv' \
            | while IFS=$'\t' read -r number commit; do
                [ -n "$commit" ] || { echo "::error::PR #$number has no merge commit"; exit 1; }
                git merge-base --is-ancestor "$commit" "$TAG" || {
                  echo "::error::PR #$number merge $commit is absent from tag $TAG"
                  exit 1
                }
              done
          echo "pull_request_release_gate=passed"

  # Fast contract gate: source tests are exact-SHA pre-tag authority; tag CI is
  # an independent publication gate below and still validates the stamped SHA.
  rust-check:
    name: Release Contract Check
    runs-on: self-hosted
    # Candidate CI may take up to 20 minutes; retain bounded setup overhead.
    timeout-minutes: 25
    steps:
      - name: Release workflow validation
        run: |
          echo "release_tag_validation=ok"
          echo "Release workflow accepted immutable stable or preview tag ${RELEASE_TAG}."
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify immutable tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$RELEASE_SHA" ] || [ "$head_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Immutable candidate mismatch tag=${RELEASE_TAG} tag_sha=${tag_sha} input_sha=${RELEASE_SHA} head_sha=${head_sha}"
            exit 1
          fi
          echo "release_candidate_identity=passed tag=${RELEASE_TAG} sha=${RELEASE_SHA}"
      - name: Wait for candidate-SHA CI completion (pipelined atomic tag push)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag is pushed atomically with the version-bump commit, so CI may
          # still be running when the release workflow starts. Same gate, just
          # patient: wait (bounded) for the candidate-SHA CI to complete; the
          # receipt check below still enforces success with Menubar exempt.
          for attempt in $(seq 1 120); do
            status=$(gh run list --workflow "CI" --commit "$RELEASE_SHA" --limit 5 \
              --json status,headSha \
              | jq -r --arg sha "$RELEASE_SHA" '[.[] | select(.headSha == $sha)][0].status // "missing"')
            case "$status" in
              completed) echo "candidate CI completed after ${attempt} polls"; exit 0 ;;
              missing) echo "candidate CI not found yet (attempt ${attempt})" ;;
              *) echo "candidate CI ${status} (attempt ${attempt})" ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for candidate-SHA CI"
          exit 1
      - name: Require exact candidate-SHA preflight receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$RELEASE_SHA"
          # Spec 178: billing-locked macos-latest Menubar job is substituted by the
          # Codemagic macOS package-proof receipt. The CI candidate gate therefore
          # requires every substantive CI job to succeed and treats Menubar as exempt.
          ci_gate_ok() {
            local sha="$1" run_id jobs j name concl
            run_id=$(gh run list --workflow "CI" --commit "$sha" --limit 10 --json databaseId,status,conclusion,headSha \
              | jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha and .status == "completed")][0].databaseId // empty')
            [ -n "$run_id" ] || return 1
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --paginate \
              | jq -r '.jobs[] | select(.conclusion != null) | "\(.name)|\(.conclusion)"')
            [ -n "$jobs" ] || return 1
            while IFS='|' read -r name concl; do
              case "$name" in
                Menubar|Build\ Menubar*)
                  # Exempt: substituted by Codemagic receipt (Spec 178)
                  ;;
                *)
                  [ "$concl" = "success" ] || return 1
                  ;;
              esac
            done <<<"$jobs"
            return 0
          }
          require_success() {
            local workflow="$1"
            local run
            if [ "$workflow" = "CI" ]; then
              if ci_gate_ok "$candidate_sha"; then
                echo "candidate_gate_reused workflow=CI receipt=job-level-success-menubar-exempt spec178"
                return 0
              fi
              echo "::error::Missing successful CI candidate gate for ${candidate_sha} (substantive jobs must all pass; Menubar exempt per Spec 178)"; exit 1
            fi
            run=$(gh run list --workflow "$workflow" --commit "$candidate_sha" --limit 10 --json status,conclusion,url,headSha \
              | jq -c --arg sha "$candidate_sha" 'map(select(.headSha == $sha and .status == "completed" and .conclusion == "success")) | .[0] // empty')
            [ -n "$run" ] || { echo "::error::Missing successful ${workflow} candidate gate for ${candidate_sha}"; exit 1; }
            echo "candidate_gate_reused workflow=${workflow} receipt=${run}"
          }
          require_success "CI"
          previous=$(git tag --sort=-version:refname | grep -v "^${RELEASE_TAG}$" | head -1 || true)
          candidate_changed_paths="$(git diff --name-only "${previous:-HEAD^}"..HEAD)"
          if grep -Eq \
            '^(crates/focusa-terminal-ui/|crates/focusa-cli/src/commands/(install|update)\.rs$|crates/focusa-core/src/silent_sessions/|crates/focusa-session-runner/|apps/pi-extension/(package|package-lock)\.json$|tests/132-e5-|\.github/workflows/spec132-terminal-matrix\.yml$)' \
            <<<"$candidate_changed_paths"; then
            # Spec 178 temporary route: GitHub-hosted Spec 132 rows are billing-
            # locked. Exact-SHA Linux strict gates plus downstream AppVeyor and
            # Codemagic receipt gates substitute the monolithic hosted workflow.
            # Publication remains fail-closed until every external asset exists.
            echo "candidate_gate_substituted workflow=Spec-132 route=spec178 providers=ovh,appveyor,codemagic sha=${candidate_sha}"
          fi
      - name: OTA installability release contract gate
        env:
          CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          controller_test="${RUNNER_TEMP}/spec143-controller-test.py"
          controller_workflow="${RUNNER_TEMP}/release-controller.yml"
          controller_stamper="${RUNNER_TEMP}/stamp-menubar-version.py"
          controller_version_verifier="${RUNNER_TEMP}/verify-version-surfaces.py"
          git show "${CONTROLLER_SHA}:tests/spec143_ota_installability_release_gate_test.py" > "$controller_test"
          git show "${CONTROLLER_SHA}:.github/workflows/release.yml" > "$controller_workflow"
          git show "${CONTROLLER_SHA}:scripts/stamp-menubar-version.py" > "$controller_stamper"
          git show "${CONTROLLER_SHA}:scripts/verify-version-surfaces.py" > "$controller_version_verifier"
          FOCUSA_SPEC143_ROOT="$PWD" \
          FOCUSA_RELEASE_WORKFLOW_PATH="$controller_workflow" \
          FOCUSA_RELEASE_STAMPER_PATH="$controller_stamper" \
          FOCUSA_VERSION_VERIFIER_PATH="$controller_version_verifier" \
            python3 "$controller_test"
      - name: Spec104 scoped-state closure gate
        run: python3 tests/spec104_singleton_inventory_gate.py --closure

  tag-ci-proof:
    name: Exact tag CI proof
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Wait for successful CI on stamped candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Spec 178: Menubar (billing-locked macos-latest) is exempt from the
          # candidate CI proof; the Codemagic macOS package-proof receipt substitutes.
          substantive_ok() {
            local run_id="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --paginate \
              | jq -e -r '([.jobs[] | select(.conclusion != null and (.name | startswith("Menubar") or startswith("Build Menubar")))] | length) >= 0' >/dev/null \
              && gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --paginate \
              | jq -e '[.jobs[] | select(.conclusion != null and (.name | startswith("Menubar") or startswith("Build Menubar")) | not)] | length > 0 and all(.conclusion == "success")' >/dev/null
          }
          for attempt in $(seq 1 120); do
            runs=$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_SHA" -f per_page=10 \
              --jq '[.workflow_runs[] | {id,status,conclusion,url:.html_url,headSha:.head_sha}]' 2>/dev/null || echo '[]')
            run=$(jq -c --arg sha "$RELEASE_SHA" 'map(select(.headSha == $sha)) | .[0] // {}' <<<"$runs")
            status=$(jq -r '.status // "missing"' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            run_id=$(jq -r '.id // empty' <<<"$run")
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              echo "tag_ci_proof=${run}"
              exit 0
            fi
            if [ "$status" = completed ] && [ "$conclusion" != success ] && [ -n "$run_id" ] && substantive_ok "$run_id"; then
              echo "tag_ci_proof=job-level-success-menubar-exempt spec178 run=${run_id}"
              exit 0
            fi
            if [ "$status" = completed ] && [ "$conclusion" != success ]; then
              echo "::error::Stamped candidate CI failed: ${run}"
              exit 1
            fi
            if (( attempt % 6 == 0 )); then
              echo "tag_ci_wait attempt=${attempt} status=${status} receipt=${run}"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for stamped candidate CI ${RELEASE_SHA}"
          exit 1

  # Final customer-lifecycle closure: all-surface OTA activation, worktree and
  # authority isolation, compaction/recovery, and cache-safe prompt behavior.
  final-release-gap-gate:
    name: Final release gap gate
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Install release gate dependencies
        run: |
          # Self-hosted AlmaLinux runner already ships rg; hosted Ubuntu needs apt.
          command -v rg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install Pi extension runtime dependencies
        working-directory: apps/pi-extension
        run: npm ci --ignore-scripts
      - name: Prove OTA, authority/worktree, compaction, and cache closure
        run: |
          # Self-hosted hosts may inject options unsupported by setup-node's
          # eventual routed/cPanel Node binary (GH#350).
          unset NODE_OPTIONS
          tests/final_release_gap_gate.sh

  # Version policy gate: the tag bump must match the release strategy
  # (docs/release-strategy.md) — tag shape, monotonicity, and breaking-change
  # bumps. Runs before release creation so a violation blocks the release.
  version-policy:
    name: Release version policy
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Validate tag against docs/release-strategy.md
        run: |
          set -euo pipefail
          echo "Checking ${RELEASE_TAG} against release strategy..."
          python3 scripts/next-version.py --repo "$PWD" --tag "$RELEASE_TAG" --json

  # Create the GitHub Release with notes (runs once, before uploads)
  create-release:
    name: Create Release
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [rust-check, final-release-gap-gate, open-issue-release-gate, pull-request-release-gate, version-policy]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Lock exact release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          topology_sha=$(sha256sum config/focusa-release-topology.json | awk '{print $1}')
          jq -n \
            --arg candidate_id "release:${GITHUB_REPOSITORY}:${RELEASE_TAG}" \
            --arg project_root "${GITHUB_WORKSPACE}" \
            --arg continuity_id "github:${GITHUB_REPOSITORY}" \
            --arg workpoint_id "${{ vars.FOCUSA_RELEASE_WORKPOINT_ID || format('github-actions:{0}', github.run_id) }}" \
            --arg version "${RELEASE_TAG#v}" \
            --arg exact_sha "${RELEASE_SHA}" \
            --arg topology_ref "config/focusa-release-topology.json#sha256:${topology_sha}" \
            '{
              schema: "focusa.release_candidate.v1",
              candidate_id: $candidate_id,
              project_root: $project_root,
              continuity_id: $continuity_id,
              workpoint_id: $workpoint_id,
              version: $version,
              exact_sha: $exact_sha,
              topology_ref: $topology_ref,
              stage: "locked",
              locked_scope_refs: [env.RELEASE_TAG, env.RELEASE_SHA, env.GITHUB_REPOSITORY],
              evidence: [],
              admitted_fixes: [],
              benchmark: null
            }' > release-candidate.json
          jq -e '.exact_sha == env.RELEASE_SHA and .stage == "locked"' release-candidate.json >/dev/null
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          # DETERMINISTIC — script-owned, never agent. Detailed: type/area/files/features.
          python3 scripts/generate-release-notes.py --tag "$TAG" --output /tmp/release-notes.md
          echo "release_notes_generated $(wc -l < /tmp/release-notes.md) lines for $TAG"
          head -n 20 /tmp/release-notes.md

      - name: Create GitHub Release and attach candidate lock
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Focusa ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          files: release-candidate.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TEMPORARY: these GitHub macOS artifact rows are billing-locked. Keep them
  # intact for the all-at-once GitHub restoration; Codemagic carries temporary
  # macOS package proof. See docs/178-focusa-temporary-ci-provider-parity-and-github-restoration-spec.md.
  # Build Tauri desktop app for macOS only (testing)
  # Spec 178: macOS/Windows menubar packaging is carried by Codemagic
  # (menubar-macos-package-proof) and AppVeyor (Tauri NSIS/MSI), which upload
  # their bundles straight back to this release. This job keeps the canonical
  # job id (tauri-build) as the durable external-receipt gate: it fails closed
  # until every menubar surface (app.zip + dmg + setup.exe + msi) is attached.
  tauri-build:
    name: Build Menubar (${{ matrix.platform }})
    # Disabled by default while Spec 178 owns macOS/Windows via external
    # providers. Restoration is one explicit repository-variable flip after
    # every GitHub-hosted replacement row is proven together.
    if: ${{ vars.FOCUSA_GITHUB_HOSTED_RELEASE_MATRIX == 'enabled' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust_target: x86_64-pc-windows-msvc
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            rust_target: aarch64-pc-windows-msvc
            windows_arm64: true

    runs-on: ${{ matrix.platform }}
    # Desktop artifacts are mandatory on macOS and Windows. beta_ad_hoc works
    # before Apple revenue; production_notarized is selected explicitly.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2

      - name: Activate MSVC ARM64 cross-build environment
        if: ${{ matrix.windows_arm64 == true }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Stamp menubar version from release tag
        run: python scripts/stamp-menubar-version.py "${RELEASE_TAG}"

      - name: Verify stamped version surfaces
        run: python scripts/verify-version-surfaces.py "${RELEASE_TAG}"

      - name: Auto-heal audit trail
        run: python scripts/auto-heal-audit.py

      - name: Validate audit schema
        run: python scripts/audit-schema.py validate release-proof/audit/audit.jsonl

      - name: Regenerate CHANGELOG
        run: python scripts/changelog-gen.py --tag "${RELEASE_TAG}"

      - name: Install frontend deps
        working-directory: apps/menubar
        run: bun install

      - name: Generate macOS icons
        if: ${{ contains(matrix.platform, 'macos') }}
        working-directory: apps/menubar/src-tauri
        run: |
          # Generate .icns from PNG source using iconutil (macOS only)
          mkdir -p /tmp/focusa.iconset
          sips -z 16 16     icons/icon.png --out /tmp/focusa.iconset/icon_16x16.png
          sips -z 32 32     icons/icon.png --out /tmp/focusa.iconset/icon_16x16@2x.png
          sips -z 32 32     icons/icon.png --out /tmp/focusa.iconset/icon_32x32.png
          sips -z 64 64     icons/icon.png --out /tmp/focusa.iconset/icon_32x32@2x.png
          sips -z 128 128   icons/icon.png --out /tmp/focusa.iconset/icon_128x128.png
          sips -z 256 256   icons/icon.png --out /tmp/focusa.iconset/icon_128x128@2x.png
          sips -z 256 256   icons/icon.png --out /tmp/focusa.iconset/icon_256x256.png
          sips -z 512 512   icons/icon.png --out /tmp/focusa.iconset/icon_256x256@2x.png
          sips -z 512 512   icons/icon.png --out /tmp/focusa.iconset/icon_512x512.png
          iconutil -c icns /tmp/focusa.iconset -o icons/icon.icns
          ls -la icons/

      # Durable pre-sales rule: paid Apple membership gates production only.
      # beta_ad_hoc remains Tauri-signed and usable with explicit user consent.
      - name: Select macOS beta or production signing mode
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          FOCUSA_MACOS_RELEASE_MODE: ${{ vars.FOCUSA_MACOS_RELEASE_MODE || 'beta_ad_hoc' }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "${FOCUSA_MACOS_RELEASE_MODE}" in
            beta_ad_hoc)
              echo "::warning::Building explicit pre-license, unnotarized beta. Tauri updater signatures remain mandatory."
              echo "FOCUSA_MACOS_RELEASE_MODE=beta_ad_hoc" >> "$GITHUB_ENV"
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              exit 0
              ;;
            production_notarized)
              echo "FOCUSA_MACOS_RELEASE_MODE=production_notarized" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported FOCUSA_MACOS_RELEASE_MODE=${FOCUSA_MACOS_RELEASE_MODE}"
              exit 1
              ;;
          esac
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Apple signing/notarization secret ${required} is required for release artifacts."
              exit 1
            fi
          done
          KEYCHAIN_PATH="${RUNNER_TEMP}/focusa-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          APPLE_CERTIFICATE_BASE64="$APPLE_CERTIFICATE_BASE64" CERT_PATH="$CERT_PATH" python3 - <<'PY'
          import base64, os
          with open(os.environ["CERT_PATH"], "wb") as handle:
              handle.write(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            chmod 0600 "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi

      - name: Require Tauri updater signing authority
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FOCUSA_MACOS_RELEASE_MODE: ${{ vars.FOCUSA_MACOS_RELEASE_MODE || 'beta_ad_hoc' }}
        with:
          projectPath: apps/menubar
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Focusa ${{ env.RELEASE_TAG }}'
          releaseBody: 'Canonical Focusa release for macOS, Windows, and Linux. OTA authenticity is enforced by the pinned updater key.'
          # Artifact producers preserve the gated draft. Only the final
          # evidence-backed publisher may make the release public.
          releaseDraft: true
          prerelease: false
          tauriScript: bunx tauri
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify beta integrity or notarize production (.app + .dmg)
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          TARGET: ${{ matrix.rust_target }}
          # Durable two-mode boundary: beta needs no paid Apple membership;
          # production remains fail-closed on Developer ID + notarization.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY_NAME: ${{ secrets.APPLE_IDENTITY_NAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        working-directory: apps/menubar
        run: |
          set -euo pipefail
          for app in src-tauri/target/${TARGET}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "${app}"
            case "${FOCUSA_MACOS_RELEASE_MODE}" in
              beta_ad_hoc)
                # Tauri creates the updater archive before this step. Verify the
                # archived app is already ad-hoc signed; mutating it here would
                # invalidate the mandatory Tauri updater signature.
                codesign -d --verbose=4 "${app}" 2>&1 | grep -q 'Signature=adhoc'
                updater_archive="$(find "src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
                [ -n "${updater_archive}" ]
                archive_dir="$(mktemp -d)"
                tar -xzf "${updater_archive}" -C "${archive_dir}"
                archived_app="$(find "${archive_dir}" -maxdepth 3 -type d -name '*.app' -print -quit)"
                [ -n "${archived_app}" ]
                codesign --verify --deep --strict --verbose=2 "${archived_app}"
                codesign -d --verbose=4 "${archived_app}" 2>&1 | grep -q 'Signature=adhoc'
                rm -rf "${archive_dir}"
                echo "Verified explicit pre-license beta: ad-hoc bundle integrity + Tauri updater signature."
                ;;
              production_notarized)
                ditto -c -k --keepParent "${app}" "${app}.zip"
                xcrun notarytool submit "${app}.zip" \
                  --key "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8" \
                  --key-id "${APPLE_API_KEY_ID}" \
                  --issuer "${APPLE_API_ISSUER_ID}" \
                  --team-id "${APPLE_TEAM_ID}" \
                  --wait
                xcrun stapler staple "${app}"
                xcrun stapler validate "${app}"
                for dmg in src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg; do
                  xcrun notarytool submit "${dmg}" \
                    --key "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8" \
                    --key-id "${APPLE_API_KEY_ID}" \
                    --issuer "${APPLE_API_ISSUER_ID}" \
                    --team-id "${APPLE_TEAM_ID}" \
                    --wait
                  xcrun stapler staple "${dmg}"
                  xcrun stapler validate "${dmg}"
                done
                echo "Verified Developer ID signing and Apple notarization."
                ;;
            esac
          done

      - name: Package verified macOS app bundles
        if: ${{ contains(matrix.platform, 'macos') }}
        env:
          TARGET: ${{ matrix.rust_target }}
          TAG: ${{ env.RELEASE_TAG }}
        working-directory: apps/menubar
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ../../dist/menubar
          packaged=0
          for app in src-tauri/target/${TARGET}/release/bundle/macos/*.app; do
            base="$(basename "${app}" .app)"
            out="../../dist/menubar/${base}-${TAG}-${TARGET}.app.zip"
            ditto -c -k --keepParent "${app}" "${out}"
            packaged=$((packaged + 1))
          done
          for dmg in src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg; do
            base="$(basename "${dmg}" .dmg)"
            cp "${dmg}" "../../dist/menubar/${base}-${TAG}-${TARGET}.dmg"
            packaged=$((packaged + 1))
          done
          if [ "${packaged}" -eq 0 ]; then
            echo "No Tauri .app or .dmg bundles found for ${TARGET}" >&2
            find src-tauri/target/${TARGET}/release/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi
          ls -la ../../dist/menubar

      - name: Upload verified menubar artifacts to workflow
        if: ${{ contains(matrix.platform, 'macos') }}
        uses: actions/upload-artifact@v4
        with:
          name: focusa-menubar-${{ env.RELEASE_TAG }}-${{ matrix.rust_target }}
          path: dist/menubar/*
          if-no-files-found: error

      - name: Upload verified menubar artifacts to release
        if: ${{ contains(matrix.platform, 'macos') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: dist/menubar/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pre-license beta consent bootstrap
        if: ${{ matrix.rust_target == 'aarch64-apple-darwin' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: scripts/install-focusa-menubar-beta.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  external-menubar-receipts:
    name: External Menubar Receipt Gate
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    # Producer-before-waiter: do not consume a bounded OVH lane while local
    # support artifacts are still queued on that same runner pool.
    needs: [create-release, pi-extension-release]
    runs-on: self-hosted
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Wait for external menubar artifacts (Codemagic + AppVeyor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/wait-for-external-release-assets.py \
            --tag "${RELEASE_TAG}" \
            --kind menubar \
            --timeout-minutes 145

  rust-release:
    name: Rust Binaries (${{ matrix.target }})
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        include:
          # Spec 178: macOS and Windows Rust binaries are built by Codemagic
          # (macos-rust-binaries) and AppVeyor respectively, then uploaded
          # straight back to this release. Linux stays on OVH self-hosted.
          - target: x86_64-unknown-linux-gnu
            # Quality-identical runner swap: same canonical commands (cargo,
            # thin-LTO via Cargo.toml, cross containers), warm continuous cache.
            os: [self-hosted, Linux, X64, ovh-build-2]
            target_dir: /home/wirebot/.cache/focusa-release-target/x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: [self-hosted, Linux, X64, ovh-build-2]
            target_dir: /home/wirebot/.cache/focusa-release-target/aarch64-unknown-linux-gnu
            cross: true
          - target: x86_64-unknown-linux-musl
            os: [self-hosted, Linux, X64, ovh-build-2]
            target_dir: /home/wirebot/.cache/focusa-release-target/x86_64-unknown-linux-musl
            musl: true

    runs-on: ${{ matrix.os }}
    env:
      FOCUSA_AUTHORITY_ROOT_KEYS_JSON: '{"authority-root-2026-01":"A6EHv/POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg="}'
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-target-${{ matrix.target }}

      - name: Activate MSVC ARM64 cross-build environment
        if: ${{ matrix.windows_arm64 == true }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install cross for cross-compiled target
        if: ${{ matrix.musl == true || matrix.cross == true }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries (Unix)
        if: ${{ !contains(matrix.target, 'windows-msvc') }}
        shell: bash
        run: |
          if [ "${{ matrix.musl || false }}" = "true" ]; then
            # sqlite-vec 0.1.7 uses BSD u_int* names that musl intentionally omits.
            # Pass exact stdint aliases into cross without changing non-musl builds.
            cat > Cross.toml <<'EOF'
          [build.env]
          passthrough = ["CFLAGS_x86_64_unknown_linux_musl"]
          EOF
            export CFLAGS_x86_64_unknown_linux_musl="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"
            trap 'rm -f Cross.toml' EXIT
            cross build --release --target ${{ matrix.target }}
          elif [ "${{ matrix.cross || false }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build release binaries (Windows MSVC)
        if: ${{ contains(matrix.target, 'windows-msvc') }}
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          mkdir -p dist
          EXE="${{ matrix.exe || '' }}"
          for bin in focusa-daemon focusa focusa-session-runner focusa-tui; do
            src="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/${bin}${EXE}"
            dst="dist/${bin}-${TAG}-${{ matrix.target }}${EXE}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            fi
          done
          ls -la dist/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Spec 178: macOS (Codemagic) and Windows (AppVeyor) Rust binaries are
  # built off GitHub and uploaded back to this release. This gate fails closed
  # until all 16 external binaries (8 macOS + 8 Windows) are attached.
  external-rust-binaries:
    name: External Rust Binary Receipt Gate
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    # Producer-before-waiter: all Linux matrix rows must release their bounded
    # OVH lanes before a long external-provider receipt wait may begin.
    needs: [create-release, rust-release]
    runs-on: self-hosted
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Wait for external Rust binaries (Codemagic + AppVeyor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/wait-for-external-release-assets.py \
            --tag "${RELEASE_TAG}" \
            --kind rust-binaries \
            --timeout-minutes 145

  pi-extension-release:
    name: Package Pi Extension
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: create-release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Stamp and verify Pi extension release version
        run: |
          set -euo pipefail
          python3 scripts/stamp-menubar-version.py "${RELEASE_TAG}"
          python3 scripts/verify-version-surfaces.py "${RELEASE_TAG}"
      - name: Package bundled Pi extension, installer, and agent context
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          tar -C apps -czf "focusa-pi-extension-${TAG}.tar.gz" pi-extension
          tar -czf "focusa-generated-clients-${TAG}.tar.gz" \
            packages/generated/spec135 \
            docs/contracts/spec135/generated-contract-v1
          cp scripts/install-focusa.sh "focusa-installer-${TAG}.sh"
          cp scripts/install-focusa.ps1 "focusa-installer-${TAG}.ps1"
          chmod 0755 "focusa-installer-${TAG}.sh"
          "./focusa-installer-${TAG}.sh" --version | grep -F "${TAG#v}"
          mkdir -p bundle/focusa-agent-context/skills bundle/focusa-agent-context/bin
          cp AGENTS.md bundle/focusa-agent-context/AGENTS.md
          cp -R .pi/skills/. bundle/focusa-agent-context/skills/
          cp scripts/focusa-skill-doctor bundle/focusa-agent-context/bin/focusa-skill-doctor
          chmod 0755 bundle/focusa-agent-context/bin/focusa-skill-doctor
          test -f bundle/focusa-agent-context/AGENTS.md
          test -x bundle/focusa-agent-context/bin/focusa-skill-doctor
          test -n "$(find bundle/focusa-agent-context/skills -name SKILL.md -type f -print -quit)"
          tar -C bundle -czf "focusa-agent-context-${TAG}.tar.gz" focusa-agent-context
      - name: Upload Pi extension, installers, generated clients, and agent context archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            focusa-pi-extension-*.tar.gz
            focusa-installer-*.sh
            focusa-installer-*.ps1
            focusa-agent-context-*.tar.gz
            focusa-generated-clients-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish SHA256SUMS
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [external-menubar-receipts, rust-release, external-rust-binaries, pi-extension-release, tag-ci-proof]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Install Cosign for keyless installer trust metadata
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify release tooling
        run: |
          set -euo pipefail
          gh --version
          openssl version
          python3 --version
          python3 -m pip install --disable-pip-version-check --user 'cryptography==46.0.4'
          python3 -c 'import cryptography; print(cryptography.__version__)'
          test -s config/focusa-trusted-release-keys.json

      - name: Download completed release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist --clobber

      - name: Require every canonical surface on every supported system
        run: |
          set -euo pipefail
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl; do
            test -s "dist/focusa-session-runner-${RELEASE_TAG}-${target}"
          done
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            test -s "dist/focusa-session-runner-${RELEASE_TAG}-${target}.exe"
          done
          echo "canonical_session_runner_assets=passed targets=7"
          python3 scripts/verify-canonical-release-assets.py \
            --dist dist \
            --tag "${RELEASE_TAG}"

      - name: Generate signed Tauri updater metadata from provider receipts
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import fnmatch
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["RELEASE_REPOSITORY"]
          version = tag.removeprefix("v")
          names = {path.name: path for path in dist.iterdir() if path.is_file()}

          def exact(name: str) -> tuple[str, str]:
              path = names.get(name)
              signature = names.get(name + ".sig")
              if path is None or signature is None:
                  raise SystemExit(f"missing Tauri updater receipt: {name}")
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              return url, signature.read_text(encoding="utf-8").strip()

          def pattern(glob: str) -> tuple[str, str]:
              matches = sorted(name for name in names if fnmatch.fnmatchcase(name, glob))
              if len(matches) != 1:
                  raise SystemExit(f"expected one Tauri updater asset for {glob}, got {matches}")
              return exact(matches[0])

          mac_x64 = exact("Focusa_x64.app.tar.gz")
          mac_arm64 = exact("Focusa_aarch64.app.tar.gz")
          win_x64_msi = pattern("Focusa_*x64*.msi")
          win_x64_nsis = pattern("Focusa_*x64*setup.exe")
          win_arm64_msi = pattern("Focusa_*arm64*.msi")
          win_arm64_nsis = pattern("Focusa_*arm64*setup.exe")
          platform_assets = {
              "darwin-x86_64": mac_x64,
              "darwin-x86_64-app": mac_x64,
              "darwin-aarch64": mac_arm64,
              "darwin-aarch64-app": mac_arm64,
              "windows-x86_64": win_x64_msi,
              "windows-x86_64-msi": win_x64_msi,
              "windows-x86_64-nsis": win_x64_nsis,
              "windows-aarch64": win_arm64_msi,
              "windows-aarch64-msi": win_arm64_msi,
              "windows-aarch64-nsis": win_arm64_nsis,
          }
          payload = {
              "version": version,
              "notes": f"Focusa {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  platform: {"url": url, "signature": signature}
                  for platform, (url, signature) in platform_assets.items()
              },
          }
          (dist / "latest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          python3 -m json.tool dist/latest.json >/dev/null

      - name: Generate typed release intelligence packet and page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CLI="dist/focusa-${TAG}-x86_64-unknown-linux-gnu"
          test -s "$CLI"
          chmod +x "$CLI"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || true)"
          ARGS=()
          if [ -n "$PREVIOUS_TAG" ]; then
            ARGS+=(--previous-tag "$PREVIOUS_TAG")
          fi
          python3 scripts/generate-release-intelligence-packet.py \
            --dist dist \
            --tag "$TAG" \
            --sha "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output dist/release-intelligence.json \
            "${ARGS[@]}"
          "$CLI" release render-intelligence \
            --packet dist/release-intelligence.json \
            --output dist/release-intelligence.md \
            --publishable
          test -s dist/release-intelligence.json
          test -s dist/release-intelligence.md

      - name: Generate detached signatures, manifest, provenance, and trust metadata
        env:
          FOCUSA_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.FOCUSA_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${FOCUSA_RELEASE_ED25519_PRIVATE_KEY:-}"
          umask 077
          KEY_FILE="${RUNNER_TEMP}/focusa-release-ed25519.pem"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$FOCUSA_RELEASE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          python3 scripts/release-trust-metadata.py \
            --dist dist \
            --tag "${RELEASE_TAG}" \
            --commit "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --private-key "$KEY_FILE" \
            --trusted-keys config/focusa-trusted-release-keys.json
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.cosign.sig \
            --output-certificate dist/SHA256SUMS.txt.cosign.pem \
            dist/SHA256SUMS.txt
          test -s dist/SHA256SUMS.txt.cosign.sig
          test -s dist/SHA256SUMS.txt.cosign.pem

      - name: Upload trusted OTA metadata and detached signatures
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            dist/*.sig
            dist/*.pem
            dist/SHA256SUMS.txt
            dist/release-intelligence.json
            dist/release-intelligence.md
            dist/release-manifest.json
            dist/release-provenance.json
            dist/focusa-trusted-release-keys.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish evidence-backed release page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          test -s dist/release-intelligence.md
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file dist/release-intelligence.md \
            --draft=false

  dispatch-deploy-live-daemon:
    name: Dispatch Deploy Live Daemon
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: checksums
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Dispatch production deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          echo "deploy_dispatch: tag=${TAG} asset_suffix=x86_64-unknown-linux-musl repo=${REPO}"
          gh workflow run 'Deploy Live Daemon' \
            --repo "$REPO" \
            --ref main \
            -f release_tag="$TAG" \
            -f asset_suffix="x86_64-unknown-linux-musl" \
            -f dry_run=false
