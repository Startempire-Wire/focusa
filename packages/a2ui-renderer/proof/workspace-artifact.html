<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22>F</text></svg>" />
    <title>Focusa Workspace Artifact Bridge Eval</title>
    <style>
      :root { color: #172033; background: #eef2f8; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; }
      main { width: min(56rem, calc(100% - 2rem)); margin: 2rem auto; }
      h1 { font-size: clamp(1.55rem, 5vw, 2.4rem); margin-bottom: .35rem; }
      #artifact-result { margin-block: 1rem; padding: .75rem; border-radius: .5rem; background: #fff; }
      #workspace-artifact-surface { display: grid; gap: .75rem; }
      @media (max-width: 34rem) { main { margin-block: 1rem; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Workspace Artifact bridge</h1>
      <p>Link bounded UIAI output to this work surface without copying browser runtime or large blobs into Focusa.</p>
      <div id="artifact-result" role="status" aria-live="polite">No artifact linked</div>
      <section id="workspace-artifact-surface" aria-label="Generated Workspace Artifact surface"></section>
    </main>
    <script type="module" src="/workspace-artifact.ts"></script>
  </body>
</html>
