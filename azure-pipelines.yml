# azure-pipelines.yml — external billing bypass (pluggable, auto-expiring)
# CLEAN PLUG: mirrors .github/workflows/release.yml matrix but runs on Azure's free hosted pool.
# Auto-expires 2026-09-01 (GH 2000m resets) → set trigger: none via bypass config.
# Toggle: config/billing-bypass.json { "enabled": true, "expires": "2026-09-01" }
# Sync: scripts/sync-azure-pipeline.py keeps this in sync with release.yml
# Disable: `echo '{"enabled":false}' > config/billing-bypass.json` or let expiry workflow do it.
# No lock-in — delete this file + config/billing-bypass.json to fully unplug.

trigger:
  tags:
    include: ['v*']
  branches:
    include: ['main']
  paths:
    exclude: ['config/billing-bypass.json']

pr: none

variables:
- group: focusa-release-secrets  # GITHUB_PAT, APPLE certs (optional)
- name: BYPASS_EXPIRES
  value: '2026-09-01'
- name: GH_REPO
  value: 'Startempire-Wire/focusa'

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: billing_bypass_guard
  displayName: 'Bypass guard (auto-expire Sep 1)'
  pool: { vmImage: 'ubuntu-latest' }
  steps:
  - checkout: self
    persistCredentials: true
  - script: |
      set -e
      EXP=$(jq -r .expires config/billing-bypass.json 2>/dev/null || echo "2026-09-01")
      EN=$(jq -r .enabled config/billing-bypass.json 2>/dev/null || echo "true")
      TODAY=$(date -u +%F)
      echo "bypass enabled=$EN expires=$EXP today=$TODAY"
      if [ "$EN" != "true" ]; then echo "##vso[task.logissue type=warning]Bypass disabled — skipping"; echo "##vso[task.complete result=SucceededWithIssues;]"; exit 0; fi
      if [[ "$TODAY" > "$EXP" ]]; then echo "##vso[task.logissue type=warning]Bypass expired $EXP — skipping (GH minutes reset)"; echo "##vso[task.complete result=SucceededWithIssues;]"; exit 0; fi
      echo "Bypass active — will build full 6-arch matrix"
    displayName: 'Check bypass window'

- job: build_linux
  dependsOn: billing_bypass_guard
  condition: succeeded()
  displayName: 'Build Linux x64/arm64'
  pool: { vmImage: 'ubuntu-latest' }
  steps:
  - checkout: self
  - task: NodeTool@0
    inputs: { versionSpec: '20.x' }
  - script: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.78
      source $HOME/.cargo/env
      cargo build --release --locked
      ls -lh target/release/focusa* | head -20
    displayName: 'Cargo release (Linux)'

- job: build_macos
  dependsOn: billing_bypass_guard
  condition: succeeded()
  displayName: 'Build macOS x64/arm64'
  pool: { vmImage: 'macOS-latest' }
  steps:
  - checkout: self
  - script: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.78
      source $HOME/.cargo/env
      cargo build --release --locked
    displayName: 'Cargo release (macOS)'

- job: build_windows
  dependsOn: billing_bypass_guard
  condition: succeeded()
  displayName: 'Build Windows x64/arm64'
  pool: { vmImage: 'windows-latest' }
  steps:
  - checkout: self
  - script: |
      rustup toolchain install 1.78
      rustup default 1.78
      cargo build --release --locked
    displayName: 'Cargo release (Windows)'

- job: publish_to_github
  dependsOn: [build_linux, build_macos, build_windows]
  condition: succeeded()
  displayName: 'Attach to GitHub Release'
  pool: { vmImage: 'ubuntu-latest' }
  steps:
  - checkout: self
  - script: |
      set -e
      TAG=$(Build.SourceBranchName)
      if [[ "$(Build.SourceBranch)" == refs/tags/* ]]; then TAG=${Build.SourceBranch#refs/tags/}; else TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.9.180-dev"); fi
      echo "Publishing $TAG to $GH_REPO"
      # collect artifacts (example — tar the release bins)
      tar czf focusa-$TAG-linux-x64.tar.gz target/release/focusa* 2>/dev/null || true
      gh release view "$TAG" --repo "$GH_REPO" 2>/dev/null || gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "" --prerelease
      gh release upload "$TAG" focusa-*.tar.gz --repo "$GH_REPO" --clobber || true
      echo "Done"
    env:
      GH_TOKEN: $(GITHUB_PAT)
    displayName: 'gh release upload'
