    - file: crates/focusa-core/src/mission_canvas/layout.rs
      exports: [resolve_layout, validate_no_dead_chrome, LayoutNode]
    - file: crates/focusa-core/src/mission_canvas/reducer.rs
      exports: [resolve_projection, projection_digest, candidate_partition_is_complete]
    - file: crates/focusa-core/src/mission_canvas/persistence.rs
      exports: [MissionCanvasStore]
    - file: crates/focusa-core/src/mission_canvas/profiles.rs
      exports: [WorkspaceProfileRegistry, ActivityModeRegistry]
    - file: crates/focusa-api/src/routes/mission_canvas.rs
      exports: [mission_canvas_router]
    - file: docs/contracts/spec135/mission-canvas-v1/operation-registry.json
      operation_count: 25
    - file: docs/contracts/spec135/mission-canvas-v1/typescript/mission-canvas-types.generated.ts
      contains: ResolvedWorkspaceProjection
    - file: apps/pi-extension/src/mission-canvas-model.ts
      role: legacy Pi projection adapter requiring Workstream identity correction
    - file: apps/pi-extension/src/mission-canvas-session-inventory.ts
      role: legacy session inventory adapter requiring exact Attachment and Workstream identity
  desktop_present_but_not_core_complete:
    - apps/desktop/src/routes/+page.svelte
    - apps/desktop/src/lib/shell/MissionCanvasShell.svelte
    - apps/desktop/src/lib/shell/AgentTuiSurface.svelte
