resolved_architecture:
  unchanged_fundamentals:
    - Mission Canvas is an adaptive professional workspace, not a fixed dashboard.
    - ResolvedWorkspaceProjection is computed before rendering.
    - Empty or ineligible contributions are omitted before geometry.
    - Work Surface tabs show actual open surfaces only.
    - Activity mode and Workspace Profile are independent composition inputs.
    - The canonical shell order is Work Surface strip, focused surface plus inspector, Work Rail, queues, prompt editor.
    - Pi transcript is one pi_session Work Surface; it is not the whole Mission Canvas.
    - Visual focus never creates canonical authority.
    - All mutations use typed scoped operations, preview/commit where required, and receipts.
    - Context, Role, Interview, Spec, Tasks, Sessions, Documents, Research, Evidence, History, and Controls remain activity capabilities.
    - General, Software, Legal, Markets, Research, and Custom remain workspace profiles.
  transition_delta:
    old_primary_host: Pi ctx.ui.custom terminal overlay
    new_primary_host: Focusa Desktop Tauri shell with Svelte Mission Canvas
    pi_runtime: authentic PTY-backed Agent TUI Work Surface inside Focusa Desktop
    canvas_switch: Mission Canvas and Agent TUI replace the complete inner Desktop surface
    semantic_core: shared Focusa Core projection and generated contracts; never copied into Svelte
    pi_extension_after_cutover: compatibility adapter and Desktop launcher/presenter for the exact Workstream
    menubar_after_cutover: bounded status, resume, pairing, lifecycle, and Desktop handoff only
    visual_handoff_role: finishing-language guidance only; it does not define layout inventory or behavior

non_negotiable_prohibitions:
  - no fixed dashboard slots
  - no client-local eligibility or ad-hoc reflow algorithm
  - no permanent unavailable, empty, degraded, or not-configured cards in the primary Canvas
  - no possible-type Work Surface tabs
  - no handwritten duplicate transport DTOs
  - no project_root-plus-continuity authority
  - no CWD, selected tab, latest record, remembered workspace, or daemon-global authority inference
  - no ordinary child-process pipes for interactive Pi
  - no mocked canonical data presented as live
  - no browser framework other than UIAI Engine for browser execution or evaluation
  - no visual redesign work before the corresponding core call path exists

