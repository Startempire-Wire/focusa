  blocking_identity_gap:
    current_scope: project_root + continuity_id + session/attachment strings
    required_scope: ScopeRef/ProjectRootKey + WorkstreamId + ContinuityId + AttachmentKey + SessionId/InstanceId + WorkSurfaceId

runtime_callgraph:
  desktop_start:
    calls:
      - TauriApp.start
      - DesktopManifest.load
      - WorkstreamContext.resolve_exact
      - MissionCanvasProjectionController.start
      - MissionCanvasProjectionClient.get_projection
      - MissionCanvasRenderer.render_projection
      - DesktopEventClient.subscribe
  projection_resolution:
    calls:
      - mission_canvas_router.POST_/v1/mission-canvas/projection/resolve
      - resolve_projection
      - WorkspaceProfileRegistry.resolve
      - ActivityModeRegistry.resolve
      - collect_candidates
      - resolve_eligibility
      - resolve_layout
      - validate_no_dead_chrome
      - MissionCanvasStore.save_projection
      - MissionCanvasStore.append_event
      - return_RecompositionResult_with_evidence_and_receipt
  desktop_render:
    calls:
      - MissionCanvasShell.render_frame
      - ActualWorkSurfaceStrip.render
      - ActivityNavigation.render
      - ProjectionLayoutRenderer.render_LayoutNode_recursively
      - ContributionRendererRegistry.render_by_renderer_binding_id
      - ConditionalWorkRail.render_if_present
      - ConditionalQueueRegion.render_if_present
      - PromptEditor.render_if_present_and_recipient_resolved
  activity_change:
    calls:
      - ActivityNavigation.select
      - MissionCanvasProjectionController.resolve_with_activity
      - focusa.mission_canvas.activity.select
      - receive_projection_revision
      - preserve_focus_draft_scroll_and_surface_identity
      - MissionCanvasRenderer.render_projection
  profile_change:
    calls:
      - WorkspaceProfileSelector.select_eligible_profile
      - focusa.mission_canvas.profile.select
      - MissionCanvasProjectionController.resolve_with_profile
      - restore_profile_layout_memory
      - MissionCanvasRenderer.render_projection
  surface_focus:
    calls:
      - ActualWorkSurfaceStrip.focus
      - typed_WorkSurface_focus_operation
      - canonical_event
      - projection_invalidation
      - MissionCanvasProjectionController.refresh
  mutation:
    calls:
      - ContributionAction.invoke
      - OperationRegistry.lookup
      - CapabilityPermissionGate.check
      - preview_if_required
      - operator_confirmation_if_required
      - commit
      - ToolResult
      - canonical_event
      - Evidence_and_Receipt
      - projection_or_generated_surface_delta
  pi_surface:
    calls:
      - DesktopPiSurfaceController.open_exact_attachment
      - TauriPtyAdapter.spawn_or_reconnect
      - PiProcess.keep_alive_when_hidden
      - PtyOutputStream.to_terminal_renderer
      - TerminalInput.to_pty
      - TerminalResize.to_pty
      - WorkSurfaceLifecycle.persist_and_rehydrate
  generated_surface:
    calls:
      - GeneratedSurfaceEnvelope.receive
      - A2UI_web_core.process
      - A2UI_Lit_renderer.render
      - FocusaSvelteCustomElement.invoke_action_binding
      - mutation
  live_refresh:
    calls:
      - SQLite_event_replay
      - broadcast_live_tail
      - DesktopEventClient.filter_exact_workstream
      - ProjectionInvalidation.coalesce
      - MissionCanvasProjectionController.refresh
      - preserve_local_presentation_state

execution_rules_for_agents:
  - Execute only a node whose status is ready and whose dependencies are complete.
  - Read every file in node.read_before_edit before changing code.
  - Change only node.targets.
  - Do not invent renderer IDs, contribution IDs, operation IDs, profile IDs, or activity IDs; consume registries and generated contracts.
  - Do not implement a later node as a shortcut around a blocked dependency.
  - If actual code contradicts this graph, stop and update this graph from the higher-authority source before coding.
  - A node is complete only when its output is consumed by the next node; isolated scaffolding is not completion.

