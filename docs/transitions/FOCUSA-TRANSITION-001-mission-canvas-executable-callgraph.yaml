    check: python3 -c "import yaml; d=yaml.safe_load(open('docs/transitions/FOCUSA-TRANSITION-001-desktop-implementation-task-graph.yaml')); assert d['mission_canvas_executable_callgraph'].endswith('executable-callgraph.yaml')"
