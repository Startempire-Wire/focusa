operation_task_defaults:
  status: blocked_until_dependencies_complete
  read:
    - docs/contracts/spec135/mission-canvas-v1/operation-registry.json
    - docs/contracts/spec135/mission-canvas-v1/openapi-3.0.3.json
    - docs/contracts/spec135/mission-canvas-v1/typescript/mission-canvas-client.generated.ts
    - crates/focusa-api/src/routes/mission_canvas.rs
  target_owners:
    - crates/focusa-api/src/routes/mission_canvas.rs
    - matching Focusa Core mission_canvas owner
    - generated OpenAPI, registry, client, validator, and action binding
    - apps/desktop generated-client consumer
  required_call_stack:
    - generated client method
    - generated operation ID lookup
    - HTTP method and path from registry
    - WorkstreamContext extraction
    - capability and permission check
    - core service call
    - Result or Receipt with exact WorkstreamKey
    - runtime validation in Desktop
  required_negative_cases:
    - missing WorkstreamId
    - foreign WorkstreamId
    - stale revision or cursor when applicable
    - unavailable capability
    - unauthorized mutation
  check:
    - python3 tests/spec135_mission_canvas_generated_parity_test.py
    - per-operation API contract test named after the operation ID
    - Desktop consumer test named after the generated client method
  completion_rule: The operation passes positive and negative cases with no handwritten Desktop DTO or route metadata.

operation_tasks:
  - {id: OPS-001, operation: focusa.mission_canvas.projection.get, client: projectionGet, depends_on: [UI-001, UI-002], done: Returns latest validated projection for exact Workstream only.}
  - {id: OPS-002, operation: focusa.mission_canvas.projection.resolve, client: projectionResolve, depends_on: [OPS-001, CORE-006], done: Resolves profile/activity/viewport inputs through Focusa Core and returns revision.}
  - {id: OPS-003, operation: focusa.mission_canvas.profile.list, client: profileList, depends_on: [UI-001, UI-002], done: Returns only profiles with meaningful eligible projection.}
  - {id: OPS-004, operation: focusa.mission_canvas.profile.select, client: profileSelect, depends_on: [OPS-002, OPS-003], done: Selects profile canonically and returns recomposed projection plus Receipt.}
  - {id: OPS-005, operation: focusa.mission_canvas.profile.get, client: profileGet, depends_on: [OPS-003], done: Returns exact registered profile or typed not-found.}
  - {id: OPS-006, operation: focusa.mission_canvas.activity.list, client: activityList, depends_on: [UI-001, UI-002], done: Returns registered applicable activities.}
  - {id: OPS-007, operation: focusa.mission_canvas.activity.select, client: activitySelect, depends_on: [OPS-002, OPS-006], done: Selects activity and returns recomposed projection without changing Workstream authority.}
  - {id: OPS-008, operation: focusa.mission_canvas.domain_pack.install, client: domain_packInstall, depends_on: [ID-010], done: Installs through explicit management flow and returns governed Result/Receipt.}
  - {id: OPS-009, operation: focusa.mission_canvas.layout_memory.get, client: layout_memoryGet, depends_on: [UI-001, UI-002], done: Returns memory scoped by exact Workstream and profile.}
  - {id: OPS-010, operation: focusa.mission_canvas.layout_memory.update, client: layout_memoryUpdate, depends_on: [OPS-009], done: Persists semantic placement preference with idempotency and Receipt.}
  - {id: OPS-011, operation: focusa.mission_canvas.layout.mutate, client: layoutMutate, depends_on: [OPS-002], done: Preview/commit mutation returns canonical layout and rejects unknown contribution IDs.}
  - {id: OPS-012, operation: focusa.mission_canvas.registry.list, client: registryList, depends_on: [UI-001, UI-002], done: Returns typed requested registry with revision.}
  - {id: OPS-013, operation: focusa.mission_canvas.rich_host.resolve, client: rich_hostResolve, depends_on: [ID-010], done: Resolves Focusa Desktop Tauri as primary host and Pi overlay as compatibility only.}
  - {id: OPS-014, operation: focusa.mission_canvas.rich_host.launch, client: rich_hostLaunch, depends_on: [OPS-013], done: Launches/presents Desktop for exact Workstream without forking Pi.}
  - {id: OPS-015, operation: focusa.mission_canvas.rich_host.focus, client: rich_hostFocus, depends_on: [OPS-014], done: Focuses existing Desktop presentation without changing canonical activity.}
  - {id: OPS-016, operation: focusa.mission_canvas.rich_host.hide, client: rich_hostHide, depends_on: [OPS-014], done: Hides presentation while preserving runtime, surface, and drafts.}
  - {id: OPS-017, operation: focusa.mission_canvas.rich_host.close, client: rich_hostClose, depends_on: [OPS-014], done: Closes view using explicit lifecycle semantics without silent canonical destruction.}
  - {id: OPS-018, operation: focusa.mission_canvas.draft.get, client: draftGet, depends_on: [UI-001, UI-002], done: Returns exact Workstream/Surface/recipient draft revision.}
  - {id: OPS-019, operation: focusa.mission_canvas.draft.sync, client: draftSync, depends_on: [OPS-018], done: Idempotently persists draft and rejects stale or foreign revision.}
  - {id: OPS-020, operation: focusa.mission_canvas.recipient.resolve, client: recipientResolve, depends_on: [UI-002, CORE-007], done: Returns authorized exact recipient or blocked reason.}
