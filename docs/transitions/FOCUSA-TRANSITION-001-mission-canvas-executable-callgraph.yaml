schema: focusa.mission_canvas_executable_callgraph.v1
status: executable_decomposition
parent: docs/transitions/FOCUSA-TRANSITION-001-mission-canvas-desktop-callgraph.yaml
purpose: >-
  Atomic implementation tasks for a weaker model. Each task changes one bounded seam,
  names exact inputs and outputs, and has one completion test. Product behavior comes
  only from the cited contracts and generated registries.

agent_contract:
  select:
    - Select the first task in execution_order whose status is ready and whose dependencies are complete.
    - Never skip a blocked dependency by creating local identity, state, mock authority, or a second resolver.
  before_edit:
    - Read every path in read.
    - Verify every named existing symbol with rg before editing.
    - If a symbol or generated field differs, stop and correct this callgraph from the higher-authority contract.
  edit:
    - Edit only files in targets.
    - New product IDs must come from generated contracts or registries.
    - Test fixtures must be under test or fixture paths and must never be selected by production runtime code.
  finish:
    - Run the exact check command.
    - Confirm the done condition.
    - Mark only that task complete and unblock only direct children.
  forbidden:
    - fixed dashboard layouts
    - possible-type Work Surface tabs
    - empty contribution placeholders
    - client-local contribution eligibility
    - client-local canonical layout resolution
    - handwritten duplicate DTOs
    - inferred Workstream or Attachment identity
    - fake PTY data
    - design-only substitutions for missing behavior

shared_sources:
  identity: /tmp/focusa-spec158-transition/docs__spec158__01-identity-ownership-and-reducer.md
  migration: /tmp/focusa-spec158-transition/docs__spec158__02-persistence-migration-and-quarantine.md
  desktop: /tmp/focusa-spec158-transition/docs__spec158__03-client-runtime-and-desktop-contracts.md
  handoff: /tmp/focusa-spec158-transition/docs__transitions__FOCUSA-TRANSITION-001-mission-canvas-to-desktop-handoff.md
  composition: docs/contracts/spec135-adaptive-composition.v1.yaml
  host_contract: docs/contracts/spec135-mission-canvas-host-renderer-contract.v1.yaml
  operation_registry: docs/contracts/spec135/mission-canvas-v1/operation-registry.json
  generated_types: docs/contracts/spec135/mission-canvas-v1/typescript/mission-canvas-types.generated.ts
  generated_client: docs/contracts/spec135/mission-canvas-v1/typescript/mission-canvas-client.generated.ts
  generated_validators: docs/contracts/spec135/mission-canvas-v1/typescript/mission-canvas-validators.generated.ts
  profile_matrix: tests/fixtures/spec135-profile-activity-matrix.json
  responsive_matrix: tests/fixtures/spec135-responsive-evaluations.json
  no_dead_chrome_matrix: tests/fixtures/spec135-thirteen-no-dead-chrome-proofs.json

status_meanings:
  complete: implemented and consumed by a downstream seam
  ready: may be executed now
  blocked: dependency is incomplete
  blocked_external: parent Spec 158 transition work is absent from this worktree
  implemented_partial: implementation exists and is tested, but a declared upstream dependency still blocks canonical production use
  superseded: old host-specific implementation is not a target

