schema_version: focusa.runtime_bleed_crdt_proof_suite.v1
work_item_id: focusa-877z.26
status: proof_suite_defined
source_specs:
  - docs/98-project-root-crdt-reconciliation-foundation-spec.md#9
  - docs/99-original-intent-vs-implementation-audit.md#phase-h-regression-proof
normative_rule: Proof suite must verify implemented bleed guards and CRDT foundation honestly; no known gap may be printed as complete.
proof_groups:
  project_scope_and_bleed:
    covers:
      - two-project/same-project alias handling
      - project root inference fail-closed behavior
      - current-ask override conflict handling
      - Workpoint/Trajectory scoped active selectors
      - Focus Stack/Focus State scoped writes
    commands:
      - bun tests/spec98_pi_scope_cache_switch_handling_runtime_test.mts
      - bun tests/pi_project_root_inference_test.mts
      - bun tests/pi_session_project_switch_ledger_runtime_test.mts
      - bun tests/current_ask_project_override_runtime_test.mts
      - tests/spec98_workpoint_trajectory_active_scope_static_test.py
      - tests/spec98_focus_stack_state_scope_static_test.py
  partition_contracts:
    covers:
      - ProjectRootKey + WorkstreamKey partition contract
      - Work-loop WorkItemKey + WriterKey status partition
      - unscoped canonical-path inventory
    commands:
      - tests/spec98_project_workstream_partition_contract_test.py
      - tests/spec98_work_loop_execution_partition_static_test.py
      - tests/spec98_unscoped_canonical_inventory_static_test.py
  crdt_foundation:
    covers:
      - CRDT vector clock / Lamport / deterministic resolver foundation
      - SQLite event hash-chain foundation
      - CRDT production migration and sync reconciliation
      - Pi/UIAI authority-plane impact worksheet coverage
    commands:
      - tests/spec98_crdt_event_store_wiring_static_test.py
      - tests/spec98_pi_uiai_authority_impact_static_test.py
      - /root/.cargo/bin/cargo test -p focusa-core sync::crdt
  build_gates:
    covers:
      - Pi extension TypeScript compile
      - Rust workspace compile
    commands:
      - npm --prefix apps/pi-extension run check
      - /root/.cargo/bin/cargo check
known_gaps: []
acceptance:
  complete_when:
    - runner executes all commands successfully
    - root cargo commands are followed by fix-user-perms wirebot
    - proof output states no known-gap deferral
