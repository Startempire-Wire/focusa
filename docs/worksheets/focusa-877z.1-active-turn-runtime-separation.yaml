schema_version: focusa.active_turn_runtime_separation_contract.v1
work_item_id: focusa-877z.1
status: active_turn_runtime_only_action_routed
source_specs:
  - docs/98-project-root-crdt-reconciliation-foundation-spec.md#12.1
  - docs/99-original-intent-vs-implementation-audit.md#active-turn-separation
normative_rule: ActiveTurn raw input and assembled prompt are runtime correlation buffers, not canonical cognition authority.
implemented_slice:
  focusa_state_active_turn:
    file: crates/focusa-core/src/types.rs
    field: FocusaState.active_turn
    serde_policy:
      - default
      - skip_serializing
      - skip_deserializing
    effect: old snapshots with active_turn remain readable but active_turn is not persisted as canonical snapshot state
  active_turn_struct:
    file: crates/focusa-core/src/types.rs
    fields:
      - turn_id
      - adapter_id
      - harness_name
      - started_at
      - raw_user_input
      - assembled_prompt
    authority_class: runtime_correlation
    allowed_uses:
      - in-memory turn correlation
      - event-log completion correlation
      - bounded session diagnostics
  runtime_update_action:
    file: crates/focusa-core/src/types.rs
    variant: Action::UpdateActiveTurnRuntime
    routes:
      - crates/focusa-api/src/routes/turn.rs
      - crates/focusa-api/src/routes/proxy.rs
    reducer_policy: no FocusaEvent emitted; runtime-only daemon mutation plus shared-state sync
    effect: turn/proxy prompt and chunk updates no longer directly mutate active_turn through API write-lock state edits
remaining_migration:
  - replace session/status assembled_prompt exposure with bounded runtime diagnostics handle
  - move ActiveTurn storage from FocusaState memory into a dedicated runtime cache once consumers are migrated
proof_requirements:
  - static ActiveTurn serde skip guard
  - static API routes do not directly assign ActiveTurn raw_user_input/assembled_prompt
  - static turn/proxy routes use Action::UpdateActiveTurnRuntime
  - Rust cargo check
  - runtime turn correlation preserved by existing turn/proxy paths
known_gaps:
  - ActiveTurn remains in FocusaState memory for compatibility but is non-persistent runtime-only
  - session/status can still expose bounded active_turn metadata from runtime shared state until diagnostics handle migration
