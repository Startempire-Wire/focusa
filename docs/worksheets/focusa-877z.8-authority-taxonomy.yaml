schema_version: focusa.authority_taxonomy_worksheet.v1
work_item_id: focusa-877z.8
status: implementation_ready_seed
source_specs:
  - docs/98-project-root-crdt-reconciliation-foundation-spec.md#17
  - docs/99-original-intent-vs-implementation-audit.md#20
operator_confirmed:
  trajectory_ladder_north_star: true
  hlt_review_threshold_resumed_sessions: 7
  hlt_ledger_md_required_for_normal_continuation: false

default_profiles:
  safe_default:
    purpose: normal agent/operator work
    posture: strict_scope_validation_compact_envelopes_workpoint_continuation_tl_north_star
  builder:
    purpose: active implementation
    posture: fast_local_workflows_with_visible_authority_labels_and_proof
  audit_strict:
    purpose: architecture/security/release review
    posture: require_surface_impact_migration_and_proof_before_mutation
  lowmem:
    purpose: resource or context pressure
    posture: narrow_diagnostics_handles_first_degrade_advisory_payloads
  browser_debug:
    purpose: UIAI/browser triage
    posture: diagnostics_first_scope_required_for_canonical_linking
  headless_ci:
    purpose: CI/RPC/MCP/CLI workflows
    posture: schema_first_json_envelopes_no_tui_assumptions
  demo_noncanonical:
    purpose: examples/proposals/training/demo
    posture: synthetic_ids_allowed_only_when_explicitly_noncanonical

authority_classes:
  canonical_state:
    meaning: durable reducer-backed state that can affect future cognition or resume authority
    requires: [identity_scope, replayable_event, proof_command, migration_posture]
  continuation_authority:
    meaning: exact immediate next-action handoff when canonical and scope-matched
    requires: [project_root, continuity_id, canonical_true, do_not_drift]
  north_star:
    meaning: durable project/workstream strategic direction for route planning
    requires: [project_root, continuity_id, root_goal_stability, supersession_policy]
  advisory_projection:
    meaning: inferred/contextual guidance that must not mutate authority alone
    requires: [source_refs, confidence_or_status, promotion_path]
  runtime_correlation:
    meaning: temporal/session/turn data for diagnostics and attachment only
    requires: [session_id_or_turn_id, nonauthority_label]
  telemetry:
    meaning: operational/resource pressure signal
    requires: [bounded_summary, no_cognition_mutation]
  evidence_handle:
    meaning: stable proof or artifact handle without raw blob injection
    requires: [target_ref, evidence_ref, scope_fields]
  export_or_demo:
    meaning: noncanonical sample/proposal/synthetic data
    requires: [noncanonical_label, no_authority_promotion]

items:
  - id: trajectory_ladder.hlt
    object_kind: trajectory_field
    current_surface: trajectory_projection
    authority_class: north_star
    default_profile: safe_default
    mutation_class: reducer_event
    canonical_event: TrajectoryGoalDefined
    scope_fields: [project_root, continuity_id]
    identity_key: project_root_plus_continuity_id
    persisted_fields:
      - TrajectoryProjectionRecord.root_long_term_goal
      - TrajectoryProjectionRecord.long_term_goal
      - TrajectoryProjectionRecord.desired_end_state
      - TrajectoryProjectionRecord.root_goal_stability
      - TrajectoryProjectionRecord.goal_provenance
      - TrajectoryProjectionRecord.supersedes_trajectory_id
      - TrajectoryProjectionRecord.canonical
    default_behavior: auto_load_on_pi_restart_or_session_continuation
    review_threshold:
      resumed_sessions: 7
      counter_source: project_workstream_continuation_resume_count
      prompt: "Your HLT has been stable for 7 resumed sessions. Would you like to keep it or update the project north star?"
    supersession_policy:
      allowed_when:
        - explicit_operator_steering
        - project_identity_change
        - durable_supersession_evidence
      rejected_when:
        - recent_file_changes_only
        - git_activity_only
        - inferred_mlg_stg_waypoint_drift_only
    inference_policy:
      infer_on_missing: only_from_prior_canonical_project_workstream_record_or_operator_seed
      do_not_rederive_each_session: true
      fallback_if_missing: ask_operator_or_mark_needs_definition
    affected_surfaces: [daemon, api, cli, pi_plugin, focusa_tools, menubar, docs, tests]
    pi_tools: [focusa_trajectory_view, focusa_trajectory_define_goal, focusa_trajectory_resume, focusa_workpoint_resume]
    uiai_tools: []
    agent_benefit: "removes manual hlt-ledger.md restart ritual while preserving durable project direction"
    handicap_risk: "stale HLT could persist too long if supersession signals are missed"
    mitigation: "7-resume prompt plus explicit supersession evidence gates"
    migration: "hlt-ledger.md remains readable/importable but is not required for normal continuation"
    compact_render_required_text: "TL north star; HLT durable; review after 7 resumed sessions"
    proof_commands:
      - cargo test -p focusa-core trajectory
      - cargo test -p focusa-api trajectory
      - Pi trajectory resume smoke with project_root+continuity_id
      - Verify hlt-ledger.md absent path still resumes HLT from reducer record

  - id: trajectory_ladder.mlg_stg_waypoints
    object_kind: trajectory_projection_fields
    current_surface: trajectory_projection
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: projection_then_optional_reducer_event
    canonical_event: TrajectoryStateDeltaRecorded
    scope_fields: [project_root, continuity_id, session_id]
    persisted_fields:
      - TrajectoryProjectionRecord.mid_level_goal
      - TrajectoryProjectionRecord.short_term_goal
      - TrajectoryProjectionRecord.waypoints
      - TrajectoryProjectionRecord.gap_summary
      - TrajectoryProjectionRecord.milestones
      - TrajectoryProjectionRecord.active_milestone_id
    default_behavior: infer_frequently_from_current_project_signals
    inference_inputs:
      - recent_git_status
      - recent_git_diff_summary
      - recent_file_changes
      - beads_ready_and_active_items
      - active_workpoint_mission_action_next_slice
      - ontology_active_objects_and_relations
      - evidence_refs_and_recent_results
      - focus_state_intent_current_focus_open_questions
      - prediction_records_and_calibration
      - metacog_recent_lessons
    inference_policy:
      hlt_alignment_required: true
      confidence_required_for_auto_display: medium
      promotion_path: accept_via_workpoint_checkpoint_or_trajectory_define_goal_assess
      do_not_use_as_resume_authority_without_workpoint: true
    affected_surfaces: [api, pi_plugin, focusa_tools, menubar, docs, tests]
    pi_tools: [focusa_trajectory_view, focusa_trajectory_assess, focusa_trajectory_propose_workpoint, focusa_workpoint_checkpoint]
    uiai_tools: []
    agent_benefit: "keeps current route adaptive without repeatedly asking operator for lower-ladder details"
    handicap_risk: "agent may overfit transient git/file noise into route guidance"
    mitigation: "label inferred values advisory and require HLT alignment plus Workpoint/evidence promotion"
    migration: "existing short_term_goal/current_focus fallbacks remain advisory until scoped trajectory record exists"
    compact_render_required_text: "MLG/STG/waypoints inferred from evidence; advisory until accepted"
    proof_commands:
      - cargo test -p focusa-api trajectory_view_syncs_focus_current_focus_and_short_term_goal_projection
      - cargo test -p focusa-api trajectory_view_does_not_promote_workpoint_to_long_term_goal
      - Pi trajectory view smoke after file/git/bead signal changes

  - id: trajectory_ladder.hlt_ledger_md
    object_kind: legacy_artifact
    current_surface: project_root_file
    authority_class: evidence_handle
    default_profile: safe_default
    mutation_class: import_or_reference_only
    scope_fields: [project_root]
    default_behavior: optional_legacy_import_not_required
    migration: "If present, hlt-ledger.md may seed operator-confirmed TrajectoryGoalDefined; if absent, continuation uses reducer-backed trajectory records."
    affected_surfaces: [pi_plugin, docs, tests]
    agent_benefit: "removes separate markdown lookup requirement on every Pi restart"
    handicap_risk: "legacy projects may expect file-based HLT until migrated"
    mitigation: "support explicit import/reference while documenting reducer-backed default"
    compact_render_required_text: "hlt-ledger.md optional legacy source; not required for normal continuation"
    proof_commands:
      - Pi restart/session continuation smoke without hlt-ledger.md
      - Pi explicit import smoke when hlt-ledger.md exists

  - id: workpoint.resume_packet
    object_kind: packet
    current_surface: workpoint
    authority_class: continuation_authority
    default_profile: safe_default
    mutation_class: reducer_event
    scope_fields: [project_root, continuity_id, workpoint_id]
    default_behavior: immediate_next_action_authority_when_canonical_and_scope_matched
    relation_to_trajectory_ladder: "Workpoint executes next step; TL supplies north-star context and gap rationale."
    affected_surfaces: [daemon, api, cli, pi_plugin, focusa_tools, menubar, docs, tests]
    agent_benefit: "prevents TL from becoming scheduler or action authority"
    handicap_risk: "agent may ignore TL if Workpoint packet is too local"
    mitigation: "render compact TL HLT/MLG/STG/waypoint context inside resume packet as supporting context"
    compact_render_required_text: "Workpoint action authority; TL north-star support"
    proof_commands:
      - cargo test -p focusa-api workpoint
      - Pi workpoint resume smoke includes TL support refs

  - id: pi_bootstrap.trajectory_ladder_fallback
    object_kind: pi_session_lifecycle
    current_surface: apps/pi-extension/src/session.ts
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: read_then_prompt_or_checkpoint
    scope_fields: [project_root, continuity_id, session_id]
    observed_current_wiring:
      - "session_start refreshes Workpoint at apps/pi-extension/src/session.ts:610"
      - "session_start refreshes Trajectory clarity at apps/pi-extension/src/session.ts:611"
      - "refreshTrajectoryClarityLifecycle sets allow_prior_project_trajectory=true at apps/pi-extension/src/state.ts:2053"
      - "context injection getTrajectoryFocusSliceLines now sets allow_prior_project_trajectory=true at apps/pi-extension/src/turns.ts:399-409"
    required_behavior: "At Pi bootstrap, load previously persisted TL/HLT through focusa_trajectory_view/resume using project_root+continuity_id, then fallback to prior same-project TL when continuity changes before asking for a new HLT. Patch .8.1 adds allow_prior_project_trajectory to Focus Slice context injection and suppresses trajectory prompt when prior-project fallback TL is loaded."
    fallback_order:
      - focusa_project_identity
      - focusa_workpoint_resume
      - focusa_trajectory_view_allow_prior_project_trajectory_true
      - focusa_trajectory_resume
      - local_lastTrajectoryClarity_only_as_degraded_advisory
      - operator_prompt_only_if_missing_or_after_7_resumes
    hlt_prompt_policy:
      threshold_resumed_sessions: 7
      prompt_only_when: [threshold_reached, explicit_operator_steering, project_identity_change, durable_supersession_evidence]
    affected_surfaces: [pi_plugin, focusa_tools, api, docs, tests]
    agent_benefit: "new/restarted Pi sessions receive the last valid TL north star without a separate hlt-ledger.md lookup"
    handicap_risk: "prior TL may leak across continuity if project_root+continuity_id and fallback labels are not explicit"
    mitigation: "prior same-project fallback is advisory unless promoted; render fallback_source_continuity_id and require Workpoint scope match for action authority"
    compact_render_required_text: "Bootstrap TL fallback loaded via focusa_trajectory_view; HLT durable; prior-continuity fallback advisory"
    proof_commands:
      - Pi session_start smoke with existing same project trajectory and new session id
      - Pi session_start smoke with changed continuity_id and allow_prior_project_trajectory=true
      - Pi context injection smoke verifies PROJECT_TRAJECTORY includes fallback TL before operator prompt

  - id: pi_compaction.trajectory_ladder_fallback
    object_kind: pi_compaction_lifecycle
    current_surface: apps/pi-extension/src/compaction.ts
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: checkpoint_then_resume_projection
    scope_fields: [project_root, continuity_id, session_id]
    observed_current_wiring:
      - "session_before_compact calls refreshTrajectoryClarityLifecycle before Workpoint resume at apps/pi-extension/src/compaction.ts:383"
      - "session_compact calls refreshTrajectoryClarityLifecycle after Workpoint resume at apps/pi-extension/src/compaction.ts:467"
      - "post-compact steer now injects a bounded TrajectoryResumePacket section alongside WorkpointResumePacket"
      - "compaction.ts now calls /trajectory/checkpoint before compaction and /trajectory/resume after compaction"
    required_behavior: "Before compaction, create or refresh a Trajectory checkpoint/resume packet paired with Workpoint; after compaction, inject TL HLT/MLG/STG/waypoint context directly, not only as an instruction to call a tool. Patch .8.2 adds trajectory checkpoint/resume helpers, TrajectoryResumePacket formatting, and static regression coverage."
    fallback_order:
      - focusa_trajectory_checkpoint_before_compact
      - focusa_workpoint_checkpoint_before_compact
      - focusa_workpoint_resume_after_compact
      - focusa_trajectory_resume_after_compact
      - focusa_trajectory_view_allow_prior_project_trajectory_true
      - local_lastTrajectoryClarity_only_as_degraded_advisory
    affected_surfaces: [pi_plugin, focusa_tools, api, docs, tests]
    agent_benefit: "post-compaction agent sees the previously set TL immediately and can infer lower ladder route without transcript-tail dependence"
    handicap_risk: "compaction prompt grows or stale local clarity is mistaken for canonical trajectory"
    mitigation: "bounded TL packet; label canonical/degraded/fallback_source_continuity_id; keep Workpoint as action authority"
    compact_render_required_text: "Compaction includes WorkpointResumePacket plus TrajectoryResume/TL fallback packet"
    proof_commands:
      - Pi session_before_compact smoke persists trajectory checkpoint packet
      - Pi session_compact auto-resume smoke includes TL HLT/MLG/STG/waypoints in steer message
      - Pi post-compaction smoke with daemon timeout labels lastTrajectoryClarity degraded advisory


  - id: shared.tool_result_envelope
    object_kind: cross_surface_schema
    current_surface: api_cli_pi_uiai_menubar
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: schema_contract
    scope_fields: [project_root, continuity_id, session_id, workpoint_id, trajectory_id]
    required_fields:
      - ok
      - status
      - canonical
      - advisory_only
      - degraded
      - stale
      - scope_status
      - failure_class
      - retry
      - side_effects
      - evidence_refs
      - next_tools
      - recovery_hint
      - misuse_hint
    default_behavior: every route/tool that can affect agent action emits the same authority/status vocabulary
    affected_surfaces: [daemon, api, cli, pi_plugin, focusa_tools, uiai_packets, menubar, docs, tests]
    agent_benefit: "one interpretation of canonical/advisory/degraded/stale across all agent and human surfaces"
    handicap_risk: "manual envelope drift between API, Pi tools, UIAI packets, CLI, and menubar"
    mitigation: "generate stubs/checks from worksheet and static-test required fields"
    compact_render_required_text: "status/canonical/advisory/degraded/scope/failure/next_tools visible in first-line summary"
    proof_commands:
      - tests/spec96_trajectory_tool_output_schema_static_test.sh
      - tests/spec96_pi_retry_posture_contract_static_test.sh
      - focusa CLI/API/Pi tool contract smoke

  - id: focusa_state.active_turn
    object_kind: state_field
    current_surface: daemon_core
    authority_class: runtime_correlation
    default_profile: safe_default
    mutation_class: runtime_cache
    scope_fields: [project_root, continuity_id, session_id, turn_id]
    canonical_event: TurnStarted
    default_behavior: turn correlation only; prompt/user/raw stream buffers are not durable cognition authority
    affected_surfaces: [daemon, api, cli, pi_plugin, docs, tests]
    agent_benefit: "removes prompt/conversation blobs from canonical cognition while preserving diagnostics correlation"
    handicap_risk: "debugging prompt assembly may become harder after runtime/cognition split"
    mitigation: "store bounded telemetry/evidence handles, not raw prompt blobs, with explicit rehydrate path"
    migration: "old snapshots with active_turn remain readable but nonauthority"
    compact_render_required_text: "runtime correlation only; not cognition authority"
    proof_commands:
      - cargo test -p focusa-core turn
      - static check no direct active_turn canonical meaning writes

  - id: focus_stack.active_frame
    object_kind: state_field
    current_surface: focus_stack
    authority_class: canonical_state
    default_profile: safe_default
    mutation_class: reducer_event
    canonical_event: focus_stack_or_frame_event
    scope_fields: [project_root, continuity_id, session_id, thread_id, frame_id]
    default_behavior: active frame is scoped attention/meaning anchor, never daemon-global fallback authority
    affected_surfaces: [daemon, api, cli, pi_plugin, menubar, docs, tests]
    agent_benefit: "prevents wrong frame injection across project/session switches"
    handicap_risk: "agents may lose convenient global active frame fallback"
    mitigation: "blocked envelope plus ProjectIdentity/Workpoint recovery instead of fallback"
    compact_render_required_text: "Focus Frame scoped; no global active fallback"
    proof_commands:
      - tests/focus_frame_write_contract_test.sh
      - tests/spec96_stale_focus_frame_validation_static_test.sh

  - id: focus_state.slots
    object_kind: focus_state_slots
    current_surface: focus_state
    authority_class: canonical_state
    default_profile: safe_default
    mutation_class: reducer_event_or_validated_focus_update
    scope_fields: [project_root, continuity_id, session_id, frame_id]
    slots: [intent, current_focus, decisions, constraints, failures, next_steps, open_questions, recent_results, artifacts, notes]
    default_behavior: compact durable meaning only; no raw transcript, task lists as decisions, or verbose scratch content
    affected_surfaces: [daemon, api, cli, pi_plugin, focusa_tools, menubar, docs, tests]
    agent_benefit: "keeps ASCC slots useful without becoming transcript storage"
    handicap_risk: "slot validators may reject useful but verbose operator steering"
    mitigation: "route verbose material to scratch/evidence handles and keep Focus State declarative"
    compact_render_required_text: "Focus State meaning slots; bounded and validated"
    proof_commands:
      - tests/focus_work_command_surface_test.sh
      - Pi focusa_decide/constraint/failure validation smoke

  - id: project_identity.scope_envelope
    object_kind: identity_envelope
    current_surface: project_identity
    authority_class: canonical_state
    default_profile: safe_default
    mutation_class: validation_envelope_then_reducer_scope
    scope_fields: [project_root, continuity_id, workspace_id, repo_remote, fingerprint]
    default_behavior: canonical project-aware writes require verified safe project_root and continuity_id; broad cwd is blocked/degraded
    affected_surfaces: [daemon, api, cli, pi_plugin, workpoint, trajectory, evidence, uiai_packets, menubar, docs, tests]
    agent_benefit: "prevents cross-project bleed and stale packet adoption"
    handicap_risk: "low-confidence project_verify can slow otherwise obvious local work"
    mitigation: "allow advisory reads and explicit safe project_root recovery; never canonical mutation from broad cwd"
    compact_render_required_text: "authority boundary = project_root + continuity_id"
    proof_commands:
      - tests/pi_project_root_inference_test.sh
      - tests/security_api_route_scope_enforcement_static_test.sh

  - id: reference_store.evidence_handles
    object_kind: evidence_handle
    current_surface: reference_store_ecs
    authority_class: evidence_handle
    default_profile: safe_default
    mutation_class: append_handle_or_link_event
    scope_fields: [project_root, continuity_id, session_id, workpoint_id, target_ref, evidence_ref]
    default_behavior: write exact handles and bounded summaries; raw blobs stay external and explicitly rehydrated
    affected_surfaces: [daemon, api, cli, pi_plugin, uiai_packets, ontology, menubar, docs, tests]
    agent_benefit: "proof survives compaction without raw-output flood or cross-project leakage"
    handicap_risk: "old label-based/global handle searches may fail after scoping"
    mitigation: "migration maps legacy handles to scoped noncanonical/read-only refs until re-linked"
    compact_render_required_text: "evidence handle scoped; raw content not injected"
    proof_commands:
      - tests/ontology_visual_reverse_extraction_pipeline_contract_test.sh
      - Pi evidence capture/link smoke with exact evidence_ref

  - id: ontology.read_model
    object_kind: read_model
    current_surface: ontology
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: read_model_or_promoted_reducer_event
    scope_fields: [project_root, continuity_id, session_id, object_ref]
    default_behavior: ontology suggests active objects/actions/evidence paths; canonical effects require Workpoint/evidence/PRE/reducer promotion
    affected_surfaces: [daemon, api, pi_plugin, focusa_tools, uiai_packets, menubar, docs, tests]
    agent_benefit: "agents get useful active-object hints without false source-of-truth status"
    handicap_risk: "useful inferred object links may be underused if over-labeled advisory"
    mitigation: "clear promotion path through active_object_resolve and evidence_capture"
    compact_render_required_text: "ontology advisory; promote via evidence/Workpoint"
    proof_commands:
      - tests/ontology_world_contract_test.sh
      - focusa_traverse ontology bounded-slice smoke

  - id: uiai.research_diagnostics_packet
    object_kind: external_packet
    current_surface: uiai_engine
    authority_class: advisory_projection
    default_profile: browser_debug
    mutation_class: proposal_then_focusa_intake
    scope_fields: [focusa_scope.project_root, focusa_scope.continuity_id, focusa_scope.workpoint_id, evidence_ref]
    default_behavior: UIAI packet is proposal-only until focusa_browser_diagnostics_intake/capture/link succeeds
    affected_surfaces: [uiai_packets, pi_plugin, focusa_tools, evidence, workpoint, ontology, menubar, docs, tests]
    agent_benefit: "browser/search diagnostics become durable proof only through explicit Focusa capture"
    handicap_risk: "agents may treat UIAI scope echo or packet render as Focusa authority"
    mitigation: "render capture_status proposal_only|capture_pending|captured|scope_mismatch and validate against Workpoint/ProjectIdentity"
    compact_render_required_text: "UIAI packet proposal-only until Focusa capture/link"
    proof_commands:
      - UIAI scripts/check-tool-parity.sh
      - UIAI scripts/smoke-pi-rendering.sh
      - UIAI browser diagnostics smoke
      - Pi focusa_browser_diagnostics_intake smoke

  - id: telemetry.resource_pressure
    object_kind: operational_signal
    current_surface: telemetry_resource_uiai_pressure
    authority_class: telemetry
    default_profile: lowmem
    mutation_class: telemetry_event
    scope_fields: [project_root, session_id, surface]
    default_behavior: pressure can narrow/block workflows but never mutate cognition truth
    affected_surfaces: [daemon, api, cli, pi_plugin, uiai_tools, menubar, docs, tests]
    agent_benefit: "agents see when browser/resource pressure should change workflow shape"
    handicap_risk: "warnings may be ignored or confused with cognitive authority"
    mitigation: "noncanonical operational label plus recommended narrowed tools"
    compact_render_required_text: "resource/UIAI pressure is operational telemetry, not cognition"
    proof_commands:
      - focusa_tool_doctor smoke
      - uiai_health smoke
      - focusa_resource_mode smoke

  - id: menubar.state_contract
    object_kind: ui_contract
    current_surface: menubar
    authority_class: advisory_projection
    default_profile: safe_default
    mutation_class: display_or_route_action
    scope_fields: [project_root, continuity_id, frame_id, workpoint_id, trajectory_id]
    default_behavior: menubar displays same canonical/advisory/degraded/stale envelope semantics as API/CLI/Pi tools; UI selection never creates authority by itself
    affected_surfaces: [menubar, api, cli, pi_plugin, docs, tests]
    agent_benefit: "humans and agents see the same authority status and handoff packet"
    handicap_risk: "human UI can accidentally appear more authoritative than agent tools"
    mitigation: "copy/handoff buttons call same scoped routes and display same envelope fields"
    compact_render_required_text: "menubar mirrors tool envelope; no UI-created authority"
    proof_commands:
      - menubar state contract smoke
      - API/CLI/Pi/menubar envelope parity static test

  - id: policy_profiles.registry
    object_kind: policy_registry
    current_surface: policy_profiles
    authority_class: canonical_state
    default_profile: safe_default
    mutation_class: config_or_reducer_event
    scope_fields: [project_root, profile_id, override_source]
    default_behavior: configurability uses named profiles; overrides are explicit, inspectable, reversible, and proof-gated
    affected_surfaces: [daemon, api, cli, pi_plugin, menubar, docs, tests]
    agent_benefit: "keeps safe defaults simple while allowing expert workflows without hidden weakening"
    handicap_risk: "silent knobs can erase boundaries or create profile drift"
    mitigation: "profile registry lint plus override audit fields"
    compact_render_required_text: "profile safe_default unless explicit audited override"
    proof_commands:
      - profile registry lint
      - override audit static test

  - id: side_effects.classification
    object_kind: mutation_policy
    current_surface: route_tool_registry
    authority_class: canonical_state
    default_profile: audit_strict
    mutation_class: schema_lint
    scope_fields: [route, tool, project_root, continuity_id]
    classes: [read_only, advisory_projection, runtime_cache, telemetry_event, evidence_write, reducer_event, external_io, destructive]
    default_behavior: every route/tool declares side-effect class and proof/approval posture before implementation
    affected_surfaces: [daemon, api, cli, pi_plugin, focusa_tools, uiai_tools, menubar, docs, tests]
    agent_benefit: "agents know which calls are safe reads, degraded fallbacks, or mutations"
    handicap_risk: "classification overhead slows implementation"
    mitigation: "generate defaults from worksheet and fail lint only for changed surfaces"
    compact_render_required_text: "side_effects declared; mutation class explicit"
    proof_commands:
