schema: focusa.spec152e.activation_call_stack.v1
contract_version: 1
owner: Startempire-Wire/focusa + WPUIAI/wpuiai
authority:
  customer_identity_commerce_human_key_refund_entitlement: WPUIAI.com EDD
  facade: registered_authenticated_bounded_proxy_only
  runtime_grant: authority_issued_device_bound_signed_lease
  product_registry: docs/contracts/spec152e-edd-product-registry.v1.json
  spec172_overlay: verified_no_license_replaces_evaluation
  spec158: excluded
invariants:
  - mailbox_verification_precedes_account_customer_order_key_node_or_lease
  - facade_binding_and_request_correlation_precede_every_handler
  - mutations_are_idempotent_before_side_effects
  - prices_products_grants_features_limits_and_rights_are_server_owned
  - edd_order_license_and_refund_truth_is_never_rolled_back
  - poll_secrets_are_registration_scoped_expiring_and_hash_only_at_rest
  - presenters_return_only_opaque_ids_masked_email_and_redacted_credentials
  - facade_and_client_have_zero_identity_commerce_or_entitlement_authority
  - unknown_operation_state_transition_or_error_fails_closed
  - paid_accounts_are_never_downgraded_by_limited_access_activation
request_context:
  required_all: [request_id, facade_id, presenter, install_channel]
  required_mutation: [idempotency_key]
  facade_auth: [exact_origin, request_timestamp, server_credential]
  correlation_storage: wp_wpuiai_activation_registrations
  forbidden_caller_fields: [email_verified, account_id, edd_customer_id, edd_download_id, edd_price_id, order_id, license_id, price, tier, products, grants, features, limits, node_limit, commercial_rights, entitlement_sequence, lease, refund_status]
registration_states:
  initial: attempt_created
  nonterminal: [attempt_created, email_challenge_sent, email_verified, account_promoted, offer_selected, checkout_pending, limited_access_review, existing_key_review, entitlement_issued, terminal_delivery_ready, device_registered, lease_issued]
  terminal: [delivered, expired, denied, refunded, revoked, superseded, recovery_only]
  transitions:
    attempt_created: [email_challenge_sent, expired, denied]
    email_challenge_sent: [email_verified, expired, denied]
    email_verified: [account_promoted, denied]
    account_promoted: [offer_selected, limited_access_review, existing_key_review, denied]
    offer_selected: [checkout_pending, limited_access_review, existing_key_review, denied]
    checkout_pending: [entitlement_issued, denied, expired]
    limited_access_review: [device_registered, denied]
    existing_key_review: [entitlement_issued, denied]
    entitlement_issued: [terminal_delivery_ready, device_registered, refunded, revoked]
    terminal_delivery_ready: [device_registered, refunded, revoked]
    device_registered: [lease_issued, denied, refunded, revoked]
    lease_issued: [delivered, superseded, refunded, revoked, recovery_only]
    delivered: [superseded, refunded, revoked, recovery_only]
    expired: [recovery_only]
    denied: [recovery_only]
    refunded: [recovery_only]
    revoked: [recovery_only]
    superseded: [recovery_only]
    recovery_only: []
presenter_states: [email_required, email_verification_pending, email_verified, selection_required, checkout_required, payment_pending, license_delivery_ready, activated, denied, recovery_only]
polling:
  credential: opaque_poll_credential
  stored_as: keyed_hash_only
  binding: [registration_id, facade_id, action, expiry]
  response: bounded_state_snapshot
  default_retry_after_seconds: 3
  maximum_retry_after_seconds: 30
  terminal_states: [activated, denied, recovery_only]
  retry_rules:
    safe_retry: [EDD_ORDER_PENDING, EDD_LICENSE_PENDING, LICENSE_DELIVERY_PENDING, AUTHORITY_UNAVAILABLE]
    retry_with_same_idempotency_key: [REQUEST_IN_PROGRESS]
    restart_verification: [EMAIL_VERIFICATION_EXPIRED]
    do_not_retry_unchanged: [ACCOUNT_EMAIL_MISMATCH, FACADE_ORIGIN_DENIED, FACADE_PRODUCT_DENIED, PRODUCT_MAPPING_REQUIRED, EVALUATION_NOT_ELIGIBLE, LICENSE_ACCOUNT_MISMATCH, NODE_LIMIT_EXHAUSTED]
    recovery_only: [EDD_LICENSE_UNUSABLE, REFUNDED, REVOKED]
canonical_output:
  required: [schema, request_id, registration_id, state, terminal, retry, next_action]
  optional: [masked_email, safe_url, verification_delivery_status, one_time_key_envelope, node_id, lease_envelope, error]
  forbidden: [email, normalized_email, raw_email, full_license_key, poll_credential_hash, verification_hash, server_credential, signing_key, card_pan, card_expiry, card_cvc, edd_internal_record]
stages:
  - {id: facade_request_binding, owner: facade_gateway, output: bound_facade_request}
  - {id: correlation_and_idempotency, owner: authority_request_guard, output: canonical_request_or_replay}
  - {id: operation_handler, owner: authority_activation_handler, output: typed_command}
  - {id: identity_service, owner: authority_identity_service, output: verified_identity_decision}
  - {id: edd_service, owner: authority_edd_adapter, output: canonical_commerce_decision}
  - {id: device_service, owner: authority_device_service, output: node_decision}
  - {id: lease_service, owner: authority_lease_service, output: signed_lease_decision}
  - {id: transactional_storage, owner: authority_repository_and_outbox, output: committed_state_and_event}
  - {id: presenter_projection, owner: redacted_activation_presenter, output: public_activation_envelope}
operations:
  - id: activation.start
    method: POST
    path: /v1/activation/start
    handler: ActivationStartHandler
    mutation: true
    input: [email, public_product_code, device_public_key, safe_redirect_handle]
    optional_input: [device_public_key, safe_redirect_handle]
    services: [FacadeRegistry, RegistrationService, IdentityChallengeService]
    storage: [wp_wpuiai_activation_registrations, authority_idempotency, authority_outbox]
    success_states: [email_verification_pending]
    failures: [EMAIL_REQUIRED, EMAIL_DELIVERY_FAILED, FACADE_ORIGIN_DENIED, FACADE_PRODUCT_DENIED, PRODUCT_MAPPING_REQUIRED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: activation.verify
    method: POST
    path: /v1/activation/verify
    handler: ActivationVerifyHandler
    mutation: true
    input: [registration_id, one_time_verifier]
    services: [FacadeRegistry, IdentityChallengeService, IdentityPromotionService, EddCustomerAdapter, LimitedAccessAssertionService]
    storage: [wp_wpuiai_activation_registrations, wp_wpuiai_authority_accounts, wp_wpuiai_email_identities, wp_edd_customers, authority_idempotency, authority_outbox]
    success_states: [email_verified, selection_required]
    failures: [EMAIL_VERIFICATION_REQUIRED, EMAIL_VERIFICATION_EXPIRED, EMAIL_VERIFICATION_FAILED, EMAIL_DELIVERY_FAILED, ACCOUNT_MERGE_REVIEW_REQUIRED, EDD_CUSTOMER_RESOLUTION_FAILED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: activation.offers
    method: GET
    path: /v1/activation/offers
    handler: ActivationOffersHandler
    mutation: false
    input: [registration_id]
    services: [FacadeRegistry, RegistrationService, ProductRegistry]
    storage: [wp_wpuiai_activation_registrations]
    success_states: [selection_required]
    failures: [EMAIL_VERIFICATION_REQUIRED, FACADE_PRODUCT_DENIED, PRODUCT_MAPPING_REQUIRED, REQUEST_ID_REQUIRED, AUTHORITY_UNAVAILABLE]
  - id: activation.select_offer
    method: POST
    path: /v1/activation/select-offer
    handler: ActivationSelectOfferHandler
    mutation: true
    input: [registration_id, public_product_code, journey]
    services: [FacadeRegistry, RegistrationService, ProductRegistry, IdentityService]
    storage: [wp_wpuiai_activation_registrations, authority_idempotency, authority_outbox]
    success_states: [checkout_required, selection_required]
    failures: [EMAIL_VERIFICATION_REQUIRED, FACADE_PRODUCT_DENIED, PRODUCT_MAPPING_REQUIRED, EVALUATION_NOT_ELIGIBLE, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT]
  - id: activation.checkout
    method: POST
    path: /v1/activation/checkout
    handler: ActivationCheckoutHandler
    mutation: true
    input: [registration_id, safe_redirect_handle]
    services: [FacadeRegistry, RegistrationService, ProductRegistry, EddCheckoutAdapter]
    storage: [wp_wpuiai_activation_registrations, wp_edd_orders, wp_edd_order_items, authority_idempotency, authority_outbox]
    success_states: [checkout_required, payment_pending]
    failures: [EMAIL_VERIFICATION_REQUIRED, ACCOUNT_EMAIL_MISMATCH, PRODUCT_MAPPING_REQUIRED, EDD_CHECKOUT_REQUIRED, EDD_ORDER_UNVERIFIED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: activation.existing_license
    method: POST
    path: /v1/activation/existing-license
    handler: ActivationExistingLicenseHandler
    mutation: true
    input: [registration_id, human_license_key, device_public_key]
    services: [FacadeRegistry, IdentityService, EddLicenseAdapter, DeviceService, LeaseService]
    storage: [wp_wpuiai_activation_registrations, wp_edd_licenses, wp_edd_license_activations, wp_wpuiai_authority_nodes, wp_wpuiai_authority_leases, authority_idempotency, authority_outbox]
    success_states: [license_delivery_ready, activated]
    failures: [EMAIL_VERIFICATION_REQUIRED, LICENSE_ACCOUNT_MISMATCH, EDD_LICENSE_PENDING, EDD_LICENSE_UNUSABLE, NODE_LIMIT_EXHAUSTED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: activation.poll
    method: POST
    path: /v1/activation/poll
    handler: ActivationPollHandler
    mutation: true
    input: [registration_id, opaque_poll_credential, device_public_key]
    services: [FacadeRegistry, RegistrationService, EddOrderAdapter, EddLicenseAdapter, DeliveryService, DeviceService, LeaseService]
    storage: [wp_wpuiai_activation_registrations, wp_edd_orders, wp_edd_order_items, wp_edd_licenses, wp_wpuiai_authority_nodes, wp_wpuiai_authority_leases, authority_idempotency, authority_outbox]
    success_states: [email_verification_pending, payment_pending, license_delivery_ready, activated, denied, recovery_only]
    failures: [POLL_CREDENTIAL_REQUIRED, POLL_CREDENTIAL_EXPIRED, EDD_ORDER_PENDING, EDD_ORDER_UNVERIFIED, EDD_LICENSE_PENDING, EDD_LICENSE_UNUSABLE, LICENSE_DELIVERY_PENDING, LICENSE_DELIVERY_FAILED, NODE_LIMIT_EXHAUSTED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, REQUEST_IN_PROGRESS, AUTHORITY_UNAVAILABLE]
  - id: lease.refresh
    method: POST
    path: /v1/lease/refresh
    handler: LeaseRefreshHandler
    mutation: true
    input: [node_id, refresh_credential, current_sequence]
    services: [IdentityService, EddLicenseAdapter, RefundRevocationService, DeviceService, LeaseService]
    storage: [wp_edd_orders, wp_edd_licenses, wp_wpuiai_authority_nodes, wp_wpuiai_authority_leases, authority_idempotency, authority_outbox]
    success_states: [activated, recovery_only]
    failures: [EDD_LICENSE_UNUSABLE, LICENSE_ACCOUNT_MISMATCH, REFUNDED, REVOKED, ENTITLEMENT_REQUIRED, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: nodes.list
    method: GET
    path: /v1/nodes
    handler: NodesListHandler
    mutation: false
    input: [account_session]
    services: [IdentityService, DeviceService]
    storage: [wp_wpuiai_authority_nodes]
    success_states: [activated, recovery_only]
    failures: [EMAIL_VERIFICATION_REQUIRED, ENTITLEMENT_REQUIRED, REQUEST_ID_REQUIRED, AUTHORITY_UNAVAILABLE]
  - id: nodes.deactivate
    method: POST
    path: /v1/nodes/deactivate
    handler: NodeDeactivateHandler
    mutation: true
    input: [account_session, node_id]
    services: [IdentityService, DeviceService, LeaseService]
    storage: [wp_wpuiai_authority_nodes, wp_wpuiai_authority_leases, authority_idempotency, authority_outbox]
    success_states: [activated, recovery_only]
    failures: [EMAIL_VERIFICATION_REQUIRED, LICENSE_ACCOUNT_MISMATCH, REQUEST_ID_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, AUTHORITY_UNAVAILABLE]
  - id: account.manage_link
    method: GET
    path: /v1/account/manage-link
    handler: AccountManageLinkHandler
    mutation: false
    input: [account_session, safe_redirect_handle]
    services: [FacadeRegistry, IdentityService, AccountRecoveryService]
    storage: [wp_wpuiai_authority_accounts, wp_wpuiai_email_identities]
    success_states: [activated, recovery_only]
    failures: [EMAIL_VERIFICATION_REQUIRED, ACCOUNT_EMAIL_MISMATCH, FACADE_ORIGIN_DENIED, REQUEST_ID_REQUIRED, AUTHORITY_UNAVAILABLE]
