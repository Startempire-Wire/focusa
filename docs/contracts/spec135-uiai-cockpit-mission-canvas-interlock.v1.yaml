requirements:
  - id: MCUI-001
    statement: Focusa remains the sole canonical mission and work authority.
  - id: MCUI-002
    statement: Cockpit never duplicates Work Rail, steering, follow-up, approvals, recurrence authority, or completion state.
  - id: MCUI-003
    statement: Every mission-bound UIAI object has an exact versioned Focusa binding.
  - id: MCUI-004
    statement: Cockpit-hosted Focusa projections use generated Focusa contracts and action bindings.
  - id: MCUI-005
    statement: Mission Canvas UIAI projections remain bounded and deep-link to Cockpit for execution detail.
  - id: MCUI-006
    statement: Contextual handoff creates or attaches canonical Focusa work through preview and commit.
  - id: MCUI-007
    statement: All intake surfaces separate verified instruction from untrusted context.
  - id: MCUI-008
    statement: Operator takeover coordinates Focusa intervention and UIAI actuator control without collapsing their state machines.
  - id: MCUI-009
    statement: Agent resume after takeover requires operator delta and fresh observation.
  - id: MCUI-010
    statement: Focusa credential grants contain no secret and UIAI cannot self-authorize secret use.
  - id: MCUI-011
    statement: Mission-bound recurrence has one Focusa policy and one UIAI execution manifest.
  - id: MCUI-012
    statement: UIAI submits refs through typed operations and never injects canonical Focusa events directly.
  - id: MCUI-013
    statement: Deep links revalidate exact scope authority revision and freshness.
  - id: MCUI-014
    statement: Close view and terminate runtime remain distinct across both GUIs.
  - id: MCUI-015
    statement: Aggregate views cannot mutate without explicit target selection.
  - id: MCUI-016
    statement: Reconnect and restoration preserve exact Focusa and UIAI identities without silent adoption.
  - id: MCUI-017
    statement: Browser notebook document research test and automation objects reuse one binding model.
  - id: MCUI-018
    statement: All unavailable partial stale blocked and docs-only states are visible and truthful.
  - id: MCUI-019
    statement: UIAI Engine Eval provides actual cross-GUI functional and visual proof.
  - id: MCUI-020
    statement: Raw secrets never appear in Focusa or UIAI events prompts logs screenshots artifacts or receipts.

