cockpit_focusa_projection_levels:
  - id: mission_context_strip
    purpose: compact persistent mission context on every Focusa-bound UIAI object
    required_fields:
      - project_root_or_plain_project_label
      - continuity_or_workstream
      - workpoint_ref
      - work_surface_ref
      - mission_or_session_status
      - next_safe_action_ref
      - authority_or_approval_posture
      - proof_posture
      - source_state_revision
      - event_cursor
      - freshness
    forbidden:
      - duplicate_work_rail
      - client_computed_next_safe_action
  - id: mission_inspector
    sections:
      - mission
      - current_work
      - next_safe_action
      - authority
      - proof
      - attachments
      - contention
      - receipts
    actions: generated_focusa_action_bindings_only
  - id: hosted_mission_canvas_dock
    renderer: approved_focusa_generated_ui_package
    owns_focusa_surface_model: false
    owns_focusa_action_registry: false
  - id: full_mission_canvas_work_object
    renderer: approved_focusa_generated_ui_package
    may_show:
      - project_overview
      - multiplexed_work_surfaces
      - work_rail
      - steering
      - follow_up
      - contention
      - evidence_and_receipts

