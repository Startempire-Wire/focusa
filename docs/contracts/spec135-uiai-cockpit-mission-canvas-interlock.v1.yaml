closure:
  status: implementation_open
  rule: >-
    Close only when one Focusa mission authority, one Mission Canvas work
    projection, one UIAI execution plane, generated cross-repository contracts,
    exact bindings, typed handoff/intake, reversible control reconciliation,
    split credential authority/custody, one recurrence authority, durable events,
    and inspected functional visual proof are verified together.