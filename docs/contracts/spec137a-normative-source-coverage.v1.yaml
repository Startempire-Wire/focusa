      "section": "Pi and agent surface",
      "text": "Pi tools SHALL include bounded equivalents for time awareness/status/trust, civil-deadline resolution and conflict inspection, deadline inspection/mutation, estimate request/validation, typed claim inspection, progress status/recording, temporal preflight, guard inspection, cancellation inspection, and incident inspection. Guard issuance/revocation and deadline mutation retain exact authority/confirmation boundaries and are never inferred from conversational urgency. Mutation tools preserve the same approval and CAS requirements as API/CLI.",
