      "source_line": 370,
      "section": "Trusted clock and temporal authority",
      "text": "- Host sleep and daemon downtime continue wall-clock elapsed while active execution stops. Suspend-sensitive expiry domains use a verified suspend-aware clock where the platform provides one.",
