      "source_line": 372,
      "section": "Trusted clock and temporal authority",
      "text": "- NTP correction/slew, manual clock change, DST, timezone/tzdb change, source disagreement, leap/smear policy, suspend/wake, and device/daemon skew produce explicit posture and append-only correction events; they cannot create negative or falsely exact elapsed time.",
