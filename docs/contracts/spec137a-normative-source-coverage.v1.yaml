      "section": "Time-sensitive action law",
      "text": "Immediately before dispatch, the deterministic executor locally rechecks guard validity, monotonic time, data freshness, authority revision, risk, account/instrument scope, sequence fence, and kill-switch epoch. Expired, revoked, stale, signature-invalid, sequence-invalid, or uncertainty-violating intents MUST NOT dispatch. After a possible effect, timeout/disconnect enters `outcome_unknown` and reconciliation-before-retry under the approved local settlement protocol; blind retry is prohibited.",
