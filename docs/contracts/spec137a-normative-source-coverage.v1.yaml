      "source_line": 1079,
      "section": "Deadline inquiry",
      "text": "The agent may continue safe reversible discovery while awaiting the answer only when policy permits and the missing deadline cannot cause harmful prioritization. It must not repeatedly ask once the operator has answered, explicitly stated there is no deadline, or supplied a governing calendar policy.",
