      "source_line": 371,
      "section": "Trusted clock and temporal authority",
      "text": "- Reboot creates a new monotonic epoch linked through persisted ClockSamplePairs with explicit uncertainty. An untrusted wall bridge cannot produce exact inter-boot duration.",
