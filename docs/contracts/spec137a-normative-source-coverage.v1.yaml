      "source_line": 1098,
      "section": "Top approaching deadlines and prioritization",
      "text": "The Work Loop, Trajectory, Mission Canvas, Pi, TUI, and menubar consume the same ranking. If the operator asks for lower-ranked work while a critical deadline is endangered, the agent obeys valid steering but MUST surface the conflict, consequence, and safer sequencing option. It never silently changes the operator's ask.",
