      "source_line": 1986,
      "section": "Storage",
      "text": "All records include a typed `scope_kind`/`scope_id` and only the identifiers applicable to that scope. Host clock/trust records are host-scoped and referenced by project projections; operator calendar records are operator-scoped; project/work records are project-scoped. A missing inapplicable identifier is not an authority fallback, and no host/operator record may be merged across incompatible identities.",
