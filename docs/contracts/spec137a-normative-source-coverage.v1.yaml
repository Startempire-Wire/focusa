      "source_line": 1467,
      "section": "Calm focus gradient",
      "text": "As pressure rises, context breadth and narration generally decrease while action specificity, verification cadence, and critical-path adherence increase. A protected checklist preserves safety, security, authority, required acceptance/proof, reconciliation, disconfirming evidence, accessibility, and stop-work/escalation authority at every pressure level. High-consequence profiles may require independent or two-person review. The system tracks sustained critical duration, handoff freshness, operator/agent workload posture, and fatigue/attention limits; it escalates to a fresh reviewer when policy requires.",
