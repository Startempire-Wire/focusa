      "source_line": 465,
      "section": "Deterministic execution boundary",
      "text": "An LLM turn, conversational agent, general Work Loop, networked model call, or UI rendering path MUST NOT sit in a microsecond- or millisecond-critical live order-routing loop.",
      "normative_tokens": [
        "MUST NOT"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0467-ee4fbc118eff",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 467,
      "section": "Deterministic execution boundary",
      "text": "Models may observe, propose, explain, critique, and produce governed strategy/policy candidates. A specialized deterministic, pre-authorized, risk-bounded adapter/execution engine performs latency-critical actions using immutable inputs and exact constraints. The approved local settlement protocol governs proposal, authority, durable intent, dispatch lineage, reconciliation, completion, settlement, and learning around that engine; this is proposed Spec 136 only after its activation conditions are satisfied.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0469-bbc0d86a8d80",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 469,
      "section": "Deterministic execution boundary",
      "text": "The critical path uses a signed, immutable, locally enforceable `TemporalExecutionGuard`; it MUST NOT synchronously fetch a model turn, UI state, remote calendar, or daemon projection immediately before dispatch. Full HumanCalendarContext and TemporalPriorityFrame lineage is resolved before guard issuance and linked asynchronously to resulting audit events. Stale, unverifiable, revoked, or uncertainty-violating guards fail closed.",
