  "clauses": [
    {
      "clause_id": "S137-C-0011-35bd3675e4bf",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 11,
      "section": "Status",
      "text": "**Current truth:** existing temporal runtime surfaces may satisfy verified slices only; they do not by themselves establish combined Spec 137 + 137A full conformance.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0015-119eb335acc5",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 15,
      "section": "Status",
      "text": "Cross-spec boundary: Spec 130 owns compaction continuity; true addendum Spec 130A owns compaction performance, cache preservation, and zero-waste gates; Spec 131 owns Workpoint Item timing, velocity, and closure authority; proposed Spec 136 owns proposal-to-settlement lifecycle and outcome truth subject to its stated activation conditions. Spec 137 owns the cross-system temporal primitives defined below and consumes—rather than duplicates—those neighboring authorities. Where an implementation requirement touches another owner's domain, the owning spec remains normative and Spec 137 records only the required temporal integration.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0027-7ebcbcac167a",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 27,
      "section": "Constitutional temporal directive",
      "text": "Human wall-clock time is nonrenewable. Focusa SHALL minimize time-to-verified-and-settled outcome without weakening scope, safety, authority, evidence, reconciliation, accessibility, or operator control.",
      "normative_tokens": [
        "SHALL"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0046-8332b3a39f0f",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 46,
      "section": "Constitutional temporal directive",
      "text": "`complete` for deadline evaluation means every completion/settlement predicate in the approved local target-state contract has passed, external reality is reconciled where applicable, settlement is recorded, and the required Receipt is committed. Proposed Spec 136 is present in this repository but remains subject to its stated activation conditions; once active, its applicable predicates become the settlement contract without replacing Spec 137 temporal primitives or Spec 131 timing and closure authority. Code written, process exit, provider `200`, passing one test, an agent final message, or provider task status is not deadline completion.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0052-e25a6604ac10",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 52,
      "section": "Problem",
      "text": "Focusa currently budgets autonomous execution, but it does not govern the irreversible consumption of human calendar time. Activity may be mistaken for progress. Completed-only velocity can omit failed, abandoned, blocked, reopened, and censored attempts, creating survivorship bias. Agents and clients can emit apparently precise estimates without a trusted current-time source, comparable history, target-state definition, scope revision, uncertainty, or calibration.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0098-31dfed24aaca",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 98,
      "section": "Non-goals",
      "text": "- No visual SaaS implementation requirement; this spec defines the canonical substrate and required projections.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0105-137be85e5990",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 105,
      "section": "Core temporal laws",
      "text": "1. **Time facts are not predictions.** Trusted current time and measured elapsed intervals are observations. Estimated remaining duration is a probabilistic claim.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0106-c0365cc4ba1a",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 106,
      "section": "Core temporal laws",
      "text": "2. **Budgets are not forecasts.** Authorized runtime does not predict completion.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0107-e60f881e17d3",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 107,
      "section": "Core temporal laws",
      "text": "3. **Budgets are not deadlines.** A renewable Work Loop budget cannot modify an absolute calendar commitment.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0108-338346bfda22",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 108,
      "section": "Core temporal laws",
      "text": "4. **Activity is not progress.** Tool calls, tokens, file reads, compilation, process liveness, and narration do not establish material advancement.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0109-8addeb1ef5c4",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 109,
      "section": "Core temporal laws",
      "text": "5. **Process exit is not completion.** Completion and deadline posture use the exact required target state.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0110-78058e7c507f",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 110,
      "section": "Core temporal laws",
      "text": "6. **Human time is not renewable.** Pause, compaction, restart, model change, scope confusion, verifier outage, and agent absence do not move an external deadline.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0111-966332169786",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 111,
      "section": "Core temporal laws",
      "text": "7. **Urgency cannot mint authority.** Deadline pressure cannot grant scope, permission, approval, evidence, closure, or destructive-action authority.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0112-e2bfdc3c837a",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 112,
      "section": "Core temporal laws",
      "text": "8. **Unknown means unknown.** Missing timing history, unclear completion target, stale scope, or unavailable temporal authority requires refusal of a duration estimate.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0113-ca533b49895b",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 113,
      "section": "Core temporal laws",
      "text": "9. **Failure history counts.** Forecasting must include failed, blocked, reopened, rolled-back, abandoned, and censored attempts where relevant.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0114-2d250dacac1c",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 114,
      "section": "Core temporal laws",
      "text": "10. **Temporal state is scoped.** Every record binds to its applicable operator/host/project/continuity/Workpoint/item/task and cannot merge across incompatible scope.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0115-45778667102d",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 115,
      "section": "Core temporal laws",
      "text": "11. **Corrections append.** Clock, attribution, estimate, deadline, and incident corrections supersede; they never rewrite history in place.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0116-8576a77f87af",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 116,
      "section": "Core temporal laws",
      "text": "12. **Deadlines are revisioned authority.** Deadline changes require authenticated, authorized, audited reducer operations.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0117-272ed802231a",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 117,
      "section": "Core temporal laws",
      "text": "13. **Reconciliation survives expiry.** Deadline expiry may block new optional work but must not prevent truth recovery, compensation, process cleanup, evidence preservation, or settlement of possible effects.",
      "normative_tokens": [
        "MAY",
        "MUST NOT"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0118-a35ebf755e75",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 118,
      "section": "Core temporal laws",
      "text": "14. **Only settled completion satisfies a commitment** when the approved target-state contract requires settlement and a Receipt; a locally adopted Spec 136 may supply those predicates, but its remote draft cannot.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0119-87b8ed07a94d",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 119,
      "section": "Core temporal laws",
      "text": "15. **One temporal authority.** Clients render and request; the daemon/reducer/persistence path owns canonical temporal state.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0120-ca2415024bd9",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 120,
      "section": "Core temporal laws",
      "text": "16. **Guardrails are runtime-native.** Prompt reminders explain temporal policy but cannot be its enforcement boundary.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0121-c279dee18265",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 121,
      "section": "Core temporal laws",
      "text": "17. **No silent deferral or omission.** Every normative statement in this specification must be represented in the machine-readable requirement ledger. Every applicable `MUST`/`SHALL`, activated conditional requirement, and accepted `SHOULD` must be assigned to an implementation slice and closed by durable Evidence and a Receipt.",
      "normative_tokens": [
        "MUST",
        "SHALL",
        "SHOULD"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0122-45ed47818c47",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 122,
      "section": "Core temporal laws",
      "text": "18. **Absence is not degradation.** Missing implementation, missing wiring, missing tests, an empty projection, a hard-coded placeholder, a mock, a hidden feature flag, or an unavailable route cannot be reported as degraded-but-complete.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0123-9b09b1a94aed",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 123,
      "section": "Core temporal laws",
      "text": "19. **Later is a governed decision.** An applicable mandatory requirement may move to a later tranche only through an explicit operator-approved specification amendment that records the exact requirement IDs, reason, impact, replacement tranche, dependencies, acceptance consequences, and superseding Receipt. It remains visibly open and blocks any conformance level that requires it.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0124-cc53e9e6b888",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 124,
      "section": "Core temporal laws",
      "text": "20. **Normative classes retain their meaning.** `MUST`/`SHALL` requirements are mandatory when applicable. An unimplemented `SHOULD` requires a recorded, evidence-backed variance and operator acceptance. A `MAY` is optional unless an operation, capability profile, conformance claim, or approved scope activates it; optionality never permits a client to claim unsupported behavior.",
      "normative_tokens": [
        "MAY",
        "MUST",
        "SHALL",
        "SHOULD"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0125-458c6a4e24da",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 125,
      "section": "Core temporal laws",
      "text": "21. **Temporal primacy is continuous at decision boundaries.** Immediately below the verified current operator ask, fresh time awareness constrains every plan, action decision, tool decision, response, checkpoint, and continuation. Lower-priority context cannot suppress it, but critical deterministic executors use a pre-authorized local TemporalExecutionGuard rather than adding a remote/model refresh to their dispatch path.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0126-015e2d3ca13a",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 126,
      "section": "Core temporal laws",
      "text": "22. **Every interaction and consequential action is human-calendar grounded.** Agent turns, schedule interpretations, relative-time phrases, autonomous continuation, and consequential action decisions require a fresh trusted local calendar/time context or explicit unavailable posture. Irrelevant hot-path records may carry a signed minimal context hash/guard ref instead of private calendar detail.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0127-c85de3b6ed1d",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 127,
      "section": "Core temporal laws",
      "text": "23. **Urgency is continuously computed.** A daemon-owned temporal pulse repeatedly evaluates trusted current time, elapsed time, deadlines, safety margin, slack, no-progress age, and opportunity risk; urgency cannot depend on the model remembering to check.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0128-27619165e292",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 128,
      "section": "Core temporal laws",
      "text": "24. **Temporal learning is outcome-governed.** Predictions, reflections, and strategy changes about time are continually evaluated, but only evidence-backed settled outcomes may promote durable procedural change.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0129-8fbe4d5635c5",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 129,
      "section": "Core temporal laws",
      "text": "25. **Pressure produces calm protected focus, not panic.** As time pressure rises, the agent becomes progressively narrower, clearer, more execution-oriented, and more evidence-disciplined while preserving mandatory safety, security, authority, reconciliation, disconfirming-evidence, accessibility, and closure checks.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0130-68dbcfaf39fd",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 130,
      "section": "Core temporal laws",
      "text": "26. **Past-due delivery becomes the highest eligible execution priority.** After breach, Focusa first verifies what valid delivery opportunity remains, then freezes unrelated optional work and calmly focuses on the smallest safe path to deliver and settle the overdue item. Simultaneous non-preemptible or more-severe obligations create an explicit conflict/infeasibility state rather than silent selection.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S137-C-0134-f7393e0f5e77",
      "source_path": "docs/137-focusa-temporal-authority-deadlines-urgency-grounded-forecasting-spec.md",
      "source_line": 134,
      "section": "Completeness, non-deferral, and omission firewall",
      "text": "Every normative statement MUST map to at least one stable requirement ID in `docs/contracts/spec137-complete-feature-ledger.v1.yaml` before its implementation begins. The normalized IDs are `S137-REQ-001..S137-REQ-086`, corresponding to the numbered acceptance criteria. Detailed clauses map through the ledger's inherited `normative_source_coverage`; equivalent clauses may share a row only when the row preserves the strongest normative class and all behavior, applicability, failure, and proof obligations. A clause with no mapping, a weaker many-to-one mapping, or an unmapped new heading fails the completeness gate. The append-only/versioned ledger includes:",
      "normative_tokens": [
        "MAY",
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
