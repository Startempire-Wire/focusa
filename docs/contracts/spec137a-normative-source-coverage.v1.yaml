      "section": "Urgency signal",
      "text": "Required behavior changes may include narrower context, shorter progress intervals, cancellation of low-value work, forced replan, critical-path selection, evidence-first execution, best-verified-partial preservation, or operator escalation. The signal is calm and factual in UX but impossible for the execution policy to ignore.",
