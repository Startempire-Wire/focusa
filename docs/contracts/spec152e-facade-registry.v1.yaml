    brand: {name: WPUIAI, logo_path: /assets/wpuiai-mark.svg}
    sender: {identity: wpuiai_transactional_v1, display_name: WPUIAI}
    paths: {verification: /activate/verify, checkout: /activate/checkout, success: /activate/success, cancel: /activate/cancel, manage: /account, recovery: /activate/recovery}
    callbacks: {success: /activate/callback/success, cancel: /activate/callback/cancel, recovery: /activate/callback/recovery}
    locale: {default: en-US, allowed: [en-US]}
    presenter_capabilities: [browser_registration, account_management_handoff, edd_checkout_handoff, bounded_authority_proxy]
    rate_policy_ref: facade_standard_v1
    abuse_policy_ref: authority_facade_abuse_v1
invariants:
  - exact_https_origins_only
  - no_wildcards_or_subdomain_inheritance
  - products_are_exact_server_owned_allowlists
  - callbacks_are_named_relative_paths_resolved_against_the_bound_origin
  - sender_identities_are_resolved_from_the_registry_never_the_request
  - facades_never_issue_entitlement_or_own_customer_commerce_truth
  - public_descriptor_contains_no_credentials_secrets_or_email_addresses
