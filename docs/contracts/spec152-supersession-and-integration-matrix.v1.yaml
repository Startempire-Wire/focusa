release_rule: >-
  Historical implementation truth may remain documented, but no active guide, release claim,
  lifecycle receipt, installer path, pairing path, source-build path, facade path, or UIAI
  health/auth path may treat missing/local state as Evaluation, create a canonical customer or
  entitlement before mailbox verification, use split registries or direct install-site issuance,
  trust implicit EDD mappings or caller-controlled grants, or claim evaluator/customer readiness
  without the combined Spec 150 + 150A + 152 + 152E + 152F + applicable 152A gates. Spec 158 remains excluded.
entries:
  - path: docs/152f-simple-entitlement-gating-and-future-granularity-addendum.md
    classification: active_release_blocking_simplification_policy
    conflicting_claim: exhaustive entitlement coverage requires independent commercial policy or feature purchase decisions at every route command button worker or source file
    disposition: all surfaces inherit one base product gate four optional premium families permanent recovery/read/export/security-maintenance allowances and dormant future dimensions
    required_change: complete focusa-vbcqu.20.14 through focusa-vbcqu.20.14.52 without weakening Spec 152E authority
    status: registered_pending_implementation
  - path: docs/152e-edd-centered-universal-multi-surface-licensing-and-branded-facade-addendum.md
    classification: active_release_blocking_correction
    conflicting_claim: prior Spec 152 documents do not fully consolidate EDD identity commerce human-key entitlement and facade authority
    disposition: Spec 152E is mandatory and supersedes local Evaluation split registries direct install-site issuance implicit EDD mappings caller-controlled grants and unverified-email promotion
    required_change: complete focusa-vbcqu.20.13 and preserve Spec 158 exclusion
    status: registered_pending_implementation
  - path: deployment://install.focusa.dev/custom-license-registry
    classification: deployed_split_authority_superseded
    conflicting_claim: custom registry and direct Stripe webhook can independently issue Focusa or UIAI entitlement
    disposition: retain read-only migration evidence; WPUIAI.com EDD becomes sole issuance authority and the domain becomes a registered facade
    required_change: inventory migrate subordinate then disable new issuance with rollback and reconciliation proof
    status: release_blocker
  - path: deployment://wpuiai.com/edd-focusa-integration
    classification: deployed_canonical_authority_incomplete
    conflicting_claim: implicit EDD Download mapping synthetic payment IDs or custom Focusa keys can establish durable product and order authority
    disposition: EDD remains canonical only through explicit server-owned product mappings real orders Software Licensing keys and verified identity
    required_change: implement allowlisted product registry atomic customer promotion checkout integrity outbox and reconciliation
    status: release_blocker
  - path: activation://unverified-email
    classification: superseded_identity_flow
    conflicting_claim: supplied email Stripe email or installer receipt may create or link canonical customer checkout Evaluation license node or lease
    disposition: unverified email creates only a bounded pending registration; mailbox verification precedes canonical promotion
    required_change: implement single-use verification atomic EDD customer promotion and email-change hold
    status: release_blocker
  - path: facade://non-wpuiai-domains
    classification: presenter_only
    conflicting_claim: a branded domain may issue entitlement collect card data select grants or own customer truth
    disposition: registered facades render brand and bounded proxy flows only; exact origin and redirects are authority controlled
    required_change: implement facade registry credentials origin binding safe redirects and negative spoof tests
    status: release_blocker
  - path: evaluation://installer-local
    classification: superseded_evaluation_flow
    conflicting_claim: installer-local state --eval missing license or source checkout may create runnable Evaluation
    disposition: Evaluation is a verified EDD-backed authority-issued expiring human key and signed lease
    required_change: remove local issuance and converge every presenter on the universal registration state machine
    status: release_blocker
  - path: docs/150-focusa-guided-install-first-project-and-lifecycle-master-spec.md
    classification: active_spec_amended
    conflicting_claim: lifecycle acceptance can be complete from version, health, adapters, project, and first Workpoint without immutable entitlement binding
