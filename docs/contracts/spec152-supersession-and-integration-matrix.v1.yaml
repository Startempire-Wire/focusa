  protected_distribution: docs/152a-protected-distribution-private-feature-capsules-and-anti-tamper-spec.md
release_rule: >-
  Historical implementation truth may remain documented, but no active guide, release claim,
  lifecycle receipt, installer path, pairing path, source-build path, or UIAI health/auth path
  may treat missing/local state as Evaluation or claim evaluator/customer readiness without
  the combined Spec 150 + 150A + 152 + applicable 152A gates.
entries:
  - path: docs/150-focusa-guided-install-first-project-and-lifecycle-master-spec.md
    classification: active_spec_amended
    conflicting_claim: lifecycle acceptance can be complete from version, health, adapters, project, and first Workpoint without immutable entitlement binding
    disposition: Spec 150A is mandatory; implementation_verified means lifecycle mechanics only
    required_change: add lease state/id/sequence/digests/node/product/feature bindings to lifecycle requests, adapters, and receipts
    status: release_blocker
  - path: docs/118-focusa-license-guard-spec.md
    classification: historical_implementation_superseded
    conflicting_claim: self-issued seven-day Evaluation is the default and local state is authority
    disposition: superseded by Spec 152 for all future evaluator/customer releases
    required_change: remove runtime self-issuance and local tier authority
    status: release_blocker
  - path: docs/118-focusa-license-tiers-spec.md
    classification: public_reference_superseded_in_part
    conflicting_claim: Evaluation describes a use category without requiring authority issuance
    disposition: Evaluation remains a license class but must be authority-issued and signed
    required_change: update public tier wording when implementation lands
    status: documentation_migration_required
  - path: docs/128-focusa-over-the-air-auto-update-and-dev-mode-license-spec.md
    classification: active_spec_amended
    conflicting_claim: Evaluation/community-source posture and developer mode are not fully bound to authority-issued signed leases
    disposition: Spec 152 owns entitlement; Spec 128 retains update mechanics
    required_change: gate update check/apply/unattended policy by signed features and authority-issued developer license
    status: release_blocker
  - path: docs/112-install-binary-architecture-spec.md
    classification: active_spec_amended
    conflicting_claim: legacy --eval installer path can be treated as approved evaluator activation
