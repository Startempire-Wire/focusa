  - path: crates/focusa-license/src/lib.rs
    classification: current_code_superseded
    conflicting_claim: missing state, local JSON/TOML, or environment values can construct effective entitlement
    disposition: replace with canonical signed-lease verifier
    required_change: fail closed to recovery-only and use real cryptographic digests/signatures
    status: release_blocker
  - path: crates/focusa-core/src/license.rs
    classification: current_code_superseded
