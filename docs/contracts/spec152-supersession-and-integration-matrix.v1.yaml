combined_release_blockers:
  - canonical signed-lease verifier
  - authority device-code and verified-email Evaluation issuance
  - lifecycle entitlement binding and receipts
  - installer Bash and PowerShell replacement of self-issued Evaluation
  - entitlement-first menubar first run before pairing
  - central runtime feature and recovery-mode enforcement
  - UIAI independent entitlement enforcement
  - generated feature/route/client coverage ledgers
  - protected worker/capsule boundary for selected crown-jewel features
  - documentation consistency gates
  - staging, migration, rollback, and adversarial E2E proof
