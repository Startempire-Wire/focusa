  - id: workset.completion.execute
    kind: governed_execution
    permission: workset:complete
    confirmation: explicit
    idempotency: required
    side_effects: [acquire_lease, execute_transition_dag, append_event, capture_evidence, commit_receipt]
    evidence_required: true
  - id: workset.cancel.preview
    kind: preview
    permission: workset:propose
    confirmation: none
    idempotency: required
    side_effects: [read_state, compute_preview]
    evidence_required: false
  - id: workset.cancel.commit
    kind: mutation
    permission: workset:write
    confirmation: explicit
    idempotency: required
    side_effects: [append_event, stop_automation, update_projection]
    evidence_required: true
  - id: release.cycle.execute
    kind: external_governed_mutation
    permission: release:execute
    confirmation: explicit
    idempotency: required
    side_effects: [publish, deploy, verify, journal]
    evidence_required: true
