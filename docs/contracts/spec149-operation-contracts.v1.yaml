  - id: workset.seal.preview
    kind: preview
    permission: workset:propose
    confirmation: none
    idempotency: required
    side_effects: [read_provider, compute_digest, compute_preview]
    evidence_required: false
  - id: workset.seal.commit
    kind: mutation
    permission: workset:seal
    confirmation: explicit
    idempotency: required
    side_effects: [acquire_lease, append_event, freeze_digest]
    evidence_required: true
  - id: workset.reopen.preview
    kind: preview
    permission: workset:propose
    confirmation: none
    idempotency: required
    side_effects: [read_state, compute_candidate_invalidation, compute_preview]
    evidence_required: false
  - id: workset.reopen.commit
    kind: mutation
    permission: workset:seal
    confirmation: explicit
    idempotency: required
    side_effects: [invalidate_candidate, append_event, create_revision]
