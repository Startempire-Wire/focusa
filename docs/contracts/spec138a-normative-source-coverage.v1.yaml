      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 133,
      "section": "3.1 Spec 137 remains temporal authority",
      "text": "Spec 138 MUST NOT create a competing clock or deadline authority.",
      "normative_tokens": [
        "MUST NOT"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0139-04cba3437d4b",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 139,
      "section": "3.2 Ontology remains semantic identity authority",
      "text": "Spec 138 records ontology references; it MUST NOT invent parallel object identity.",
      "normative_tokens": [
        "MUST NOT"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0165-3ee26da205b5",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 165,
      "section": "4. Core laws",
      "text": "1. **Prediction commitment is immutable.** Later evidence creates new outcome, evaluation, revision, or supersession records.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0166-0b531c35d559",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 166,
      "section": "4. Core laws",
      "text": "2. **Question and answer are distinct.** A forecast cannot be interpreted without a target and resolution contract.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0167-8c99044e4ded",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 167,
      "section": "4. Core laws",
      "text": "3. **Probability is not evidence confidence.** Forecast probability, source reliability, model confidence, and resolution confidence are separate.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0168-f21797eb4504",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 168,
      "section": "4. Core laws",
      "text": "4. **Information sets are frozen.** Later information never retroactively enters the forecast's original information set.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0169-325bdf898d5d",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 169,
      "section": "4. Core laws",
      "text": "5. **Outcome resolution precedes scoring.** A score cannot define the outcome.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0170-5f03af0ceb95",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 170,
      "section": "4. Core laws",
      "text": "6. **Resolution authority is explicit.** Outcome claims are not canonical merely because a caller submits them.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0171-d013da67cd65",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 171,
      "section": "4. Core laws",
      "text": "7. **Scoring policy freezes before resolution.** Post-outcome scorer selection is prohibited except through an explicit correction record.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0172-fdd51706d0ad",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 172,
      "section": "4. Core laws",
      "text": "8. **Canonical scores identify scorer and version.** Anonymous floating-point scores are advisory only.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0173-0b8a3ab4df8e",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 173,
      "section": "4. Core laws",
      "text": "9. **Proper scoring is required for probabilistic forecasts.** Accuracy alone is insufficient.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0174-6a095bae6206",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 174,
      "section": "4. Core laws",
      "text": "10. **Abstention is a valid forecast action.** The system must not force unsupported precision.",
      "normative_tokens": [
        "MUST NOT"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0175-5a545b8d522f",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 175,
      "section": "4. Core laws",
      "text": "11. **Unknown remains unknown.** Missingness or conflict cannot be silently converted into neutral or positive evidence.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0176-913cd385c5a9",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 176,
      "section": "4. Core laws",
      "text": "12. **Dependent evidence is not independent confirmation.** Triangulation must account for shared upstream sources.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0177-6c22844e209e",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 177,
      "section": "4. Core laws",
      "text": "13. **Weights are versioned claims.** Every weight has origin, scope, evidence, and applicability.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0178-3914c07dfdf0",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 178,
      "section": "4. Core laws",
      "text": "14. **Composite scores expose contributions.** A single opaque total cannot be canonical without decomposition.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0179-2905b1141b5e",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 179,
      "section": "4. Core laws",
      "text": "15. **Uncertainty is decomposed.** One confidence scalar cannot represent all uncertainty.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0180-dd68d7c20a9f",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 180,
      "section": "4. Core laws",
      "text": "16. **Scenario probabilities must be coherent.** Branches, assumptions, and residual uncertainty are explicit.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0181-6fbeedfab431",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 181,
      "section": "4. Core laws",
      "text": "17. **Counterfactuals are labeled.** Simulated outcomes cannot masquerade as observations.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0182-bbca81cb7ceb",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 182,
      "section": "4. Core laws",
      "text": "18. **Reflection proposes; it does not promote.** LLM or heuristic reflection output is a candidate claim.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0183-e7a09211f612",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 183,
      "section": "4. Core laws",
      "text": "19. **Failure is learning evidence.** High-confidence misses and unexpected failures are first-class.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0184-b9ed500047c6",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 184,
      "section": "4. Core laws",
      "text": "20. **Success is not automatically reusable.** A correct result may be luck, leakage, or regime-specific.",
      "normative_tokens": [
        "MAY"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0185-18c75df84c2c",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 185,
      "section": "4. Core laws",
      "text": "21. **Learning requires structured evaluation.** Metric names without values and evidence cannot prove improvement.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0186-0280df06c11b",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 186,
      "section": "4. Core laws",
      "text": "22. **Promotion requires applicability and expiry.** No learning is universally valid by default.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0187-6bffe5c4f5d0",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 187,
      "section": "4. Core laws",
      "text": "23. **Transfer is predicted and evaluated.** Reuse in a new context creates a transfer forecast and outcome.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0188-2b6942714081",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 188,
      "section": "4. Core laws",
      "text": "24. **Negative transfer is retained.** Failed reuse cannot be hidden by aggregate success.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0189-e45cacced027",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 189,
      "section": "4. Core laws",
      "text": "25. **Learning can conflict.** Competing lessons remain visible until resolved or scoped.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0190-210b05cffcff",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 190,
      "section": "4. Core laws",
      "text": "26. **Learning can be superseded, revoked, or rolled back.** Promotion is not permanent truth.",
      "normative_tokens": [],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S138-C-0191-b37dbbd62c96",
      "source_path": "docs/138-focusa-prediction-outcome-calibration-metacognitive-learning-transfer-and-epistemic-governance-spec.md",
      "source_line": 191,
      "section": "4. Core laws",
      "text": "27. **Long-term memory preserves provenance.** Consolidation does not erase source records.",
      "normative_tokens": [],
