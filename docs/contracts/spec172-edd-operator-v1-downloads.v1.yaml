# Spec 172.02.03 — dedicated EDD Operator v1 Downloads and price records.
#
# These are the server-owned EDD Downloads and Software Licensing price records for the
# three dedicated Spec 172 paid offers: Focusa Operator Lifetime v1, UIAI Engine Operator
# Lifetime v1, and the exact-union Bundle v1. Every record is derived from, and must
# exactly match, the canonical Spec 152E product registry offer with the same public code
# (docs/contracts/spec152e-edd-product-registry.v1.yaml). Prices are recorded in USD minor
# units (69700, 69700, 125460) with the human USD string; lifetime duration with
# whole-order 30-day refund metadata; one operator seat; three shared nodes
# (operator_shared_v1). Checkout stays disabled until validation passes
# (checkout_enabled: false, sale_status: approved_not_yet_enabled, download status: draft).
# Legacy WPUIAI downloads and Download 453 are never referenced and can never grant these
# License Types. No caller-controlled download, price, License Type, family, feature,
# limit, node, or commercial right is accepted.
schema: focusa.spec172.edd_operator_v1_downloads.v1
version: 1
owner: WPUIAI/wpuiai
registry_schema: focusa.spec152e.edd_product_registry.v1
provisioner: wpuiai.spec172.edd_operator_v1_provisioner
authority:
  checkout_enabled: false
  checkout_block_reason: awaiting_validation_pass
  sale_status: approved_not_yet_enabled
  caller_controls_forbidden: [edd_download_id, edd_price_id, amount_minor, price, price_usd, currency, tier, product, product_code, products, license_type, license_type_ref, capability_family, families, features, limits, node_limit, node_set, operator_seats, sale_status, refund_policy, refund_days, license_duration, license_length, license_unit, activation_limit, evaluation_duration, checkout_enabled, future_products_included, future_license_types_included]
  legacy_download_ids: [16, 17, 21, 22, 23, 24, 25, 66, 452, 453, 454, 455, 456, 457]
  forbidden_implicit_download: 453
