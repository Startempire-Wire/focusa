  delivery_contract: docs/135-series-current-manifest.md
  parent_spec: docs/135-focusa-professional-workspaces-and-crist-project-genesis-master-spec.md
  cross_gui_interlock:
    document: docs/current/SPEC135_UIAI_COCKPIT_MISSION_CANVAS_INTERLOCK_2026-08-01.md
    contract: docs/contracts/spec135-uiai-cockpit-mission-canvas-interlock.v1.yaml
    applies_to:
      - uiai_engine_cockpit_hosting
