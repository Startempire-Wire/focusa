      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 936,
      "section": "15. Verifier cognition lineages",
      "classification": "normative_keyword",
      "text": "Disclosure modes are `blind_behavioral`, `gray_box`, and `white_box`. Hidden-test policy MUST preserve enough reproduction information for fair repair while preventing overfitting.",
      "text_hash": "1667a12a66d1ff17c2a9ed02e3467f9469c089ede0bbea32bebdbddb78e54e2d",
      "coverage_status": "mapped"
