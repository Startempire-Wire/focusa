      "source_atom_id": "S144-A-0643-05f199328a1d",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 643,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "10. **Omission firewall:** requirement IDs, active applicability, task/proof ownership, no orphaned clauses, no forbidden placeholder completion.",
      "text_hash": "9553e3f29ee4852d5ede7387b06f895529266cabcf5ff1694401951ff537f367",
      "coverage_status": "mapped"
    },
    {
