      "classification": "contextual",
      "text": "A new ontology module is mandatory when omitting a unique entity, relation, action/precondition, Evidence standard, lifecycle, identity rule, temporal semantic, prediction target/outcome/scorer/regime, or authority boundary could cause wrong action, wrong Evidence trust, identity/completion error, missed deadline, incorrect resolution, authority violation, or invalid learning transfer.",
      "text_hash": "0640b1c614b122748bfe4405bf11510dcbb4bf66f2c02ba3265023626f90d295",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1261-565f6a35c91f",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1261,
      "section": "22. Vertical Intelligence Bundles",
      "classification": "normative_keyword",
      "text": "One shared Verification Fabric Ontology MUST define verification domains, dimensions, obligations, requirements, capabilities, assignments, plans/DAGs, snapshots, findings, dispositions, coverage, independence, reroutes, and settlement evaluation. Verticals extend it and MUST NOT duplicate shared primitives.",
      "text_hash": "b893eb04195c4b7bdf20cdaa1dcfdcb7a88058a474312ad079a624350f1abe97",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1263-1f230dbf9b32",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1263,
      "section": "22. Vertical Intelligence Bundles",
      "classification": "normative_keyword",
      "text": "Projects may activate multiple bundles. Every active pack’s mandatory obligations survive composition. No workspace selection may suppress them. Pack conflicts MUST block activation or affected execution and produce explicit migration/governance/operator review.",
      "text_hash": "facd44e1abf47bbd6ac03717fdb34c7eada24f5e44b4dca1ed53383bd4b3edc0",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1265-8fb4a037f4dc",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1265,
      "section": "22. Vertical Intelligence Bundles",
      "classification": "normative_keyword",
      "text": "Vertical activation MUST validate identity/version/trusted origin, resolve dependencies, compile all contracts, validate OWL and SHACL, register obligations/capabilities/reflexes, declare Spec 137/138 applicability, preview migration, run conformance/golden scenarios, receive operator/project approval, resolve the project registry, and generate bounded projections.",
      "text_hash": "233dc7033d94d675d88de8fb18db2c922a5aa5abda1638b970c85649f3abfce9",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1267-b3579fb9e18d",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1267,
      "section": "22. Vertical Intelligence Bundles",
      "classification": "normative_keyword",
      "text": "A missing required pack produces a truthful blocked or degraded workspace, but the Vertical remains incomplete and cannot claim operational support.",
      "text_hash": "5701c58b17cc55ef35759764712b72977a985042a1371029f0b8c355bd846c3f",
      "coverage_status": "mapped"
