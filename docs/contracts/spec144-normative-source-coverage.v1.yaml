      "source_line": 1010,
      "section": "17. Findings, verdicts, and verification of the Verifier",
      "classification": "normative_keyword",
      "text": "A Verifier is not presumed correct. Every finding MUST pass structural, semantic, scope, Evidence, freshness, and eligibility validation.",
      "text_hash": "af33e3cb2a336a63b5531e6fcee1c64d43caa431e1153e1f81bc8714a3aded62",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1012-e4aba7bf7a90",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1012,
      "section": "17. Findings, verdicts, and verification of the Verifier",
      "classification": "normative_keyword",
      "text": "A finding may be rejected or narrowed only through a recorded disposition supported by Evidence, including wrong target, outside scope, missing Evidence, failed reproduction, stale state, preference mistaken for requirement, spec contradiction, invalid test, graph nonconformance, or disproving counterevidence.",
      "text_hash": "23521d0d3e25859390c7b535f09d418ccd2e1d0942e46072de044baaa617d389",
      "coverage_status": "mapped"
    },
    {
