      "source_line": 1516,
      "section": "25. API, events, persistence, and clients",
      "classification": "normative_keyword",
      "text": "Clients MUST display truthful states, including `schema_only`, `pack_missing`, `migration_required`, `verification_required`, `verification_blocked`, `operator_required`, `unsupported_future_definition`, `writer_blocked`, `degraded`, `stale`, `conflicted`, and `quarantined`.",
      "text_hash": "4f25e60d78a45d59286a9300c34e780ec867f4cc018ce7fa12fd45a0ad3d1f78",
      "coverage_status": "mapped"
    },
