      "source_line": 645,
      "section": "10. Mandatory SHACL profile families",
      "classification": "normative_keyword",
      "text": "A required validation MUST emit a durable `SemanticValidationReceipt`. Strings such as `passed`, `accepted`, `verified`, `approved`, or `success` are invalid substitutes.",
      "text_hash": "8b51c154d7efc4bbbd49726b3c86d3f077b30cd388004e95b9a37a10b367cc24",
      "coverage_status": "mapped"
