      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1759,
      "section": "Core Verification Pack",
      "classification": "contextual",
      "text": "The core pack emits obligations for scope and authority, Work Contract completeness, requirement coverage, immutable snapshot identity, Evidence sufficiency and freshness, unresolved contradiction, final verified-snapshot equality, Receipt readiness, and reducer-only settlement.",
      "text_hash": "6c36fa139e687496a405fc72e6a918f20011b0f2710635f77a69d81a2b163c8f",
      "coverage_status": "mapped"
    },
    {
