      "source_line": 1117,
      "section": "19. Build↔Verify lifecycle and rerouting",
      "text": "Deep verification MUST run at every policy-activated semantic checkpoint, including consequential plan formation, risky mutation, major revision, unexpected deterministic failure, material Evidence change, Workpoint satisfaction, closure, release/migration/deployment/irreversible action, material operator steering, and completion claim.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1119-69c65a627fe9",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1119,
      "section": "19. Build↔Verify lifecycle and rerouting",
      "text": "Rerouting MUST occur when new semantic impact, critical findings, environment failure, verifier unavailability, tool mismatch, unexpected artifact, scope/authority mismatch, disagreement, insufficient Evidence, repeated unsupported findings, steering, snapshot supersession, or pack/policy revision changes the obligation graph.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1121-a12c59381d27",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1121,
      "section": "19. Build↔Verify lifecycle and rerouting",
      "text": "Every reroute MUST preserve prior plan, trigger Evidence, assignment changes, unresolved obligations, reason/policy, cost/latency impact, validation, and supersession. Mandatory obligations cannot disappear.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1123-60f2a990850d",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1123,
      "section": "19. Build↔Verify lifecycle and rerouting",
      "text": "The loop MUST stop or escalate on repeated dispute without Evidence delta, repeated repair failure, repeated unsupported findings, hidden-test overfitting, budget/deadline conflict requiring operator choice, or governing-spec conflict. `Inconclusive` is a valid result and cannot be converted to pass.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1131-c49c280bbd25",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1131,
      "section": "20. Spec 137 Temporal Authority integration",
      "text": "The Router MUST support temporal obligations for trusted-clock integrity, source independence, calendar authority, civil-time resolution, deadline completeness, readiness-margin grounding, Evidence freshness, critical-path grounding, boundary uncertainty, breach classification, remaining opportunity, and settlement time.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1133-8f7059243015",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1133,
      "section": "20. Spec 137 Temporal Authority integration",
      "text": "Every high-consequence Vertical MUST declare a `DomainTemporalApplicabilityProfile` binding object/action classes, clock domains, precision, calendar sources, deadline semantics, completion effects, freshness, latency, uncertainty, breach policy, required obligations, verifier capabilities, Evidence, fail mode, and version. Verticals extend Spec 137 and MUST NOT fork temporal authority.",
      "normative_tokens": [
        "MUST",
        "MUST NOT",
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1136-fbcb8d194eb8",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
