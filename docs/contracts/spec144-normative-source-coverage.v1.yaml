      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1510,
      "section": "25. API, events, persistence, and clients",
      "classification": "normative_keyword",
      "text": "Use existing SQLite event/snapshot and Reference Store architecture. Replay MUST reconstruct every contract, attempt, snapshot, requirement/obligation, plan, assignment/context, finding/response/disposition, validation, reroute, settlement, and Receipt.",
      "text_hash": "e6c0b32df639c29c55d036878d35f8b7300cc644ce3f9be371669e4f447ea894",
      "coverage_status": "mapped"
    },
    {
