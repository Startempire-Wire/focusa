      "text": "Temporal reflexes MUST be registered when their activation conditions exist, including authority freshness, civil-time resolution, unsupported precision rejection, calendar-version checks, deadline recomputation, unverified deadline blocking, overdue opportunity validation, overdue focus, and specialist escalation.",
