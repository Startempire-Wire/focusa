      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 934,
      "section": "15. Verifier cognition lineages",
      "classification": "normative_keyword",
      "text": "Continuation defaults to `carry_open_findings_only`. Any broader lineage reuse MUST be recorded and reflected in the independence profile.",
      "text_hash": "fa06dbcac810ececfbba601f6b9a01e51119fdbdc08608cdd7859cc8c21250f7",
      "coverage_status": "mapped"
    },
    {
