      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1532,
      "section": "27. Performance and resource laws",
      "classification": "normative_keyword",
      "text": "Whole-world reasoning MUST NOT run synchronously per turn. Bundles MUST be content-hash cached. Candidate validation MUST use bounded deltas and affected neighborhoods. Traversals and validators MUST have explicit bounds. Large graphs/transcripts remain behind handles.",
      "text_hash": "8d2306d71f2c19fe8332bd25a6e2cc655f0ed3beac93e82d9e7b0f08aef3e3f9",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1534-8ae3655f8680",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1534,
      "section": "27. Performance and resource laws",
      "classification": "normative_keyword",
      "text": "Low-memory mode may reduce explanation detail but cannot remove authority, hashes, violations, critical findings, requirement IDs, or recovery guidance. Validation timeout is not conformance. Required timeout blocks or invokes an explicitly authorized equivalent-or-stronger fallback. A weaker fallback cannot satisfy the obligation.",
      "text_hash": "22c532dab56f526f3a41fce6fd8a6afe38a2bc85c0734b30217a1aae16af533f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1536-ced3601d8935",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1536,
      "section": "27. Performance and resource laws",
      "classification": "normative_keyword",
      "text": "Optimization MUST prefer deterministic proof when stronger and cheaper but MUST NOT trade away mandatory coverage, Evidence, independence, client parity, migration, replay, or closure proof.",
      "text_hash": "28fe9088474f435791bfb3783ab7da4de817bfc21c58203d12323fe7c568c9f5",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1538-1cd6e9919ec8",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1538,
      "section": "27. Performance and resource laws",
      "classification": "normative_keyword",
      "text": "Resource or deadline pressure cannot make accepted work disappear. It may trigger operator prioritization, a blocker, or an amendment request; until resolved, requirements remain open.",
      "text_hash": "45820ac549b04f2daac1b6fed8d45bc42ff85b6a2453d8917ef0bc177bf861ca",
      "coverage_status": "mapped"
    },
