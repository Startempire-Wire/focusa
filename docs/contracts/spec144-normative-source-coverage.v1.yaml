      "text": "Required metrics include task success, criterion and requirement coverage, defect escape, verifier false positives/negatives, critical precision, reproduction, repair, rounds, oscillation, anchoring, Evidence linkage, unsupported objections, overfitting, routing eligibility, unnecessary verification, temporal errors, unsupported estimate rejection, information leakage, source dependence, resolution/scoring errors, learning-promotion reversal, negative transfer, resource cost, operator interventions, and post-settlement regressions.",
