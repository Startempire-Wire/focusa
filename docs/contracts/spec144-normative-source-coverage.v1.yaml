      "section": "Core Verification Pack",
      "classification": "section_heading",
      "text": "### Core Verification Pack",
      "text_hash": "57ba43044ede7ad9f04231ac38a8be6e1ba913d7655fd2ae17fc7feb12d1c1be",
      "coverage_status": "mapped"
    },
    {
