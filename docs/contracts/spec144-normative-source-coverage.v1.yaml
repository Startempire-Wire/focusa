      "text": "Settlement MUST fail closed on uncovered mandatory obligations, unavailable required verifiers, open critical findings, insufficient/stale Evidence, snapshot mismatch, inadequate independence, unresolved pack conflict, unavailable temporal/outcome authority, incomplete validation, missing approval, unknown impact, missing migration, or incomplete client parity.",
