      "source_line": 1074,
      "section": "18. Independence and assurance",
      "text": "No majority vote may override an obligation-specific veto or a valid critical finding. Settlement uses coverage, severity, Evidence, reproduction, eligibility, independence, calibration, contradiction, veto/escalation policy, and SHACL conformance.",
      "normative_tokens": [
        "MAY"
