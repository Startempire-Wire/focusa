      "source_line": 1016,
      "section": "17. Findings, verdicts, and verification of the Verifier",
      "classification": "normative_keyword",
      "text": "A positive verdict is invalid if any required criterion was uninspected, Evidence is unknown/insufficient, a required provider failed, an open critical finding exists, snapshot identity is stale, independence is insufficient, or finding/verdict graphs fail conformance.",
      "text_hash": "e9e3a5997f66f2d9cf76ad2e1819a1f6bb12891d147ec8e833e7d00cb0785a83",
      "coverage_status": "mapped"
    },
