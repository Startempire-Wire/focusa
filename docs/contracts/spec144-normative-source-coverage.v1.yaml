      "text": "Whole-world reasoning MUST NOT run synchronously per turn. Bundles MUST be content-hash cached. Candidate validation MUST use bounded deltas and affected neighborhoods. Traversals and validators MUST have explicit bounds. Large graphs/transcripts remain behind handles.",
