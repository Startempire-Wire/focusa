      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 928,
      "section": "15. Verifier cognition lineages",
      "classification": "normative_keyword",
      "text": "Each assignment MUST receive an independently generated context containing only its obligations, criteria, immutable snapshot, applicable semantic modules/shapes, threat/risk model, approved tools, workspace, and disclosure policy.",
      "text_hash": "101c7dbc16895d2498a54fa5664a3b6f43b8153bfeb9aeb0142307715e271b1f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0930-f880ef4b11d4",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 930,
      "section": "15. Verifier cognition lineages",
      "classification": "normative_keyword",
      "text": "By default, Verifiers MUST NOT receive Builder chain-of-thought, full Builder transcript, Builder confidence rhetoric, irrelevant attempts, mutable source state, or material outside scope.",
      "text_hash": "fdcfc0eb6adc8555e611ad63f993d5cfce4f0bcabfe86df38fba91f6f9dda5a7",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0932-0569ccf3c837",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 932,
      "section": "15. Verifier cognition lineages",
      "classification": "normative_keyword",
      "text": "A Verifier MUST NOT acquire the Builder project writer lease. Source access is read-only or immutable. A writable verification sandbox is permitted. Repairs are proposals or artifacts, never direct project mutation.",
      "text_hash": "52afdf14def7e2f6d303f11707f711bbcb9ab4841f25c68ddfc07e127a132b5e",
      "coverage_status": "mapped"
    },
    {
