      "section": "10. Mandatory SHACL profile families",
      "classification": "section_heading",
      "text": "## 10. Mandatory SHACL profile families",
      "text_hash": "446ef9c8f1a2cd6d6064ea9f9adc1c4648d9bcd23ee1092af799302d368d8a2f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0632-b49a7ec59c1a",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 632,
      "section": "10. Mandatory SHACL profile families",
      "classification": "normative_keyword",
      "text": "Focusa MUST implement purpose-specific profiles when their requirements are activated:",
      "text_hash": "e83389c7f8ee423fa3b95544882594db870f6983240901729445209763d9720a",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0634-1919f7bc6527",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 634,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "1. **Intake:** identity, namespace, datatype, bounds, prohibited properties, provenance, scope, compatibility.",
      "text_hash": "416c35037e049c3165dc74ed76af77de228e7e3e254edf15716b5da55b882c9f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0635-4f6054ceaa80",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 635,
      "section": "10. Mandatory SHACL profile families",
      "classification": "normative_keyword",
      "text": "2. **Promotion:** required properties/links, cardinality, lifecycle, Evidence, freshness, identity resolution, contradictions, pack compatibility, candidate/canonical separation.",
      "text_hash": "7828e0a419b07a59c06e924d186c108cd4b2a3d39da0edef465a83825f423a02",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0636-c75ee69da7b9",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 636,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "3. **Action preflight:** actor, role, permission, scope, target, preconditions, blockers, reversibility, idempotency, side effects, timeout, retry, Evidence, tool mapping.",
      "text_hash": "35d6698d1919d0e6079dc908adf946fa307b51030a57652d5835105872bd3611",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0637-1a6b151b1c19",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 637,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "4. **Verification plan:** obligations, eligibility, independence, DAG dependencies, snapshot binding, coverage, assurance, tools, data access.",
      "text_hash": "7538442ace50e4f7946ca892adbb0ca73ce01c978c777261f75161368b8c9036",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0638-0e0250ebe587",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 638,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "5. **Finding/verdict:** exact targets, Evidence, method, severity, freshness, scope, reproduction, valid dispositions.",
      "text_hash": "33eb801acebf02280ee063773fabf454d7a8f11c30895a2e86b170579c34cdda",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0639-48728088532c",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 639,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "6. **Settlement:** mandatory coverage, snapshot identity, Evidence sufficiency, no open critical findings, approval, Receipt readiness, reducer-only transition.",
      "text_hash": "e321db29b4cfb9391f134ef236a3e6df3b99c9b75978a5f452e0e463ec28b9a9",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0640-d007f1058cda",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 640,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "7. **Domain pack:** manifest, namespace, interfaces, OWL profile, shape integrity, lifecycle, migration, trusted origin, bounds.",
      "text_hash": "f741a11ff4f8d96945e4cbfd086a41ac78955aef602d9252a7f1d6875bf05568",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0641-e525a4ac0190",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 641,
      "section": "10. Mandatory SHACL profile families",
      "classification": "governed_list_item",
      "text": "8. **Migration/replay:** historical compatibility, graph identity, Evidence preservation, unknown semantics, V1 projection equivalence, post-migration conformance.",
      "text_hash": "a076297521781aad8954d38deff5de87fa2c6d5f12b0854aabd3f512c98b978f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-0642-e92b7f6228bd",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 642,
      "section": "10. Mandatory SHACL profile families",
      "classification": "normative_keyword",
      "text": "9. **Vertical bundle:** required pack presence, overlay compatibility, reflex validity, temporal/epistemic applicability, client projection completeness.",
      "text_hash": "bd120a0a8fe2e3526ddc6a721123af36e74e81701ff5b3dadc7defe4fbb19380",
      "coverage_status": "mapped"
    },
