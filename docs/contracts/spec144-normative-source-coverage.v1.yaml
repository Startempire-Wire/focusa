      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1512,
      "section": "25. API, events, persistence, and clients",
      "classification": "contextual",
      "text": "Legacy bools and verdict strings remain readable only as `legacy_advisory_verdict` or `legacy_assumed_verification`; they cannot satisfy strict independent verification.",
      "text_hash": "2db80aa02a56fb8c46bc16071303d4766481107220632b5ad55a96c87cffc3e8",
      "coverage_status": "mapped"
    },
    {
