      "section": "25. API, events, persistence, and clients",
      "classification": "normative_keyword",
      "text": "Every event MUST carry applicable scope, identity, contract, snapshot, registry, schema, requirement, and correlation references.",
      "text_hash": "2e5d70d24c58155fd80f9f05f29e1d042155cd45f3fd8fd6e0d60b5a2a94dad9",
      "coverage_status": "mapped"
