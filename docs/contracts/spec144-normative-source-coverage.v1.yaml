      "section": "15. Verifier cognition lineages",
      "classification": "section_heading",
      "text": "## 15. Verifier cognition lineages",
      "text_hash": "cf6dfab66f00d0f4da4940f85ae15dc6b326e10566a80f4d3577affc1a5c7110",
      "coverage_status": "mapped"
