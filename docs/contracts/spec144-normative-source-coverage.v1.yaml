      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 734,
      "section": "12. Builder cognition lineage",
      "classification": "normative_keyword",
      "text": "Every `BuildAttempt` MUST bind its source snapshot, result snapshot, changed semantic/artifact refs, claims, Evidence, tests, known blockers, session/run identities, and status.",
