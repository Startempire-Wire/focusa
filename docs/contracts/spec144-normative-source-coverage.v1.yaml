      "source_line": 1070,
      "section": "18. Independence and assurance",
      "classification": "contextual",
      "text": "- **Tier 4:** operator or external authority for judgmental, disputed, regulated, legal, safety-critical, or unresolved cases.",
      "text_hash": "2a971c5e77c6d43af96ee79d8af2157699bd5e47da35de4971ed4e059e1a93a9",
      "coverage_status": "mapped"
