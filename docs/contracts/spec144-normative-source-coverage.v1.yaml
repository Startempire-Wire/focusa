      "source_line": 1069,
      "section": "18. Independence and assurance",
      "classification": "contextual",
      "text": "- **Tier 3:** multi-aspect deterministic and specialist verification for security, migration, compliance, release, destructive operations, high-consequence predictions, temporal commitments, and public proof.",
      "text_hash": "f21210880c92c4cda06d8eb2fc2d6527b82ca649b18c8415988e22a740a79fe3",
      "coverage_status": "mapped"
    },
