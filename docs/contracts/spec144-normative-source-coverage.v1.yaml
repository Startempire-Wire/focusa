      "source_line": 1520,
      "section": "26. Security, privacy, and identity",
      "classification": "section_heading",
      "text": "## 26. Security, privacy, and identity",
      "text_hash": "1ad75108c649d317b2b6506db770d7977ebfe60dd17c0cbc37a31f31d5832dd4",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1522-7be1b6742e34",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1522,
      "section": "26. Security, privacy, and identity",
      "classification": "contextual",
      "text": "Mandatory controls include trusted namespaces/origins, governed signatures, no hot remote imports, no arbitrary untrusted SHACL-SPARQL in the initial profile, query/node/edge/depth/time/memory/result bounds, recursive-shape and reasoner-DoS defense, ontology/source/prompt poisoning tests, no Verifier writer lease, project/continuity isolation, IRI collision prevention, Evidence access control, data-class-aware eligibility, redaction-aware export, tamper-evident receipts, identity-merge escalation, and secret exclusion.",
      "text_hash": "d2a47c6dc8954a3c1b2947f92945b9adebb0abc671fcec21bdf456faabf40ef4",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1524-9867b72cb5fe",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1524,
      "section": "26. Security, privacy, and identity",
      "classification": "normative_keyword",
      "text": "An agent MUST NOT author canonical `owl:sameAs`. Similarity creates an identity-resolution candidate. Strict equivalence requires governed Evidence and identity authority.",
      "text_hash": "79dc86e4dac2163845decb584e5a0f8f867a5bbb7e7abe1cf7d2cc9357843665",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1526-edb04cec8961",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1526,
      "section": "26. Security, privacy, and identity",
      "classification": "normative_keyword",
      "text": "Security, privacy, privilege, regulated, legal, and high-consequence obligations cannot be downgraded or marked not applicable because the required verifier/tool is unavailable.",
      "text_hash": "e230c63209209f7b39243b5aff458925944bda2d812c0d153642af5f68776cfb",
      "coverage_status": "mapped"
    },
    {
