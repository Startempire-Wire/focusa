      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1763-6d62b0bd8f39",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1763,
      "section": "Obligation-compilation proof",
      "classification": "normative_keyword",
      "text": "The obligation compiler MUST emit an `ObligationCompilationReceipt` binding compiler identity/version, complete input hashes, requirement-set hash, registry and pack hashes, OWL/SHACL trigger hashes, semantic delta, emitted/deduplicated/rejected obligations, unknown-impact refs, uncovered requirements, independent coverage-challenger result, validation, and Receipt hash.",
      "text_hash": "dc18e927a9719aae888ddf1c862cfbba29bd439fd0d557722ac092222601f66a",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1765-d4962b518779",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1765,
      "section": "Obligation-compilation proof",
      "classification": "normative_keyword",
      "text": "A valid Verification Plan cannot prove that the obligation graph was complete unless its compilation receipt validates. The coverage challenger MUST be independent from the compiler policy path at assurance tiers requiring independent verification.",
      "text_hash": "dcf3ec9162fda34845c4c0319585f17d227350dede49fc8a22a8aae42fa9df78",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1767-34a0b7484373",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1767,
      "section": "Spec 139 execution-placement binding",
      "classification": "section_heading",
      "text": "### Spec 139 execution-placement binding",
      "text_hash": "89407777af0a642fab4b00ca403ea7adbdff0c73b7ad07d82f993464b9595c4f",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1769-5ab469f613b6",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1769,
      "section": "Spec 139 execution-placement binding",
      "classification": "normative_keyword",
      "text": "Every Builder, Verifier, deterministic validator, test executor, runtime probe, browser evaluator, arbiter, and external-authority assignment MUST bind a `VerificationExecutionBinding` containing environment identity, placement decision, node, daemon and daemon boot, repository, workspace, worktree, resource claims, deduplication key, lease, fencing token, and placement-policy version.",
      "text_hash": "3e6858455391099a9f7e7b7c0b71dd33ebf48b65886958db7fcd5930c0e9326d",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1771-647ffef25d69",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1771,
      "section": "Spec 139 execution-placement binding",
      "classification": "normative_keyword",
      "text": "Unresolved or stale placement blocks execution. Shared environment, toolchain, cache, checkout, source, test-generator, or infrastructure dependencies MUST enter the independence and common-mode profile. Two assignments do not become independent merely because they use different models.",
      "text_hash": "dcb3208e104ec5f480af6f00ba3d670577220a927cb00fc34a2672ace30d258a",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1773-46f79f0dbe99",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1773,
      "section": "Reproducible cognition and common-mode dependencies",
      "classification": "section_heading",
      "text": "### Reproducible cognition and common-mode dependencies",
      "text_hash": "abe0b8866ff1de5b84ee60b1f627e4ea619517e2197e7397d43598a43f3ef193",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1775-95f0de0d3db7",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1775,
      "section": "Reproducible cognition and common-mode dependencies",
      "classification": "normative_keyword",
      "text": "Every Builder, Verifier, Router, coverage challenger, and arbiter run MUST bind a `CognitiveExecutionIdentity` containing actor/run/session identity, Runtime Constitution hash, prompt-assembly hash, role/capability/permission versions, skill-bundle hashes, tool-registry and tool-policy versions, harness adapter, model/provider/family/version and inference parameters, retrieval/source-set identity, test-generator identity, Spec 139 environment binding, context packet hash, and code/registry/pack revisions.",
      "text_hash": "8f821e977b2a2f3dfb13cf6a70cd3669e7c272de24ace38d15ca2a0200100dee",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1777-3166d6d87ec3",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1777,
      "section": "Reproducible cognition and common-mode dependencies",
      "classification": "normative_keyword",
      "text": "A `CommonModeDependencyProfile` MUST represent shared rubric, prompt source, retrieval corpus, evidence provider, test generator, environment, checkout, cache, external authority, model family/provider, and infrastructure failure domains. Mandatory independence dimensions are fail-closed; a scalar score cannot override a failed dimension.",
      "text_hash": "c0b8d566cd0b1dd16b4e8ed7648c4167468b4a8af6d2edb61633060012294a3c",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1779-7ab32ac84863",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1779,
      "section": "Verification dispute and appeal integration",
      "classification": "section_heading",
      "text": "### Verification dispute and appeal integration",
      "text_hash": "d03f2ffc76d72eb550b7e198bef850d102de8ee2377e828bd021eba7767ae6a5",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1781-ab40bb1a6e88",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1781,
      "section": "Verification dispute and appeal integration",
      "classification": "normative_keyword",
      "text": "Focusa MUST reuse—not fork—PRE, Spec 120 operator gates, and Spec 136 settlement authority. Verification disputes use typed `VerificationConflict`, `VerificationAppeal`, `ArbiterEligibilityRecord`, `ConflictOfInterestRecord`, `ArbitrationAssignment`, and `ArbitrationDecision` records.",
      "text_hash": "7b52aa7c1c5f6d8e952fc12d31b458fc3434b30c523e74b9de5845a99f94c150",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1783-bcf17d6f5982",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1783,
      "section": "Verification dispute and appeal integration",
      "classification": "normative_keyword",
      "text": "Mechanically decidable conflicts route to a registered deterministic PRE resolver. Judgmental, disputed, regulated, or high-consequence conflicts route through an eligible independent arbiter and, where policy requires, an explicit Spec 120/operator gate. The Router that selected the original Verifier cannot silently select a friendly arbiter; arbiter eligibility and common-mode independence must validate first.",
      "text_hash": "ce94d6f6aae898af185e18ac1d1e5a2e73bd51335e796c2d4f1ca52a7ee7db58",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1785-801e0caac4eb",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1785,
      "section": "Post-settlement revalidation",
      "classification": "section_heading",
      "text": "### Post-settlement revalidation",
      "text_hash": "30eec6b9a7cd9c272393bc69d737e20d717cb7747c74c628265401e1efed5bac",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1787-7a723520d3a7",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1787,
      "section": "Post-settlement revalidation",
      "classification": "normative_keyword",
      "text": "Later evidence corruption, source dependence, security disclosure, external-authority revision, registry/pack revocation, material regression, or invalidated verifier capability MUST create a `SettlementRevalidationTrigger` and `SettlementValidityChallenge` through Spec 136.",
      "text_hash": "04562e935e24520c78b28489b3f38decd663a8434a766c62533667fc6d161167",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1789-4c6ef0870de3",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1789,
      "section": "Post-settlement revalidation",
      "classification": "normative_keyword",
      "text": "The reducer may append `settlement_upheld`, `settlement_corrected`, `settlement_superseded`, or `settlement_reopened` only through the governed revalidation path. Historical settlement and Receipt records remain immutable and linked to the correction. A stale or invalidated settlement cannot continue to support promoted learning or a current conformance claim.",
      "text_hash": "c86f325b8d127f0de2e9ac15caaf2e93253a97909e967264c3dcfafe67dbc411",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1791-129dc1eac48f",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1791,
