      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1158,
      "section": "20. Spec 137 Temporal Authority integration",
      "text": "Temporal reflexes MUST be registered when their activation conditions exist, including authority freshness, civil-time resolution, unsupported precision rejection, calendar-version checks, deadline recomputation, unverified deadline blocking, overdue opportunity validation, overdue focus, and specialist escalation.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1160-35e4c4062de6",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1160,
      "section": "20. Spec 137 Temporal Authority integration",
      "text": "A missing required temporal profile, stale calendar, unsupported precision, unresolved clock uncertainty, or unavailable temporal authority blocks affected verification and settlement. It cannot be marked `not applicable` merely because the Vertical omitted the profile.",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1166-47de94104376",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1166,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "The Router MUST support obligation-specific verification for information-set integrity, source authority/independence, leakage/contamination, forecast shape, uncertainty, scenario coherence, outcome resolution, scoring, calibration, decision value, causal claims, transfer applicability, and learning promotion.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1168-ab579505fe43",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1168,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "Required obligation vocabulary:",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1187-50ce1adbe6c3",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1187,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "Required capability vocabulary:",
      "normative_tokens": [
        "REQUIRED"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1206-8c7180243ab7",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1206,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "Calibration MUST be cohortable by verifier role/capability, obligation, strategy, model family, artifact, Vertical/domain pack, risk, assurance, and source-versus-transfer context.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1208-03b634d17e48",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1208,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "Learning-promotion portfolios MUST separately cover Evidence, outcome authority, experimental validity, confounders, controls, transfer, regression, applicability, expiry, rollback, conflict, security, and governance when activated. A fluent causal narrative cannot satisfy these obligations.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1210-9aa0af021581",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1210,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "When ground truth, samples, target definitions, source independence, resolution authority, or applicability are inadequate, the result MUST remain `unknown`, `insufficient_evidence`, `not_resolvable_yet`, `abstain`, `operator_judgment_required`, or `experimental_only`. More verification cannot manufacture certainty.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1212-19066f4154ef",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1212,
      "section": "21. Spec 138 Prediction and Epistemic Governance integration",
      "text": "Router and verifier-selection learning MUST use immutable champion/challenger governance, fixed replay/live-shadow evaluation, operator/governance promotion, and rollback. The Router cannot mutate its live canonical policy from its own outcomes.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
    {
      "clause_id": "S144-C-1218-7e9f126d845c",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1218,
      "section": "22. Vertical Intelligence Bundles",
      "text": "A Vertical MUST be added through a versioned `VerticalIntelligenceBundle`, never by forking Focusa, hard-coding routing, or treating a visual theme as semantic capability.",
      "normative_tokens": [
        "MUST"
      ],
      "mapping_status": "mapped_documentation_runtime_open"
    },
