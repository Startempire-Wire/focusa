      "source_line": 1411,
      "section": "24. Settlement protocol",
      "classification": "normative_keyword",
      "text": "`settled_partial` MUST identify unsatisfied requirement IDs and cannot close the WorkItem, parent specification, release, or conformance class whose target state requires them.",
      "text_hash": "498334db1253bc7da7840d3ea17e7483abec3c55c943e8b07bbef1a931458075",
      "coverage_status": "mapped"
    },
    {
