      "source_line": 1514,
      "section": "25. API, events, persistence, and clients",
      "classification": "normative_keyword",
      "text": "Unknown authoritative semantics block replay or mutation. Unknown non-authoritative material may be preserved with diagnostics but cannot influence action or settlement.",
      "text_hash": "da21c1b4240c56609d405d0f37b8f208c58e616be2581de46eb0415f125fba51",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1516-edcd9d61e15b",
