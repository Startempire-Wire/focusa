      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1415,
      "section": "24. Settlement protocol",
      "classification": "normative_keyword",
      "text": "No mandatory requirement may be waived by a runtime variance. Mandatory change requires a specification amendment. `SHOULD` variances remain visible, scoped, expiring, Receipt-backed, and nonconforming to classes requiring original behavior.",
