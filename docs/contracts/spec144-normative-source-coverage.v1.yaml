      "source_line": 922,
      "section": "14. Domain-Specific Verification Router",
      "text": "The Router may suppress only optional redundant checks after mandatory coverage is proven. It MUST NOT remove mandatory obligations, weaken assurance, alter criteria, grant permissions, waive independence, treat unavailability as pass, resolve critical disagreement, settle completion, or self-promote policy learning.",
