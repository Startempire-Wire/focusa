      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 728,
      "section": "12. Builder cognition lineage",
      "classification": "normative_keyword",
      "text": "The Builder may inspect authorized context, mutate only its leased workspace, use permitted tools, run tests, produce Evidence, submit typed claims, respond to findings, and request escalation.",
      "text_hash": "6de8a7a71105883a372c961759e16cae001af412864bd50b1b4a7b9424c779b0",
      "coverage_status": "mapped"
    },
    {
