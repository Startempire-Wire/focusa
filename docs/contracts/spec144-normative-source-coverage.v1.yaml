      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1068,
      "section": "18. Independence and assurance",
      "classification": "contextual",
      "text": "- **Tier 2:** cross-model verification for meaningful code, architecture, data, integration, specification, prediction, and temporal work.",
      "text_hash": "f088860f6bb1db4ea059df6b2245f84cefa974f49f6e02d0d8c5e223b920d441",
      "coverage_status": "mapped"
    },
