      "source_line": 1530,
      "section": "27. Performance and resource laws",
      "classification": "section_heading",
      "text": "## 27. Performance and resource laws",
      "text_hash": "66d6bcab7fec54ba5961c237176e4c22fc0e4afa3f6a577e7638a1fa355fdc6f",
      "coverage_status": "mapped"
