      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 730,
      "section": "12. Builder cognition lineage",
      "classification": "normative_keyword",
      "text": "The Builder MUST NOT alter frozen criteria, shapes, scoring, or policy; modify findings; inspect hidden verifier material outside disclosure policy; self-settle; self-authorize; or issue its own completion Receipt.",
      "text_hash": "a54eddfa2223cd501928d3b463d759225e476e246a6e52759f876171ad23784b",
      "coverage_status": "mapped"
    },
    {
