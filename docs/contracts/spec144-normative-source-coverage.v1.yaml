      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 732,
      "section": "12. Builder cognition lineage",
      "classification": "normative_keyword",
      "text": "The `BuilderContextPacket` MUST contain exact direction, identity, Workpoint revision, specifications, requirement IDs, constraints, blockers, risks, relevant ontology slice, accepted findings, authorized actions, workspace/lease, drift boundaries, and temporal/resource posture. It MUST exclude hidden tests, irrelevant verifier history, and settlement internals not needed for execution.",
      "text_hash": "e965fc82a4f2777d8238343f39d0d7102f3f185e1bade70eaafb2e88dc2395fa",
      "coverage_status": "mapped"
    },
