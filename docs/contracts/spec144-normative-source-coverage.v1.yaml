      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1127-527826eaa9d4",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1127,
      "section": "20. Spec 137 Temporal Authority integration",
      "classification": "section_heading",
      "text": "## 20. Spec 137 Temporal Authority integration",
      "text_hash": "282dd089f0c7f90cf528aec93777bc5613cb2576f979968fc76a89b3a1815e6c",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1129-21686b59254b",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1129,
      "section": "20. Spec 137 Temporal Authority integration",
      "classification": "contextual",
      "text": "Spec 144 improves effective temporal correctness by validating interpretation, applicability, Evidence, and domain policy. It does not improve physical clock, synchronization, provider timestamp, or network accuracy.",
      "text_hash": "64d7d7d8de8b3b894d93a65bc6712ed0857082b1e0285b819edd8930b1bdf97a",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1131-c49c280bbd25",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1131,
      "section": "20. Spec 137 Temporal Authority integration",
      "classification": "normative_keyword",
      "text": "The Router MUST support temporal obligations for trusted-clock integrity, source independence, calendar authority, civil-time resolution, deadline completeness, readiness-margin grounding, Evidence freshness, critical-path grounding, boundary uncertainty, breach classification, remaining opportunity, and settlement time.",
      "text_hash": "2fbb2f45d250d3ca58d02e0f935af401a58c83ab42aa9e1b0181809c325799db",
      "coverage_status": "mapped"
    },
    {
      "source_atom_id": "S144-A-1133-8f7059243015",
      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1133,
      "section": "20. Spec 137 Temporal Authority integration",
      "classification": "normative_keyword",
      "text": "Every high-consequence Vertical MUST declare a `DomainTemporalApplicabilityProfile` binding object/action classes, clock domains, precision, calendar sources, deadline semantics, completion effects, freshness, latency, uncertainty, breach policy, required obligations, verifier capabilities, Evidence, fail mode, and version. Verticals extend Spec 137 and MUST NOT fork temporal authority.",
      "text_hash": "a6435893d33e7b7de127d28ea0042884ea8da1a084b0495c61233f06d9bb4eb9",
      "coverage_status": "mapped"
    },
