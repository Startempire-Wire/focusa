      "source_line": 1066,
      "section": "18. Independence and assurance",
      "classification": "contextual",
      "text": "- **Tier 0:** deterministic conformance for harmless mechanically decidable work.",
      "text_hash": "3b5fc78ff68fa5fdfa6949d26cbb1501e82aeee6d91afd4ed75fd13e5b28c981",
