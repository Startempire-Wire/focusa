      "source_line": 1067,
      "section": "18. Independence and assurance",
      "classification": "contextual",
      "text": "- **Tier 1:** separate-context, no-writer verification for low-risk reversible work.",
      "text_hash": "0880d74587d8b4344f584601555efa13fc9b5a815f01d55868a8fa069a58d130",
      "coverage_status": "mapped"
    },
