      "source_line": 936,
      "section": "15. Verifier cognition lineages",
      "text": "Disclosure modes are `blind_behavioral`, `gray_box`, and `white_box`. Hidden-test policy MUST preserve enough reproduction information for fair repair while preventing overfitting.",
