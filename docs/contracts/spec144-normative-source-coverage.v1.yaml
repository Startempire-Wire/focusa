      "source_path": "docs/144-focusa-semantic-integrity-rdf-owl-shacl-build-verify-routing-and-vertical-intelligence-spec.md",
      "source_line": 1757,
      "section": "Core Verification Pack",
      "classification": "normative_keyword",
      "text": "Every Verification Plan MUST include the always-activated `focusa.verification.core@1` pack. Vertical and domain packs may add obligations but cannot replace, suppress, merge away, or downgrade this pack.",
      "text_hash": "58d5e93871fb391215978949130b83dc92a056ced0606b835b06c402a643dea6",
      "coverage_status": "mapped"
    },
    {
