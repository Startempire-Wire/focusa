[workspace]
resolver = "2"
members = [
    "crates/focusa-core",
    "crates/focusa-harness-adapters",
    "crates/focusa-session-runner",
    "crates/focusa-cli",
    "crates/focusa-api",
    "crates/focusa-license",
    "crates/focusa-tui",
    "crates/focusa-terminal-ui",
    "crates/focusa-bench",
    "crates/focusa-session-runner",
    "crates/agent-stateful-cognitive-runtime",
    "crates/letta-adapter",
    "crates/pi-client-tool-gateway",
    "crates/cognitive-state-projection",
]
exclude = [
    "apps/menubar/src-tauri",
]

[workspace.package]
version = "0.9.159-dev"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE.md"
repository = "https://github.com/Startempire-Wire/focusa"

[workspace.lints.clippy]
# Lints added here are workspace-wide allowances for lints that fire on
# pre-existing code. Each lint should be removed and the underlying code
# fixed incrementally. New code SHOULD NOT introduce any of these patterns.
collapsible_if = "allow"
useless_format = "allow"
question_mark_used = "allow"
let_underscore_must_use = "allow"
single_match_else = "allow"
needless_pass_by_value = "allow"

[workspace.lints.rust]
# Workspace-wide allowances for legacy unused-code lints. Each entry should
# be removed and the underlying code either deleted or marked `#[allow]`
# at the call site (for genuinely-kept-for-API stability).
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[workspace.dependencies]
agent-stateful-cognitive-runtime = { path = "crates/agent-stateful-cognitive-runtime" }
letta-adapter = { path = "crates/letta-adapter" }
pi-client-tool-gateway = { path = "crates/pi-client-tool-gateway" }
cognitive-state-projection = { path = "crates/cognitive-state-projection" }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "net", "io-util", "io-std", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
keyring = "3"
petgraph = "0.8"
tree-sitter = "0.25"
axum = { version = "0.8", features = ["json"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Hashing (ECS content addressing)
sha2 = "0.10"
ed25519-dalek = "2.2"
base64 = "0.22"
hex = "0.4"

# Internal crates
focusa-core = { path = "crates/focusa-core" }
focusa-license = { path = "crates/focusa-license" }
focusa-terminal-ui = { path = "crates/focusa-terminal-ui" }

# Terminal UI (shared between CLI installer and TUI)
ratatui = "0.30"
crossterm = "0.28"
signal-hook = "0.3"

# ── Performance profiles ──────────────────────────────────────────────
# Release defaults: lto=false, codegen-units=16, panic=unwind
# These overrides squeeze meaningful perf at acceptable compile cost.
[profile.release]
opt-level = 3
lto = "thin"            # cross-crate inlining + dead-code elimination; ~20% speedup
strip = true             # remove debug symbols (~2MB off binary, no runtime cost)
panic = "abort"          # abort instead of unwind — smaller, faster, no unwinding tables

# Dev builds: keep fast incremental compile
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"  # faster debug builds on split-debuginfo platforms
