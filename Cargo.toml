[workspace]
resolver = "2"
members = [
    "crates/focusa-core",
    "crates/focusa-cli",
    "crates/focusa-api",
    "crates/focusa-tui",
]
exclude = [
    "apps/menubar/src-tauri",
]

[workspace.package]
version = "0.9.33-dev"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE.md"
repository = "https://github.com/Startempire-Wire/focusa"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "net"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["json"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Hashing (ECS content addressing)
sha2 = "0.10"
hex = "0.4"

# Internal crates
focusa-core = { path = "crates/focusa-core" }

# ── Performance profiles ──────────────────────────────────────────────
# Release defaults: lto=false, codegen-units=16, panic=unwind
# These overrides squeeze meaningful perf at acceptable compile cost.
[profile.release]
opt-level = 3
lto = "thin"            # cross-crate inlining + dead-code elimination; ~20% speedup
strip = true             # remove debug symbols (~2MB off binary, no runtime cost)
panic = "abort"          # abort instead of unwind — smaller, faster, no unwinding tables

# Dev builds: keep fast incremental compile
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"  # faster debug builds on split-debuginfo platforms
