# Codemagic macOS build lane — Spec 177 CI parity stop-gap (2026-08-24).
# Restores the third OS of the canonical Release matrix: GitHub hosted
# macos-latest is billing-locked, Cirrus is defunct, AppVeyor free tier is
# Windows-only. Codemagic personal accounts include 500 free macOS M2
# minutes/month — sufficient for tag-gated menubar package proofs.
#
# Trigger policy: release/dev tags ONLY. Push/PR builds stay on the free
# self-hosted Linux + AppVeyor Windows lanes so the minute budget is never
# burned on ordinary development.
#
# Unplug: delete this file when GH hosted macOS billing is settled and the
# canonical Release matrix is restored there.

workflows:
  menubar-macos-package-proof:
    name: Menubar macOS package proof
    max_build_duration: 40
    when:
      changeset:
        includes:
          - "apps/menubar/**"
          - "codemagic.yaml"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
      cancel_previous_builds: true
    environment:
      node: v22.12.0
      xcode: latest
      groups:
        - github_credentials
      vars:
        APP_DIR: apps/menubar
    scripts:
      - name: Show build context
        script: |
          echo "Tag: $CM_TAG"
          echo "Commit: $CM_COMMIT"
          sw_vers
          node --version && npm --version
      - name: Install dependencies
        script: |
          cd apps/menubar
          npm ci
      - name: Typecheck + web build
        script: |
          cd apps/menubar
          npm run check
          npm run build
      - name: Tauri package proof (ad-hoc signed, non-release)
        script: |
          command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version && cargo --version
          cd apps/menubar
          export APPLE_SIGNING_IDENTITY=-
          npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Validate macOS bundle
        script: |
          set -euo pipefail
                    APP_PATH=$(find apps/menubar/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_PATH" 2>/dev/null || true
          codesign -d "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'
          echo "✓ Menubar macOS bundle proven (ad-hoc signature)"
    publishing:
      email:
        recipients:
          - verious.smith@philoveracity.com
        notify:
          success: true
          failure: true
